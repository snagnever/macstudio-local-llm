# gitleaks configuration for macstudio-local-llm
#
# Keep the full default ruleset; add a narrow allowlist for three benchmark
# false positives that the generic-api-key heuristic flags:
#
#   1. SHA-256 content fingerprints in telemetry (fixture_token_hash,
#      greedy_tokens_hash, static_prefix_hash, ...) — 64 lowercase hex chars.
#      These are deterministic hashes of prompt fixtures, not credentials.
#   2. A long config field-name literal in a `key == "..."` comparison
#      (`qwen3x_ane_prefill_sequence_length`) misread as a secret.
#   3. The model id `qwen3.6-35b-a3b-mtp`, passed as `KEY=` / `MODEL_KEY=` in
#      the bench/qwen3.6-mtp scripts and flagged by entropy.
#
# The allowlist is pattern-scoped, not path-scoped, so a real secret dropped
# into any file is still caught. The pre-commit hook (.pre-commit-config.yaml)
# and the secret-scan workflow both read this file.

[extend]
useDefault = true

[allowlist]
description = "Benchmark telemetry hashes, a config field-name literal and a model id, not secrets"
regexes = [
  '''^[0-9a-f]{64}$''',
  '''ane_prefill_sequence_length''',
  '''^qwen3\.6-35b-a3b-mtp$''',
]
