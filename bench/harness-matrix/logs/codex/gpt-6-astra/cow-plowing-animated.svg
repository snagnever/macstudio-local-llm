    <linearGradient id="steel" x2="1" y2="0.6"><stop stop-color="#d3dbe0"/><stop offset="0.5" stop-color="#899ca0"/><stop offset="1" stop-color="#455d64"/></linearGradient>
    <pattern id="blades" width="75" height="46" patternUnits="userSpaceOnUse"><path d="M12 36l-5-10m5 10l5-15M49 18l-4-9m4 9l6-13M65 43l4-10" fill="none" stroke="#456d36" stroke-width="2" opacity=".55"/></pattern>
