<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <title>Animated cow pulling a wooden plow through a grassy field</title>
  <desc>A black and white cow leans forward against a wooden shoulder yoke. Chains pull a wooden plow with a steel share through turf. Three dark furrows trail behind it.</desc>
  <style>
    .step-a { animation: step 1.8s ease-in-out infinite; }
    .step-b { animation: step 1.8s ease-in-out -.9s infinite; }
    .tail { transform-origin: 567px 352px; animation: swish 3.6s ease-in-out infinite; }
    .plow { transform-origin: 699px 484px; animation: bite .9s ease-in-out infinite; }
    .dust { animation: scatter 1.8s ease-out infinite; }
    .dust.second { animation-delay: -.6s; }
    .dust.third { animation-delay: -1.2s; }
    @keyframes step { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes swish { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }
    @keyframes bite { 0%,100% { transform: rotate(-.35deg); } 50% { transform: rotate(.35deg); } }
    @keyframes scatter { 0% { transform: translate(0,0); opacity: 0; } 12% { opacity: .75; } 65% { opacity: .55; } 100% { transform: translate(47px,17px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .step-a,.step-b,.tail,.plow,.dust { animation: none; } .dust { opacity: 0; } }
  </style>
