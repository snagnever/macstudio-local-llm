<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>A family picnic above the clouds</title>
  <desc>A red and white striped hot air balloon rests on a flat cloud. A parent points at the balloon beside a child. Another parent and child spread opposite corners of a checkered picnic blanket. An open basket contains a thermos, grapes, and a sandwich.</desc>
