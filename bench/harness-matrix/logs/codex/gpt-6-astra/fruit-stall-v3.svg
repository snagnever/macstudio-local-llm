<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850">
  <title>Fresh Fruit market stall</title>
  <desc>A smiling vendor with a mustache stands under a red and white canopy. Apples fill the left wicker basket. Yellow bananas sit beside them. A large watermelon slice rests at the center of the wooden counter. Oranges fill the right wicker basket. A hanging sign reads Fresh Fruit. Cobblestones and distant market stalls complete the scene.</desc>
