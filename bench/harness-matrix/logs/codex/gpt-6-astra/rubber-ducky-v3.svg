  <title>Rubber duck in a soapy claw-foot bathtub</title>
  <desc>A yellow rubber duck with an orange beak and a black dot eye floats in blue water. The lower third of its body is submerged. Circular ripples surround it. Iridescent soap bubbles rest on its head, beside it, and against the right side of the white bathtub.</desc>
