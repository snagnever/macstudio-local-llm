  <circle cx="1057" cy="91" r="49" fill="#ffe590" opacity=".78"/>
  <path d="M0 264h1200v240H0z" fill="#ddc39f"/>
  <path d="M0 504h1200v296H0z" fill="url(#paving)"/>
  <path d="M0 264h1200" stroke="#9c7555" stroke-width="6"/>

