<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Fruit stall in the market</title>
  <desc id="description">A clear, detailed market scene centered on a striped fruit stall, with labeled fruit crates, baskets, a vendor, shoppers, neighboring stalls, and market signs.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bde6f5"/>
      <stop offset="1" stop-color="#fff0c7"/>
    </linearGradient>
    <linearGradient id="timber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bf7541"/>
      <stop offset="0.48" stop-color="#92502f"/>
      <stop offset="1" stop-color="#66331f"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ba6f3c"/>
      <stop offset="1" stop-color="#774027"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#3d281d" flood-opacity=".28"/>
    </filter>
    <pattern id="paving" width="120" height="58" patternUnits="userSpaceOnUse">
      <rect width="120" height="58" fill="#d9c49f"/>
      <path d="M0 1h120M0 57h120M60 1v28M0 29h120M25 29v28M95 29v28" fill="none" stroke="#b9a17d" stroke-width="2" opacity=".65"/>
    </pattern>
    <clipPath id="appleBox"><path d="M188 498h210l-14 140H201z"/></clipPath>
    <clipPath id="orangeBox"><path d="M421 485h269l-11 153H434z"/></clipPath>
    <clipPath id="pearBox"><path d="M713 498h226l-10 140H725z"/></clipPath>
  </defs>

  <!-- Open-air market environment -->
