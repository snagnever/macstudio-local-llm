    <g transform="rotate(1 555 464)"><rect x="494" y="432" width="122" height="55" rx="5" fill="#fff5d5" stroke="#4b372a" stroke-width="3"/><text x="555" y="454" font-size="14" fill="#3e2d23">ORANGES</text><text x="555" y="477" font-size="19" fill="#d26d20">$3 / lb</text></g>
    <g transform="rotate(-2 827 476)"><rect x="775" y="445" width="104" height="54" rx="5" fill="#fff5d5" stroke="#4b372a" stroke-width="3"/><text x="827" y="467" font-size="14" fill="#3e2d23">PEARS</text><text x="827" y="489" font-size="19" fill="#638737">$2 / lb</text></g>
