<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">Animated half-buried barrel of treasure</title>
  <desc id="desc">A wooden treasure barrel lies half buried in beach sand. Gold coins and gems fill its open end and spill outward while coins bounce, jewels sparkle, waves move, and loose sand drifts.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#087eac"/><stop offset=".54" stop-color="#74cbd4"/><stop offset="1" stop-color="#ffd596"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3bb4bc"/><stop offset="1" stop-color="#12647f"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8dc87"/><stop offset=".55" stop-color="#dfa748"/><stop offset="1" stop-color="#b57029"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d69047"/><stop offset=".4" stop-color="#a3592b"/><stop offset=".75" stop-color="#743d20"/><stop offset="1" stop-color="#472216"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#879297"/><stop offset=".38" stop-color="#374044"/><stop offset="1" stop-color="#171b1d"/>
    </linearGradient>
    <radialGradient id="gold" cx="30%" cy="22%" r="80%">
      <stop offset="0" stop-color="#fffbd7"/><stop offset=".24" stop-color="#ffe66a"/><stop offset=".62" stop-color="#eab010"/><stop offset="1" stop-color="#985504"/>
    </radialGradient>
    <radialGradient id="dark" cx="42%" cy="38%" r="72%">
      <stop offset="0" stop-color="#3c2113"/><stop offset=".67" stop-color="#150c08"/><stop offset="1" stop-color="#060403"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-60%" width="180%" height="240%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="bodyClip"><path d="M368 200 C466 169 657 214 736 303 L679 520 C564 548 398 496 323 407 Z"/></clipPath>
    <style>
      .wave-a{animation:waveA 4.8s ease-in-out infinite alternate}.wave-b{animation:waveB 6s ease-in-out infinite alternate}
      .sun{transform-box:fill-box;transform-origin:center;animation:sunPulse 4s ease-in-out infinite}
      .glint{transform-box:fill-box;transform-origin:center;animation:glint 2.4s ease-in-out infinite}
      .glint.delay{animation-delay:-1.2s}.glint.slow{animation-duration:3.4s;animation-delay:-.7s}
      .coin-hop{transform-box:fill-box;transform-origin:center;animation:coinHop 2.8s cubic-bezier(.45,.05,.55,.95) infinite}
      .coin-hop.delay{animation-delay:-1.35s;animation-duration:3.2s}
      .coin-rock{transform-box:fill-box;transform-origin:center;animation:coinRock 2s ease-in-out infinite alternate}
      .jewel-pulse{transform-box:fill-box;transform-origin:center;animation:jewelPulse 2.2s ease-in-out infinite}
      .jewel-pulse.delay{animation-delay:-1.1s}
      .sand-drift{animation:sandDrift 5s linear infinite}.sand-drift.delay{animation-delay:-2.5s}
      @keyframes waveA{from{transform:translateX(-20px)}to{transform:translateX(24px)}}
      @keyframes waveB{from{transform:translateX(18px)}to{transform:translateX(-28px)}}
      @keyframes sunPulse{0%,100%{transform:scale(1);opacity:.83}50%{transform:scale(1.08);opacity:1}}
      @keyframes glint{0%,28%,100%{transform:scale(.15) rotate(0deg);opacity:0}46%{transform:scale(1.15) rotate(45deg);opacity:1}63%{transform:scale(.2) rotate(90deg);opacity:0}}
      @keyframes coinHop{0%,18%,100%{transform:translateY(0) rotate(0deg)}48%{transform:translateY(-34px) rotate(150deg)}72%{transform:translateY(0) rotate(260deg)}82%{transform:translateY(-8px) rotate(310deg)}}
      @keyframes coinRock{from{transform:rotate(-5deg) translateY(0)}to{transform:rotate(7deg) translateY(-4px)}}
      @keyframes jewelPulse{0%,100%{transform:scale(1);filter:saturate(1)}50%{transform:scale(1.13);filter:saturate(1.5) brightness(1.2)}}
      @keyframes sandDrift{0%{transform:translateX(-25px);opacity:0}20%{opacity:.6}80%{opacity:.35}100%{transform:translateX(95px);opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
    </style>
  </defs>

  <rect width="960" height="700" fill="url(#sky)"/>
  <g class="sun"><circle cx="810" cy="105" r="57" fill="#fff0ae"/><circle cx="810" cy="105" r="78" fill="#fff0ae" opacity=".18"/></g>
  <path d="M0 282 Q130 258 260 281 T520 279 T775 268 T960 259 V382 H0Z" fill="url(#water)"/>
  <g class="wave-a"><path d="M-55 302 Q52 285 159 303 T371 299 T588 292 T1015 275" fill="none" stroke="#d6f7e9" stroke-width="8" opacity=".78"/></g>
  <g class="wave-b"><path d="M-50 337 Q52 321 147 339 T340 335 T534 327 T732 315 T1015 307" fill="none" stroke="#8edbd5" stroke-width="5" opacity=".75"/></g>
  <path d="M0 379 Q150 326 305 371 T620 358 T960 340 V700 H0Z" fill="url(#sand)"/>
  <ellipse cx="500" cy="535" rx="311" ry="58" fill="#60331b" opacity=".34" filter="url(#shadow)"/>

  <!-- Tilted barrel body -->
  <g transform="rotate(11 516 356)">
    <path d="M368 200 C466 169 657 214 736 303 L679 520 C564 548 398 496 323 407 Z" fill="url(#wood)" stroke="#32170e" stroke-width="11"/>
    <g clip-path="url(#bodyClip)">
      <path d="M402 182 Q435 338 368 468 M480 183 Q517 356 462 510 M565 198 Q607 375 560 535 M649 228 Q694 379 659 528" fill="none" stroke="#e7a25a" stroke-width="10" opacity=".5"/>
      <path d="M351 274 Q525 233 719 333 M329 404 Q507 374 698 469" fill="none" stroke="url(#iron)" stroke-width="30"/>
      <path d="M355 264 Q525 229 716 325 M334 394 Q507 369 694 461" fill="none" stroke="#a0aaad" stroke-width="5" opacity=".6"/>
      <path d="M441 229 l17 29 -21 29 27 31 -24 39 M608 279 l-22 25 24 29 -28 34" fill="none" stroke="#4f2514" stroke-width="6" opacity=".8"/>
    </g>
    <path d="M736 303 C787 350 765 463 679 520" fill="#442218" stroke="#2a120c" stroke-width="11"/>
    <path d="M742 329 C768 371 746 450 692 495" fill="none" stroke="#be7239" stroke-width="9" opacity=".52"/>
  </g>

  <!-- Open end -->
  <g transform="rotate(11 339 337)">
    <ellipse cx="339" cy="337" rx="119" ry="151" fill="url(#iron)" stroke="#111416" stroke-width="13"/>
    <ellipse cx="344" cy="336" rx="89" ry="120" fill="url(#dark)" stroke="#784625" stroke-width="9"/>
    <path d="M268 253 Q343 187 418 258" fill="none" stroke="#e0994e" stroke-width="13" opacity=".82"/>
    <path d="M250 392 Q334 477 427 399" fill="none" stroke="#6d361e" stroke-width="11" opacity=".82"/>
  </g>

  <!-- Treasure packed inside -->
  <g stroke="#744003" stroke-width="4">
    <ellipse cx="287" cy="273" rx="39" ry="15" fill="url(#gold)" transform="rotate(-19 287 273)"/>
    <ellipse cx="339" cy="245" rx="38" ry="14" fill="url(#gold)" transform="rotate(11 339 245)"/>
    <ellipse cx="390" cy="275" rx="40" ry="15" fill="url(#gold)" transform="rotate(24 390 275)"/>
    <ellipse cx="270" cy="320" rx="40" ry="15" fill="url(#gold)" transform="rotate(8 270 320)"/>
    <ellipse cx="331" cy="301" rx="42" ry="16" fill="url(#gold)" transform="rotate(-7 331 301)"/>
    <ellipse cx="398" cy="325" rx="40" ry="15" fill="url(#gold)" transform="rotate(15 398 325)"/>
    <ellipse cx="268" cy="370" rx="40" ry="15" fill="url(#gold)" transform="rotate(-11 268 370)"/>
    <ellipse cx="329" cy="357" rx="43" ry="16" fill="url(#gold)" transform="rotate(6 329 357)"/>
    <ellipse cx="392" cy="380" rx="41" ry="15" fill="url(#gold)" transform="rotate(-5 392 380)"/>
    <ellipse cx="301" cy="414" rx="41" ry="15" fill="url(#gold)" transform="rotate(14 301 414)"/>
    <ellipse cx="365" cy="419" rx="41" ry="15" fill="url(#gold)" transform="rotate(-10 365 419)"/>
  </g>

  <!-- Crown -->
  <g class="jewel-pulse">
    <path d="M287 343 L282 290 L307 315 L328 277 L349 313 L378 285 L372 345 Z" fill="url(#gold)" stroke="#884b05" stroke-width="5"/>
    <path d="M288 330 Q330 342 373 330 L372 350 Q330 363 288 349Z" fill="#edb516" stroke="#884b05" stroke-width="4"/>
    <circle cx="328" cy="338" r="8" fill="#df3657" stroke="#7b1b31" stroke-width="3"/>
    <circle cx="350" cy="336" r="7" fill="#3bd0e0" stroke="#176780" stroke-width="3"/>
    <circle cx="306" cy="336" r="7" fill="#66d15e" stroke="#276e38" stroke-width="3"/>
  </g>
  <path class="jewel-pulse delay" d="M378 300 l23-32 25 33 -24 36Z" fill="#43d3e3" stroke="#176780" stroke-width="5"/>
  <path class="jewel-pulse" d="M251 390 l20-29 23 30 -22 32Z" fill="#9e69e9" stroke="#583187" stroke-width="5"/>
  <path class="jewel-pulse delay" d="M383 393 l22-31 25 32 -23 35Z" fill="#e64463" stroke="#841d35" stroke-width="5"/>

  <!-- Treasure spilling from opening -->
  <g stroke="#744003" stroke-width="4">
    <ellipse cx="252" cy="441" rx="42" ry="16" fill="url(#gold)" transform="rotate(-13 252 441)"/>
    <ellipse cx="305" cy="459" rx="42" ry="16" fill="url(#gold)" transform="rotate(9 305 459)"/>
    <ellipse cx="360" cy="473" rx="41" ry="15" fill="url(#gold)" transform="rotate(-6 360 473)"/>
    <ellipse cx="416" cy="487" rx="42" ry="16" fill="url(#gold)" transform="rotate(12 416 487)"/>
    <ellipse cx="476" cy="498" rx="41" ry="15" fill="url(#gold)" transform="rotate(-8 476 498)"/>
    <ellipse cx="538" cy="503" rx="39" ry="14" fill="url(#gold)" transform="rotate(8 538 503)"/>
  </g>
  <g class="coin-hop" stroke="#744003" stroke-width="4"><ellipse cx="450" cy="468" rx="29" ry="11" fill="url(#gold)"/><path d="M436 466 Q450 459 464 466" fill="none" stroke="#fff1a0" stroke-width="3"/></g>
  <g class="coin-hop delay" stroke="#744003" stroke-width="4"><ellipse cx="520" cy="488" rx="27" ry="10" fill="url(#gold)"/><path d="M507 486 Q520 480 533 486" fill="none" stroke="#fff1a0" stroke-width="3"/></g>
  <g class="coin-rock" stroke="#744003" stroke-width="4"><ellipse cx="351" cy="480" rx="40" ry="15" fill="url(#gold)"/></g>

  <!-- Pearls drape from the barrel -->
  <path d="M263 398 Q302 441 352 442 Q406 443 443 418" fill="none" stroke="#d5c39d" stroke-width="4"/>
  <g fill="#fffbed" stroke="#a89570" stroke-width="2.5">
    <circle cx="263" cy="398" r="9"/><circle cx="275" cy="410" r="9"/><circle cx="289" cy="422" r="9"/><circle cx="305" cy="431" r="9"/>
    <circle cx="323" cy="438" r="9"/><circle cx="343" cy="442" r="9"/><circle cx="363" cy="442" r="9"/><circle cx="383" cy="439" r="9"/>
    <circle cx="401" cy="434" r="9"/><circle cx="418" cy="427" r="9"/><circle cx="433" cy="419" r="9"/>
  </g>

  <!-- Foreground sand mound visibly buries the lower half -->
  <path d="M0 510 Q109 463 211 482 Q289 497 364 517 Q453 540 548 514 Q641 489 716 451 Q826 395 960 457 V700 H0Z" fill="#bd792c"/>
  <path d="M0 534 Q113 490 220 506 Q307 522 391 538 Q486 556 574 530 Q671 502 753 461 Q849 414 960 478 V700 H0Z" fill="url(#sand)"/>
  <path d="M91 517 Q198 475 304 519" fill="none" stroke="#f9df91" stroke-width="10" stroke-linecap="round"/>
  <path d="M587 524 Q694 473 795 469" fill="none" stroke="#f9df91" stroke-width="9" stroke-linecap="round"/>

  <!-- Coins remain on top of the mound -->
  <g stroke="#744003" stroke-width="4">
    <ellipse cx="325" cy="517" rx="41" ry="15" fill="url(#gold)" transform="rotate(7 325 517)"/>
    <ellipse cx="400" cy="530" rx="42" ry="16" fill="url(#gold)" transform="rotate(-6 400 530)"/>
    <ellipse cx="478" cy="526" rx="41" ry="15" fill="url(#gold)" transform="rotate(10 478 526)"/>
    <ellipse cx="550" cy="513" rx="39" ry="14" fill="url(#gold)" transform="rotate(-10 550 513)"/>
  </g>
  <path class="jewel-pulse" d="M435 518 l20-29 23 30 -22 32Z" fill="#9d68e8" stroke="#583187" stroke-width="5"/>
  <path class="jewel-pulse delay" d="M517 506 l18-26 21 27 -20 29Z" fill="#65d162" stroke="#276e38" stroke-width="5"/>

  <!-- Repeating sparkle stars -->
  <g class="glint" filter="url(#glow)" fill="#fffbd4"><path d="M242 276 l5 13 13 5 -13 5 -5 13 -5-13 -13-5 13-5Z"/></g>
  <g class="glint delay" filter="url(#glow)" fill="#fffbd4"><path d="M414 355 l6 15 15 6 -15 6 -6 15 -6-15 -15-6 15-6Z"/></g>
  <g class="glint slow" filter="url(#glow)" fill="#fffbd4"><path d="M502 474 l5 13 13 5 -13 5 -5 13 -5-13 -13-5 13-5Z"/></g>
  <g class="glint delay" filter="url(#glow)" fill="#fffbd4"><path d="M376 508 l4 11 11 4 -11 4 -4 11 -4-11 -11-4 11-4Z"/></g>

  <!-- Wind-driven sand grains -->
  <g class="sand-drift" fill="#ffe5a2" opacity=".55"><circle cx="635" cy="553" r="3"/><circle cx="658" cy="546" r="2"/><circle cx="679" cy="557" r="2.5"/><circle cx="701" cy="550" r="2"/></g>
  <g class="sand-drift delay" fill="#ffe5a2" opacity=".5"><circle cx="118" cy="572" r="2.5"/><circle cx="142" cy="565" r="2"/><circle cx="165" cy="576" r="3"/><circle cx="188" cy="569" r="2"/></g>
  <g fill="#85501e" opacity=".6"><ellipse cx="83" cy="609" rx="8" ry="3"/><ellipse cx="196" cy="650" rx="6" ry="2"/><ellipse cx="632" cy="590" rx="8" ry="3"/><ellipse cx="818" cy="628" rx="9" ry="3"/><ellipse cx="892" cy="560" rx="5" ry="2"/></g>
</svg>
