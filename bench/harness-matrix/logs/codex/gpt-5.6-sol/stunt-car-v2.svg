<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">Stunt car jumping through a circle of fire</title>
  <desc id="description">A red stunt car is airborne inside a complete flaming hoop, between a launch ramp and a landing ramp in a night arena.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050917"/>
      <stop offset=".58" stop-color="#17243b"/>
      <stop offset="1" stop-color="#51211f"/>
    </linearGradient>
    <radialGradient id="sunsetGlow">
      <stop offset="0" stop-color="#e9552c" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#9d2830" stop-opacity=".12"/>
      <stop offset="1" stop-color="#09101e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff695d"/>
      <stop offset=".42" stop-color="#df2634"/>
      <stop offset="1" stop-color="#760d19"/>
    </linearGradient>
    <linearGradient id="windshield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6fbff"/>
      <stop offset=".28" stop-color="#6da7be"/>
      <stop offset="1" stop-color="#122337"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aeb8c2"/>
      <stop offset=".35" stop-color="#5a6570"/>
      <stop offset="1" stop-color="#242b34"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252832"/>
      <stop offset="1" stop-color="#090b10"/>
    </linearGradient>
    <radialGradient id="hotFlame" cx="50%" cy="78%" r="70%">
      <stop offset="0" stop-color="#fff6a8"/>
      <stop offset=".38" stop-color="#ffd52f"/>
      <stop offset=".72" stop-color="#ff7418"/>
      <stop offset="1" stop-color="#e92b10"/>
    </radialGradient>
    <filter id="hoopGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="fireGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="carShadow" x="-30%" y="-45%" width="180%" height="210%">
      <feDropShadow dx="11" dy="17" stdDeviation="13" flood-color="#000" flood-opacity=".72"/>
    </filter>
    <pattern id="stands" width="38" height="30" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="8" r="4" fill="#22293a"/>
      <path d="M2 30c1-11 16-11 17 0" fill="#1b2130"/>
      <circle cx="29" cy="14" r="4" fill="#171d2a"/>
      <path d="M21 30c1-10 15-10 16 0" fill="#141925"/>
    </pattern>
    <g id="flame">
      <path d="M-24 12C-48-24-17-58 3-79c-7 32 14 38 13 61 13-19 13-39 34-56 4 35 22 57 1 86C35 35-9 38-24 12Z" fill="url(#hotFlame)" stroke="#ff9e17" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-5 13C-20-9-3-30 9-43c-3 21 12 25 8 42 9-10 12-22 23-29 0 25 4 40-13 49C15 26 2 24-5 13Z" fill="#fff073"/>
    </g>
  </defs>

  <rect width="1400" height="900" fill="url(#night)"/>
  <ellipse cx="700" cy="355" rx="570" ry="405" fill="url(#sunsetGlow)"/>
  <g fill="#dceaff" opacity=".75">
    <circle cx="90" cy="82" r="2"/><circle cx="190" cy="145" r="1.5"/><circle cx="304" cy="72" r="2"/>
    <circle cx="445" cy="118" r="1.5"/><circle cx="780" cy="67" r="2"/><circle cx="914" cy="130" r="1.5"/>
    <circle cx="1068" cy="70" r="2"/><circle cx="1230" cy="140" r="1.5"/><circle cx="1326" cy="76" r="2"/>
  </g>
  <path d="M0 592l116-45 102 30 105-62 115 64 119-43 127 51 128-48 123 49 120-73 118 60 147-54v212H0Z" fill="#101724"/>
  <path d="M0 617h1400v125H0z" fill="url(#stands)"/>
  <g fill="#ffd25b" opacity=".7">
