  <path d="M0 764h1400v136H0z" fill="url(#ground)"/>
  <path d="M0 768h1400" stroke="#444a53" stroke-width="9"/>
  <ellipse cx="700" cy="801" rx="325" ry="31" fill="#000" opacity=".35"/>
  <g fill="#ffb12d" opacity=".9">
    <circle cx="372" cy="449" r="4"/><circle cx="389" cy="413" r="3"/><circle cx="1011" cy="415" r="4"/>
    <circle cx="1027" cy="464" r="3"/><circle cx="507" cy="102" r="3"/><circle cx="878" cy="94" r="4"/>
