      <use href="#flame" transform="translate(941 253) rotate(62) scale(1.03)"/>
      <use href="#flame" transform="translate(960 326) rotate(82) scale(1.08)"/>
      <use href="#flame" transform="translate(957 403) rotate(98) scale(1.04)"/>
      <use href="#flame" transform="translate(932 476) rotate(116) scale(1.08)"/>
      <use href="#flame" transform="translate(886 535) rotate(132) scale(1.05)"/>
      <use href="#flame" transform="translate(824 578) rotate(148) scale(1.08)"/>
      <use href="#flame" transform="translate(750 602) rotate(166) scale(1.04)"/>
      <use href="#flame" transform="translate(674 605) rotate(184) scale(1.08)"/>
      <use href="#flame" transform="translate(599 584) rotate(201) scale(1.05)"/>
      <use href="#flame" transform="translate(537 543) rotate(221) scale(1.08)"/>
      <use href="#flame" transform="translate(487 486) rotate(235) scale(1.04)"/>
      <use href="#flame" transform="translate(454 416) rotate(254) scale(1.08)"/>
