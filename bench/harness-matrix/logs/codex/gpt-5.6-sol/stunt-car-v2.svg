      <use href="#flame" transform="translate(459 266) rotate(287) scale(1.08)"/>
      <use href="#flame" transform="translate(498 202) rotate(306) scale(1.04)"/>
      <use href="#flame" transform="translate(554 151) rotate(322) scale(1.08)"/>
      <use href="#flame" transform="translate(624 118) rotate(344) scale(1.05)"/>
    </g>
