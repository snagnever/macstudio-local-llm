    <path d="M402 732h106M892 732h106" stroke="#929ca6" stroke-width="14" stroke-linecap="round"/>
  </g>

  <g aria-label="airborne red stunt car" transform="translate(398 284) rotate(-7 300 118)" filter="url(#carShadow)">
    <path d="M41 154l28-57c8-17 29-29 55-32l101-12 65-45h159c31 1 58 15 77 42l32 47 73 20 26 35-10 38-70 4H52L19 176l5-16Z" fill="url(#paint)" stroke="#4d0913" stroke-width="7" stroke-linejoin="round"/>
    <path d="M238 53l64-34h73l10 52z" fill="url(#windshield)" stroke="#142131" stroke-width="7"/>
    <path d="M395 19h47c25 2 43 14 59 36l16 29-115-13z" fill="url(#windshield)" stroke="#142131" stroke-width="7"/>
    <path d="M389 16l9 58M297 18l-58 38" stroke="#eaf7fa" stroke-width="6" opacity=".72"/>
    <path d="M70 104l-31 48 133-10 45-80-92 13c-26 4-43 13-55 29Z" fill="#aa1122" opacity=".76"/>
    <path d="M225 54h294" stroke="#fff" stroke-width="7" opacity=".78"/>
    <path d="M202 55h29v103h-29zM514 84h28v74h-28z" fill="#f7f0df" opacity=".9"/>
    <path d="M178 137c21-26 77-31 110-1M449 137c22-25 78-27 112-1" fill="none" stroke="#650c17" stroke-width="14"/>
    <g>
      <circle cx="236" cy="174" r="56" fill="#07090d" stroke="#242b34" stroke-width="9"/>
      <circle cx="236" cy="174" r="32" fill="#b8c1c9" stroke="#555f69" stroke-width="6"/>
      <circle cx="236" cy="174" r="9" fill="#202733"/>
      <path d="M236 145v58M207 174h58M216 154l40 40M256 154l-40 40" stroke="#77838e" stroke-width="5"/>
      <circle cx="512" cy="174" r="56" fill="#07090d" stroke="#242b34" stroke-width="9"/>
      <circle cx="512" cy="174" r="32" fill="#b8c1c9" stroke="#555f69" stroke-width="6"/>
      <circle cx="512" cy="174" r="9" fill="#202733"/>
      <path d="M512 145v58M483 174h58M492 154l40 40M532 154l-40 40" stroke="#77838e" stroke-width="5"/>
    </g>
    <path d="M25 157l101-7 19 29-104 4zM571 151l59 3 5 24-78 4z" fill="#171b22"/>
    <path d="M81 110l-24 9-11 27 45-6z" fill="#fff6b8" stroke="#ffc930" stroke-width="5"/>
    <path d="M558 115l45 13 10 18-57-8z" fill="#ff5a32"/>
