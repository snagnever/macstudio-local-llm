<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Animated family picnic on top of the clouds</title>
  <desc id="desc">Two parents and two children set up a picnic tarp and arrange food beside their landed hot air balloon. Clouds drift, the balloon sways, the tarp flutters, and the family moves continuously.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61b9e8"/>
      <stop offset="0.6" stop-color="#c2eaf9"/>
      <stop offset="1" stop-color="#f2fbff"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff7b5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff7b5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.7" stop-color="#f0f8fb"/>
      <stop offset="1" stop-color="#c9dfe9"/>
    </linearGradient>
    <linearGradient id="balloon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bd344b"/>
      <stop offset="0.22" stop-color="#ed694c"/>
      <stop offset="0.48" stop-color="#ffd35e"/>
      <stop offset="0.72" stop-color="#ed694c"/>
      <stop offset="1" stop-color="#bd344b"/>
    </linearGradient>
    <linearGradient id="tarp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44b5d5"/>
      <stop offset="1" stop-color="#145b8c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#315f73" flood-opacity="0.24"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#244d60" flood-opacity="0.24"/>
    </filter>
    <clipPath id="envelopeClip">
      <path d="M205 72C111 72 59 149 83 236c16 55 71 95 95 147h54c24-52 79-92 95-147 24-87-28-164-122-164Z"/>
    </clipPath>
    <style>
      .far-cloud { animation: cloud-drift 22s linear infinite; }
      .far-cloud.slow { animation-duration: 31s; animation-delay: -13s; }
      .balloon-rig { transform-origin: 205px 552px; animation: balloon-sway 4.8s ease-in-out infinite; }
      .envelope-highlight { animation: glow 3.2s ease-in-out infinite; }
      .main-cloud { animation: cloud-breathe 6s ease-in-out infinite; transform-origin: 600px 650px; }
      .tarp-corner { animation: tarp-flutter 1.8s ease-in-out infinite; transform-origin: 846px 496px; }
      .pulling-arm { animation: pull 1.5s ease-in-out infinite; transform-origin: 430px 455px; }
      .placing-arm { animation: place 1.8s ease-in-out infinite; transform-origin: 941px 447px; }
      .walking-child { animation: step 1.3s ease-in-out infinite; transform-origin: 628px 596px; }
      .pegging-arm { animation: peg 0.9s ease-in-out infinite; transform-origin: 787px 464px; }
      .plate-stack { animation: plates 1.3s ease-in-out infinite; }
      .fruit { animation: fruit-bob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .steam { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; opacity: 0; animation: steam-rise 2.7s ease-out infinite; }
      .steam.two { animation-delay: 1.25s; }
      .flag { animation: flag-wave 1.4s ease-in-out infinite; transform-origin: 333px 194px; }
      @keyframes cloud-drift { from { transform: translateX(-180px); } to { transform: translateX(1240px); } }
      @keyframes balloon-sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
      @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
      @keyframes cloud-breathe { 0%,100% { transform: translateY(0) scaleX(1); } 50% { transform: translateY(-4px) scaleX(1.006); } }
      @keyframes tarp-flutter { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(1px,-9px) rotate(-1deg); } }
      @keyframes pull { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-7deg) translateX(-4px); } }
      @keyframes place { 0%,100% { transform: rotate(0); } 50% { transform: rotate(9deg) translateY(4px); } }
      @keyframes step { 0%,100% { transform: rotate(-1deg) translateY(0); } 50% { transform: rotate(1deg) translateY(-5px); } }
      @keyframes peg { 0%,100% { transform: rotate(0); } 45% { transform: rotate(12deg) translateY(4px); } }
      @keyframes plates { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes fruit-bob { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
      @keyframes steam-rise { 0% { opacity: 0; transform: translateY(8px); } 25% { opacity: .8; } 100% { opacity: 0; transform: translateY(-28px); } }
      @keyframes flag-wave { 0%,100% { transform: skewY(0); } 50% { transform: skewY(5deg); } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1028" cy="106" r="140" fill="url(#sunGlow)"/>
  <circle cx="1028" cy="106" r="45" fill="#fff2a0" opacity="0.9"/>

  <!-- Continuously drifting distant clouds make the altitude visible. -->
  <g class="far-cloud" fill="#fff" opacity="0.7">
    <path d="M0 172c5-24 27-40 52-36 13-30 58-33 75-5 32-8 65 9 68 38 24 0 42 13 46 31H-21c3-14 10-23 21-28Z"/>
  </g>
  <g class="far-cloud slow" fill="#fff" opacity="0.53">
    <path d="M0 278c4-20 22-33 43-30 11-25 49-27 62-2 27-7 53 8 56 32 19 0 34 10 37 25H-18c3-12 9-20 18-25Z"/>
  </g>

  <!-- The entire family scene sits on one breathing cloud island. -->
  <g class="main-cloud" filter="url(#shadow)">
    <path d="M69 553c-54 8-80 43-65 80 12 30 47 42 86 36 8 51 63 77 117 56 34 61 128 74 185 28 56 58 161 57 219 0 66 51 174 38 213-26 61 40 159 13 161-57 58 12 113-25 106-73-4-34-35-60-78-67-8-42-48-67-97-63-25-58-101-73-158-43-37-60-128-61-175-8-35-40-93-49-141-35-29-34-81-38-121-11-31-30-75-32-112-13-20-31-49-47-80-47-27-59-86-69-123-32Z" fill="url(#cloud)" stroke="#c5deea" stroke-width="5"/>
    <ellipse cx="595" cy="620" rx="485" ry="109" fill="#fff" opacity="0.4"/>
  </g>

  <!-- The landed balloon sways gently while its basket remains on the cloud. -->
  <g class="balloon-rig" filter="url(#smallShadow)">
    <path d="M205 72C111 72 59 149 83 236c16 55 71 95 95 147h54c24-52 79-92 95-147 24-87-28-164-122-164Z" fill="url(#balloon)" stroke="#812f40" stroke-width="6"/>
    <g clip-path="url(#envelopeClip)" fill="none" stroke="#fff1ba" stroke-width="18" opacity="0.82">
      <path d="M143 56c-35 123-20 231 62 337"/>
      <path d="M267 56c35 123 20 231-62 337"/>
    </g>
    <path class="envelope-highlight" d="M205 73c-25 102-25 206 0 309" fill="none" stroke="#fff7d5" stroke-width="7"/>
    <path d="M177 383h56l-8 28h-40Z" fill="#66503b" stroke="#433126" stroke-width="4"/>
    <path d="m185 406-17 80m58-80 18 80" stroke="#594333" stroke-width="5"/>
    <path d="M156 475h99l-8 78h-82Z" fill="#b87338" stroke="#633b25" stroke-width="5"/>
    <path d="M164 495h84M161 519h89M183 478v71M209 478v71M235 478v71" stroke="#704127" stroke-width="3"/>
    <path d="M167 553q38 18 78 0" fill="none" stroke="#deedf2" stroke-width="9" stroke-linecap="round"/>
    <path d="m164 546-42 43m127-43 42 42" fill="none" stroke="#775940" stroke-width="5"/>
    <path d="m116 592-11 2m192-2 11 2" stroke="#5b3f2d" stroke-width="9" stroke-linecap="round"/>
    <path d="M330 260v-67" stroke="#684835" stroke-width="4"/>
    <path class="flag" d="M332 194q30 6 49-4v30q-23 10-49 2Z" fill="#4ea46c" stroke="#2f7048" stroke-width="3"/>
  </g>

  <!-- The open picnic basket and travel bag show that the family just unloaded. -->
  <g transform="translate(279 528)" filter="url(#smallShadow)">
    <path d="M6 40h100l-9 75H15Z" fill="#c88642" stroke="#6d4027" stroke-width="4"/>
    <path d="M22 41Q55-15 90 41" fill="none" stroke="#6d4027" stroke-width="9"/>
    <path d="M14 58h87M12 81h91M39 43v68M72 43v68" stroke="#79472a" stroke-width="3"/>
    <path d="M15 38q42-31 90 0" fill="#efd3a2" stroke="#6d4027" stroke-width="4"/>
    <path d="m34 24 5-34h16l5 33m10 3 8-46h15l6 49" fill="#76a54f" stroke="#4b7035" stroke-width="3"/>
    <path d="M123 56h66q18 0 21 19l7 50H111l6-50q2-19 6-19Z" fill="#70518a" stroke="#49345b" stroke-width="4"/>
    <path d="M139 57q1-25 22-25t24 25M116 83h96" fill="none" stroke="#49345b" stroke-width="6"/>
  </g>

  <!-- The blue tarp is still being unfurled. Its upper corner flutters in the breeze. -->
  <path d="M466 525 844 493 1013 680 522 737Z" fill="url(#tarp)" stroke="#104c76" stroke-width="6" filter="url(#smallShadow)"/>
  <path d="M480 537 835 506M537 721l457-52" fill="none" stroke="#83d3e7" stroke-width="4" opacity="0.82"/>
  <g class="tarp-corner">
    <path d="M844 493 913 532 868 522l-38 9Z" fill="#349dc4" stroke="#104c76" stroke-width="4"/>
    <path d="m844 493-14 38 38-9" fill="#65c1da" stroke="#104c76" stroke-width="3"/>
  </g>
  <path d="M466 525l18 37 24-34M1013 680l-40-17 8 41M522 737l18-40-46 10" fill="#2185b5" stroke="#104c76" stroke-width="3"/>

  <!-- Parent one repeatedly pulls the left tarp corner flat. -->
  <g stroke="#40302a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="443" cy="391" r="31" fill="#8d573f"/>
    <path d="M414 389q4-43 32-43 34 1 31 46-14-19-32-11-17 8-31 8Z" fill="#2c2422" stroke="none"/>
    <path d="M421 436q27-25 55 2l17 94-90 2Z" fill="#dc644c"/>
    <g class="pulling-arm">
      <path d="m426 451-49 68 89 17" fill="none" stroke="#8d573f" stroke-width="15"/>
      <circle cx="377" cy="519" r="9" fill="#8d573f" stroke="none"/>
      <circle cx="466" cy="536" r="9" fill="#8d573f" stroke="none"/>
    </g>
    <path d="m471 456 49 57-50 25" fill="none" stroke="#8d573f" stroke-width="15"/>
    <path d="m420 533-36 63 67 6m25-68 36 54 58 3" fill="none" stroke="#405b78" stroke-width="19"/>
    <path d="M374 602h83M563 592h31" stroke="#584033" stroke-width="12"/>
  </g>

  <!-- Parent two repeatedly transfers food from the open container to the tarp. -->
  <g stroke="#403029" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="917" cy="381" r="31" fill="#b97755"/>
    <path d="M888 380q3-43 33-42 34 2 30 46-17-18-32-9-15 9-31 5Z" fill="#483027" stroke="none"/>
    <path d="M892 428q27-24 55 3l15 97-89 1Z" fill="#6c925c"/>
    <path d="m898 444-59 70" fill="none" stroke="#b97755" stroke-width="15"/>
    <g class="placing-arm">
      <path d="m941 448 40 58" fill="none" stroke="#b97755" stroke-width="15"/>
      <circle cx="981" cy="506" r="9" fill="#b97755" stroke="none"/>
      <circle cx="988" cy="510" r="7" fill="#d94e40" stroke="none"/>
    </g>
    <circle cx="839" cy="514" r="9" fill="#b97755" stroke="none"/>
    <path d="m892 528-42 59 69 6m26-65 38 56 59 1" fill="none" stroke="#c39c68" stroke-width="19"/>
    <path d="M841 593h84M1036 586h29" stroke="#5a4032" stroke-width="12"/>
    <path d="M791 513h96l-7 53h-82Z" fill="#efce76"/>
    <path d="M792 513q46-32 94 0" fill="#fff7df"/>
    <path d="M811 520h57" stroke="#e39c42" stroke-width="7"/>
  </g>

  <!-- Older child walks toward the tarp while balancing stacked plates. -->
  <g class="walking-child" stroke="#40312b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="628" cy="399" r="25" fill="#9e6348"/>
    <path d="M605 396q5-35 28-33 25 3 22 37-22-17-50-4Z" fill="#55362c" stroke="none"/>
    <path d="M607 436q22-19 45 1l10 83h-66Z" fill="#f0b640"/>
    <path d="m608 449-44 39m84-36 45 32" fill="none" stroke="#9e6348" stroke-width="12"/>
    <circle cx="564" cy="488" r="7" fill="#9e6348" stroke="none"/>
    <circle cx="693" cy="484" r="7" fill="#9e6348" stroke="none"/>
    <g class="plate-stack">
      <ellipse cx="700" cy="483" rx="34" ry="9" fill="#fff"/>
      <ellipse cx="700" cy="476" rx="30" ry="8" fill="#fff"/>
    </g>
    <path d="m609 520-19 79m54-79 23 77" fill="none" stroke="#4c708f" stroke-width="14"/>
    <path d="M577 601h30M659 599h30" stroke="#584033" stroke-width="10"/>
  </g>

  <!-- Younger child repeatedly presses a peg through the far tarp corner. -->
  <g stroke="#40312b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="769" cy="413" r="24" fill="#c8845c"/>
    <path d="M746 410q5-36 28-34 27 3 22 39-21-16-50-5Z" fill="#794826" stroke="none"/>
    <path d="M748 449q22-18 43 2l13 72-68 3Z" fill="#cc5f88"/>
    <path d="m751 462-32 47" fill="none" stroke="#c8845c" stroke-width="11"/>
    <g class="pegging-arm">
      <path d="m787 465 46 30" fill="none" stroke="#c8845c" stroke-width="11"/>
      <circle cx="833" cy="495" r="7" fill="#c8845c" stroke="none"/>
    </g>
    <circle cx="719" cy="509" r="7" fill="#c8845c" stroke="none"/>
    <path d="m750 525-35 51 55 4m22-56 35 45 45-7" fill="none" stroke="#775091" stroke-width="14"/>
    <path d="M707 581h69M866 563h26" stroke="#553c30" stroke-width="10"/>
    <path d="m831 493 7 19" stroke="#76523b" stroke-width="5"/>
    <circle cx="840" cy="514" r="9" fill="#d7b789"/>
  </g>

  <!-- Bread, sandwiches, fruit, cheese, juice, plates, and a warm drink fill the tarp. -->
  <g filter="url(#smallShadow)">
    <ellipse cx="729" cy="624" rx="108" ry="45" fill="#fff3d7" stroke="#ccb88f" stroke-width="4"/>
    <path d="M654 625q20-58 52-2Z" fill="#efc451" stroke="#b88a28" stroke-width="3"/>
    <g class="fruit">
      <circle cx="732" cy="601" r="17" fill="#d94e40"/>
      <path d="m731 582 4-8" stroke="#4f8445" stroke-width="4"/>
      <circle cx="764" cy="609" r="16" fill="#76aa49"/>
      <circle cx="750" cy="634" r="15" fill="#ee953c"/>
    </g>
    <path d="M795 591q44 7 53 42l-71 1Z" fill="#f4d66b" stroke="#b69031" stroke-width="3"/>
    <circle cx="802" cy="612" r="4" fill="#a9852c"/>
    <circle cx="824" cy="621" r="4" fill="#a9852c"/>
    <path d="M588 643h86l-11 36h-62Z" fill="#f0e8cf" stroke="#a79372" stroke-width="3"/>
    <path d="m596 643 34-30 36 30" fill="#dba156" stroke="#91602c" stroke-width="3"/>
    <path d="M601 633h61" stroke="#6e9e53" stroke-width="5"/>
    <path d="M882 574h46l-4 90h-39Z" fill="#efa33f" stroke="#fff" stroke-width="5"/>
    <path d="M891 572v-28h27v28" fill="none" stroke="#fff" stroke-width="6"/>
    <path d="m900 546 15-17" stroke="#df6747" stroke-width="5"/>
    <ellipse cx="555" cy="650" rx="41" ry="14" fill="#fff" stroke="#b9cdd9" stroke-width="3"/>
    <path d="M529 646h54l-9-24h-35Z" fill="#d79b58" stroke="#80552e" stroke-width="3"/>
    <path d="M538 634h38" stroke="#6e9e54" stroke-width="5"/>
    <path d="M951 645h64l-7 34h-50Z" fill="#bd763f" stroke="#744428" stroke-width="3"/>
    <path d="M958 645q25-31 51 0" fill="#e4af6a" stroke="#996432" stroke-width="3"/>
    <path d="M1034 621h38v43h-38Z" fill="#f8f0df" stroke="#957b66" stroke-width="4"/>
    <path d="M1072 631q20 1 17 15-2 12-17 10" fill="none" stroke="#957b66" stroke-width="5"/>
    <path class="steam" d="M1044 617q-12-13 1-25t0-24"/>
    <path class="steam two" d="M1060 618q12-13-1-25t1-24"/>
  </g>

  <g fill="#e7f5fb" opacity="0.84">
    <ellipse cx="72" cy="753" rx="98" ry="23"/>
    <ellipse cx="1100" cy="731" rx="118" ry="28"/>
    <ellipse cx="1009" cy="780" rx="65" ry="15"/>
  </g>
</svg>
