<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Fruit stall in a market</title>
  <desc id="desc">A detailed outdoor market stall with a striped canopy, wooden crates, baskets, a vendor, a customer, price signs, and colorful fruit.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbeeff"/>
      <stop offset="1" stop-color="#f8f0ce"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b86b35"/>
      <stop offset="0.5" stop-color="#8e4928"/>
      <stop offset="1" stop-color="#69331f"/>
    </linearGradient>
    <linearGradient id="awningShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8df"/>
      <stop offset="1" stop-color="#e8d8b4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3b271b" flood-opacity="0.25"/>
    </filter>
    <pattern id="brick" width="70" height="36" patternUnits="userSpaceOnUse">
