  <path d="M0 270h1200v275H0z" fill="url(#brick)"/>
  <path d="M0 529h1200v271H0z" fill="#d8c39e"/>
  <path d="M0 610h1200M0 700h1200M132 529L60 800M326 529l-28 271M550 529l8 271M778 529l45 271M1000 529l91 271" fill="none" stroke="#b69d75" stroke-width="3" opacity=".55"/>
