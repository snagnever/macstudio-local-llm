      <path d="M0 1h70M0 35h70M35 1v17M0 18h70M12 18v17" fill="none" stroke="#c39a70" stroke-width="2" opacity=".55"/>
    </pattern>
    <clipPath id="leftCrateClip"><path d="M177 492h220l-17 147H194z"/></clipPath>
    <clipPath id="centerCrateClip"><path d="M415 476h270l-13 163H430z"/></clipPath>
    <clipPath id="rightCrateClip"><path d="M704 493h238l-12 146H717z"/></clipPath>
  </defs>

