<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Animated rubber ducky floating on a soapy bathtub</title>
  <desc id="desc">A yellow rubber duck gently bobs on blue bathwater while ripples move and soap bubbles rise from a white bathtub.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edfcfa"/>
      <stop offset="1" stop-color="#bcded9"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddccb7"/>
      <stop offset="1" stop-color="#c3ac92"/>
    </linearGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f2f7f8"/>
      <stop offset="1" stop-color="#afc4cb"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bedf8"/>
      <stop offset="0.46" stop-color="#50cce7"/>
      <stop offset="1" stop-color="#0e8fb9"/>
    </linearGradient>
    <radialGradient id="duckYellow" cx="31%" cy="20%" r="88%">
      <stop offset="0" stop-color="#fffca0"/>
      <stop offset="0.4" stop-color="#ffe649"/>
      <stop offset="0.75" stop-color="#ffc820"/>
      <stop offset="1" stop-color="#df9800"/>
    </radialGradient>
    <linearGradient id="beakOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb249"/>
      <stop offset="0.6" stop-color="#ff8225"/>
      <stop offset="1" stop-color="#da4d10"/>
    </linearGradient>
    <radialGradient id="bubble" cx="30%" cy="24%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.72" stop-color="#bfeaf2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6cb9ca" stop-opacity="0.14"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e7882"/>
      <stop offset="0.32" stop-color="#dce7e9"/>
      <stop offset="0.54" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#9eb4ba"/>
      <stop offset="1" stop-color="#4f6973"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="190%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#164752" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="basin">
      <path d="M159 412 Q600 355 1041 412 L1001 590 Q600 644 199 590 Z"/>
    </clipPath>
    <style>
      .duck-float {
        transform-box: fill-box;
        transform-origin: 52% 75%;
        animation: duckFloat 3.2s ease-in-out infinite;
      }
      .duck-shadow {
        transform-box: fill-box;
        transform-origin: center;
        animation: shadowPulse 3.2s ease-in-out infinite;
      }
      .ripple-a { animation: rippleA 3.2s ease-in-out infinite; }
      .ripple-b { animation: rippleB 3.2s ease-in-out infinite 1.6s; }
      .foam-left {
        transform-box: fill-box;
        transform-origin: center;
        animation: foamSway 3.8s ease-in-out infinite;
      }
      .foam-right {
        transform-box: fill-box;
        transform-origin: center;
        animation: foamSway 3.8s ease-in-out infinite reverse;
      }
      .rise-a { animation: riseA 5.4s linear infinite; }
      .rise-b { animation: riseB 6.2s linear infinite 1.1s; }
      .rise-c { animation: riseC 4.8s linear infinite 2.1s; }
      .rise-d { animation: riseD 6.8s linear infinite 0.4s; }
      .blink { animation: blink 4.6s ease-in-out infinite; transform-origin: 623px 285px; }
      .sparkle { animation: sparkle 2.4s ease-in-out infinite; transform-origin: center; }
      .sparkle.late { animation-delay: 1.2s; }
      @keyframes duckFloat {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-15px) rotate(1.3deg); }
      }
      @keyframes shadowPulse {
        0%, 100% { transform: scaleX(1); opacity: .40; }
        50% { transform: scaleX(.87); opacity: .27; }
      }
      @keyframes rippleA {
        0%, 100% { transform: translateX(-10px); opacity: .42; }
        50% { transform: translateX(18px); opacity: .95; }
      }
      @keyframes rippleB {
        0%, 100% { transform: translateX(15px); opacity: .35; }
        50% { transform: translateX(-18px); opacity: .9; }
      }
      @keyframes foamSway {
        0%, 100% { transform: translateX(-4px) translateY(1px); }
        50% { transform: translateX(7px) translateY(-4px); }
      }
      @keyframes riseA {
        0% { transform: translate(0, 140px) scale(.55); opacity: 0; }
        12% { opacity: .9; }
        85% { opacity: .8; }
        100% { transform: translate(-34px, -310px) scale(1.08); opacity: 0; }
      }
      @keyframes riseB {
        0% { transform: translate(0, 180px) scale(.48); opacity: 0; }
        14% { opacity: .9; }
        82% { opacity: .75; }
        100% { transform: translate(45px, -300px) scale(1.14); opacity: 0; }
      }
      @keyframes riseC {
        0% { transform: translate(0, 110px) scale(.5); opacity: 0; }
        13% { opacity: .88; }
        84% { opacity: .72; }
        100% { transform: translate(28px, -260px) scale(1.05); opacity: 0; }
      }
      @keyframes riseD {
        0% { transform: translate(0, 160px) scale(.42); opacity: 0; }
        14% { opacity: .85; }
        82% { opacity: .7; }
        100% { transform: translate(-46px, -285px) scale(1.15); opacity: 0; }
      }
      @keyframes blink {
        0%, 43%, 47%, 100% { transform: scaleY(1); }
        45% { transform: scaleY(.08); }
      }
      @keyframes sparkle {
        0%, 100% { transform: scale(.55) rotate(0deg); opacity: .25; }
        50% { transform: scale(1.2) rotate(45deg); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </defs>

  <!-- Bathroom -->
  <rect width="1200" height="800" fill="url(#room)"/>
  <g fill="none" stroke="#afd8d4" stroke-width="4" opacity="0.82">
    <path d="M0 174 H1200 M0 348 H1200"/>
    <path d="M200 0 V348 M400 0 V348 M600 0 V348 M800 0 V348 M1000 0 V348"/>
  </g>
  <path d="M0 348 H1200" stroke="#789f9c" stroke-width="9"/>
  <rect y="650" width="1200" height="150" fill="url(#floor)"/>
  <g fill="none" stroke="#ac967e" stroke-width="4" opacity="0.64">
    <path d="M0 704 H1200 M0 758 H1200"/>
    <path d="M148 650 V800 M446 650 V800 M750 650 V800 M1048 650 V800"/>
  </g>
  <ellipse cx="600" cy="711" rx="487" ry="48" fill="#29464d" opacity="0.24" filter="url(#soft)"/>

  <!-- Faucet -->
  <g stroke="#526e78" stroke-linejoin="round">
    <path d="M930 397 V276 Q930 205 859 205 H797" fill="none" stroke="url(#chrome)" stroke-width="34" stroke-linecap="round"/>
    <path d="M770 183 h66 q18 0 18 18 v19 q0 18-18 18 h-66 z" fill="url(#chrome)" stroke-width="6"/>
    <circle cx="747" cy="335" r="26" fill="url(#chrome)" stroke-width="6"/>
    <path d="M747 308 v-48 M719 272 h56" fill="none" stroke="url(#chrome)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="1034" cy="335" r="26" fill="url(#chrome)" stroke-width="6"/>
    <path d="M1034 308 v-48 M1006 272 h56" fill="none" stroke="url(#chrome)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Bathtub and water -->
  <path d="M123 403 Q130 360 182 356 H1018 Q1070 360 1077 403 L1023 608 Q1011 654 943 667 H257 Q189 654 177 608 Z" fill="url(#porcelain)" stroke="#6d8993" stroke-width="11" filter="url(#drop)"/>
  <path d="M160 410 Q600 354 1040 410 L1003 573 Q997 605 945 614 H255 Q203 605 197 573 Z" fill="url(#water)"/>
  <g clip-path="url(#basin)" fill="none" stroke-linecap="round">
    <path class="ripple-a" d="M153 485 Q259 447 370 482 T583 482" stroke="#d2fbff" stroke-width="12"/>
    <path class="ripple-b" d="M650 506 Q768 463 892 500 T1062 494" stroke="#d2fbff" stroke-width="11"/>
    <path class="ripple-b" d="M207 560 Q322 520 461 554" stroke="#087ba2" stroke-width="8" opacity=".45"/>
    <path class="ripple-a" d="M725 571 Q840 530 986 559" stroke="#087ba2" stroke-width="8" opacity=".42"/>
  </g>
  <path d="M150 375 Q600 316 1050 375 Q1089 380 1082 415 Q1076 448 1035 442 Q600 389 165 442 Q124 448 118 415 Q111 380 150 375 Z" fill="#ffffff" stroke="#6d8993" stroke-width="11"/>
  <path d="M162 395 Q600 342 1038 395" fill="none" stroke="#b8c9ce" stroke-width="6"/>
  <path d="M173 411 Q600 363 1027 411" fill="none" stroke="#70d5e9" stroke-width="8" opacity=".86"/>

  <!-- Rear foam -->
  <g fill="url(#bubble)" stroke="#83c7d7" stroke-width="5">
    <g class="foam-left">
      <circle cx="167" cy="418" r="34"/><circle cx="202" cy="392" r="45"/><circle cx="247" cy="413" r="39"/>
      <circle cx="286" cy="385" r="34"/><circle cx="325" cy="409" r="46"/><circle cx="370" cy="383" r="32"/>
      <circle cx="407" cy="411" r="41"/><circle cx="448" cy="389" r="30"/><circle cx="476" cy="416" r="34"/>
    </g>
    <g class="foam-right">
      <circle cx="750" cy="407" r="35"/><circle cx="787" cy="382" r="45"/><circle cx="832" cy="405" r="40"/>
      <circle cx="872" cy="378" r="34"/><circle cx="909" cy="405" r="47"/><circle cx="954" cy="379" r="32"/>
      <circle cx="991" cy="405" r="43"/><circle cx="1032" cy="384" r="29"/><circle cx="1057" cy="416" r="34"/>
    </g>
  </g>

  <!-- Moving flotation shadow -->
  <ellipse class="duck-shadow" cx="607" cy="558" rx="215" ry="45" fill="#08779e"/>

  <!-- Bobbing rubber duck -->
  <g class="duck-float">
    <g filter="url(#drop)">
      <path d="M429 493 Q401 452 439 416 Q472 385 516 414 Q550 376 607 371 Q676 364 724 402 Q753 426 759 460 Q819 467 847 511 Q872 551 838 582 Q797 617 681 611 H516 Q412 607 382 563 Q360 529 429 493 Z" fill="url(#duckYellow)" stroke="#bf7f00" stroke-width="10" stroke-linejoin="round"/>
      <path d="M747 478 Q795 436 841 454 Q814 492 765 507" fill="#ffd527" stroke="#bf7f00" stroke-width="10" stroke-linejoin="round"/>
      <path d="M480 471 Q463 425 474 351 Q484 284 543 245 Q606 203 672 232 Q736 260 750 325 Q763 388 719 431 Q679 471 626 467 Z" fill="url(#duckYellow)" stroke="#bf7f00" stroke-width="10"/>
      <path d="M500 297 Q529 254 577 239" fill="none" stroke="#fffbb5" stroke-width="14" stroke-linecap="round" opacity=".8"/>
      <g class="blink">
        <ellipse cx="623" cy="285" rx="17" ry="21" fill="#14201e"/>
        <circle cx="617" cy="278" r="5.5" fill="#ffffff"/>
      </g>
      <path d="M708 316 Q774 299 824 337 Q786 388 702 375 Q673 370 670 349 Q672 327 708 316 Z" fill="url(#beakOrange)" stroke="#bd430d" stroke-width="9" stroke-linejoin="round"/>
      <path d="M680 352 Q748 353 807 342" fill="none" stroke="#bd430d" stroke-width="5" stroke-linecap="round"/>
      <circle cx="730" cy="330" r="3.5" fill="#c65017"/>
      <path d="M438 500 Q500 445 581 478 Q539 545 449 557 Q412 546 438 500 Z" fill="#f2b90d" stroke="#bf7f00" stroke-width="9"/>
      <path d="M459 505 Q507 478 551 487" fill="none" stroke="#ffe879" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Animated contact ripples -->
  <g fill="none" stroke="#e1fcff" stroke-width="14" stroke-linecap="round">
    <path class="ripple-a" d="M362 549 Q464 509 566 542"/>
    <path class="ripple-b" d="M657 545 Q760 502 861 541"/>
  </g>

  <!-- Foreground suds -->
  <g fill="url(#bubble)" stroke="#83c7d7" stroke-width="5">
    <g class="foam-left">
      <circle cx="375" cy="551" r="34"/><circle cx="410" cy="573" r="46"/><circle cx="456" cy="559" r="34"/>
      <circle cx="491" cy="580" r="29"/><circle cx="526" cy="566" r="24"/>
    </g>
    <g class="foam-right">
      <circle cx="694" cy="578" r="29"/><circle cx="730" cy="559" r="37"/><circle cx="770" cy="578" r="47"/>
      <circle cx="815" cy="554" r="34"/><circle cx="850" cy="575" r="39"/><circle cx="887" cy="552" r="29"/>
    </g>
  </g>

  <!-- Continuously rising soap bubbles -->
  <g fill="url(#bubble)" stroke="#71bacb" stroke-width="5">
    <g class="rise-a">
      <circle cx="228" cy="272" r="38"/><path d="M210 254 q12-15 26-11" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g class="rise-b">
      <circle cx="930" cy="260" r="46"/><path d="M909 238 q14-17 31-11" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g class="rise-c">
      <circle cx="342" cy="308" r="25"/><path d="M330 296 q8-10 18-7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g class="rise-d">
      <circle cx="1030" cy="292" r="31"/><path d="M1016 277 q9-11 20-7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Twinkling clean highlights -->
  <g fill="#ffffff">
    <path class="sparkle" d="M277 165 l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
    <path class="sparkle late" d="M1051 187 l6 15 15 6-15 6-6 15-6-15-15-6 15-6z"/>
  </g>

  <!-- Claw feet and drain -->
  <path d="M247 648 q-8 48-54 65 q-30 11-39-12 q-7-21 26-38 l34-30" fill="url(#chrome)" stroke="#587680" stroke-width="8"/>
  <path d="M953 648 q8 48 54 65 q30 11 39-12 q7-21-26-38 l-34-30" fill="url(#chrome)" stroke="#587680" stroke-width="8"/>
  <ellipse cx="600" cy="626" rx="41" ry="16" fill="#8199a2" stroke="#526f79" stroke-width="6"/>
  <path d="M573 626 H627 M585 616 L615 636 M615 616 L585 636" fill="none" stroke="#e4eef0" stroke-width="4"/>
</svg>
