<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Stunt car jumping through a circle of fire</title>
  <desc id="desc">A red rally stunt car flies through the center of a flaming metal hoop above two ramps at night.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081329"/>
      <stop offset="0.62" stop-color="#172642"/>
      <stop offset="1" stop-color="#421e25"/>
    </linearGradient>
    <radialGradient id="fireGlow">
      <stop offset="0" stop-color="#ffdd69" stop-opacity=".4"/>
      <stop offset=".55" stop-color="#ff7a1a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff3b0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5b4e"/>
      <stop offset=".48" stop-color="#d71f2e"/>
      <stop offset="1" stop-color="#75101d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7f7ff"/>
      <stop offset=".35" stop-color="#5b9fbd"/>
      <stop offset="1" stop-color="#142638"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82909c"/>
      <stop offset="1" stop-color="#252d37"/>
    </linearGradient>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="flameGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-40%" width="170%" height="190%">
      <feDropShadow dx="8" dy="14" stdDeviation="10" flood-color="#000" flood-opacity=".58"/>
    </filter>
    <pattern id="crowd" width="28" height="25" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="8" r="3" fill="#121725"/>
      <path d="M2 23c0-8 10-8 10 0" fill="#111522"/>
      <circle cx="21" cy="12" r="3" fill="#1a2030"/>
      <path d="M16 25c0-8 10-8 10 0" fill="#181d2b"/>
    </pattern>
  </defs>

