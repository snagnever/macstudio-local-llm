    <circle cx="387" cy="365" r="12"/><circle cx="411" cy="365" r="12"/><circle cx="399" cy="345" r="12"/>
  </g>
  <path d="M399 334q5-15 20-17" fill="none" stroke="#3f7739" stroke-width="5"/>

