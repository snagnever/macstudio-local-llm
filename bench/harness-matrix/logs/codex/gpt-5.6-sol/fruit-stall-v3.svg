    <path d="M722 78c17-25 54-23 68 4 30-15 61 4 62 30H695c2-18 10-29 27-34z"/>
  </g>
  <path d="M0 258h1200v246H0z" fill="#dcc09a"/>
  <path d="M0 504h1200v296H0z" fill="url(#stones)"/>
  <path d="M0 258h1200" stroke="#9a7657" stroke-width="6"/>

