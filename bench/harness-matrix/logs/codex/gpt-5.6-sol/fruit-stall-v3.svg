    <g transform="rotate(1 560 470)"><rect x="497" y="437" width="126" height="56" rx="5" fill="#fff6d8" stroke="#4a3629" stroke-width="3"/><text x="560" y="460" font-size="14" fill="#3d2c22">ORANGES</text><text x="560" y="483" font-size="19" fill="#d46e1f">$3 / lb</text></g>
    <g transform="rotate(-2 827 481)"><rect x="773" y="449" width="108" height="55" rx="5" fill="#fff6d8" stroke="#4a3629" stroke-width="3"/><text x="827" y="471" font-size="14" fill="#3d2c22">PEARS</text><text x="827" y="494" font-size="19" fill="#648638">$2 / lb</text></g>
  </g>

