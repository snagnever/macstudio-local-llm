<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Fruit stall at a busy open-air market</title>
  <desc id="desc">A detailed striped market stall displays labeled crates and baskets of apples, oranges, pears, bananas, grapes, watermelons, and pineapples. A vendor serves two shoppers among neighboring stalls.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e4f6"/>
      <stop offset=".72" stop-color="#f7ecc9"/>
      <stop offset="1" stop-color="#f0d7aa"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c17a45"/>
      <stop offset=".5" stop-color="#94512e"/>
      <stop offset="1" stop-color="#63321f"/>
    </linearGradient>
    <linearGradient id="canopyCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7dc"/>
      <stop offset="1" stop-color="#ead2a8"/>
    </linearGradient>
    <radialGradient id="apple" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#ff7660"/>
      <stop offset="1" stop-color="#bd2e2c"/>
    </radialGradient>
    <radialGradient id="orange" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffc24b"/>
      <stop offset="1" stop-color="#dd6b1f"/>
    </radialGradient>
    <radialGradient id="pear" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#c4d968"/>
      <stop offset="1" stop-color="#6f9638"/>
    </radialGradient>
    <pattern id="stones" width="126" height="58" patternUnits="userSpaceOnUse">
      <rect width="126" height="58" fill="#d8c29d"/>
      <path d="M0 1h126M0 57h126M63 1v28M0 29h126M28 29v28M98 29v28" fill="none" stroke="#b39a76" stroke-width="2" opacity=".62"/>
    </pattern>
    <filter id="stallShadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="11" stdDeviation="9" flood-color="#39271d" flood-opacity=".3"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#37251c" flood-opacity=".24"/>
    </filter>
    <clipPath id="crateA"><path d="M201 503h204l-13 137H214z"/></clipPath>
    <clipPath id="crateO"><path d="M425 491h270l-11 149H438z"/></clipPath>
    <clipPath id="crateP"><path d="M715 503h224l-10 137H728z"/></clipPath>
  </defs>

  <!-- Market square -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1055" cy="89" r="48" fill="#ffe392" opacity=".78"/>
  <g fill="#ffffff" opacity=".57">
