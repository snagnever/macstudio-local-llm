    <g fill="url(#orange)" stroke="#b95e1d"><circle cx="649" cy="405" r="20"/><circle cx="684" cy="405" r="20"/><circle cx="719" cy="405" r="20"/><circle cx="667" cy="378" r="20"/><circle cx="702" cy="378" r="20"/></g>
