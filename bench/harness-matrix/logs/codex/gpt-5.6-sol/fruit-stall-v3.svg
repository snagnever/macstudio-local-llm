    <path d="M108 240h70v51c-9 35-59 35-70 0zm140 0h70v52c-10 35-60 35-70 0zm140 0h70v52c-10 35-60 35-70 0zm140 0h70v52c-10 35-60 35-70 0zm140 0h70v52c-10 35-60 35-70 0zm140 0h70v52c-10 35-60 35-70 0zm140 0h53v51c-6 28-38 33-53 17z" fill="#c93d36"/>
