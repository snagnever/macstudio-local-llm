      <path d="M44 128c-30-5-45 9-58 33l50 1ZM516 115l32-16 11 23-34 14Z" fill="#222a34" stroke="#080b10" stroke-width="6"/><text x="260" y="91" fill="#fff6d0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" letter-spacing="3">RUSH</text>
    </g>
  </g>

  <g transform="translate(980 408)" fill="url(#ember)" stroke="#ffb330" stroke-width="2" stroke-linejoin="round" class="flamePulse"><path d="M-244 35c-44 25-57 69-46 108 19-42 61-22 69-67 4-19-3-34-23-41Z"/><path d="M-225 112c-38 35-27 80-1 106-9-46 30-53 24-95-3-17-10-25-23-11Z"/><path d="M-184 175c-23 46 2 82 34 98-16-43 22-59 5-98-7-16-23-20-39-0Z"/><path d="M-118 224c-5 54 30 78 61 87-30-36 3-60-33-91-15-13-25-11-28 4Z"/><path d="M-27 250c19 48 61 55 93 42-42-15-28-51-73-61-17-4-25 4-20 19Z"/><path d="M72 241c33 42 77 41 107 16-48-4-40-45-86-43-18 1-26 11-21 27Z"/><path d="M160 191c48 21 88-4 102-37-42 23-66-12-104 12-15 10-18 21 2 25Z"/></g>
