<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Animated stunt car leaping through a ring of fire</title>
  <desc id="desc">A red stunt coupe floats through a flickering circle of fire in a floodlit night arena, with rotating wheels and rising embers.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#020611"/><stop offset=".48" stop-color="#102b49"/><stop offset="1" stop-color="#351722"/></linearGradient>
    <radialGradient id="moonGlow"><stop stop-color="#ffd99a" stop-opacity=".24"/><stop offset=".38" stop-color="#e75128" stop-opacity=".08"/><stop offset="1" stop-color="#d92c1e" stop-opacity="0"/></radialGradient>
    <radialGradient id="fireGlow"><stop stop-color="#fff4a8" stop-opacity=".85"/><stop offset=".22" stop-color="#ff9a29" stop-opacity=".45"/><stop offset=".58" stop-color="#ef321e" stop-opacity=".13"/><stop offset="1" stop-color="#e92d19" stop-opacity="0"/></radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffbd2"/><stop offset=".21" stop-color="#ffe669"/><stop offset=".53" stop-color="#ff8b1d"/><stop offset="1" stop-color="#d52a16"/></linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff3a0"/><stop offset=".5" stop-color="#ff7621"/><stop offset="1" stop-color="#c51c18"/></linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ff9160"/><stop offset=".18" stop-color="#e8412d"/><stop offset=".62" stop-color="#9c1320"/><stop offset="1" stop-color="#420915"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9ffff"/><stop offset=".14" stop-color="#89cbd6"/><stop offset=".46" stop-color="#1e5579"/><stop offset="1" stop-color="#061322"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8b959a"/><stop offset=".25" stop-color="#303942"/><stop offset="1" stop-color="#080b10"/></linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="carShadow" x="-30%" y="-40%" width="180%" height="190%"><feDropShadow dx="17" dy="25" stdDeviation="12" flood-color="#000" flood-opacity=".82"/></filter>
    <path id="flameA" d="M0 0C-25-29-10-63 8-90c-4 32 25 43 13 70C15-9 7-3 0 0Z"/>
    <path id="flameB" d="M0 0C-18-22-8-49 11-71 3-40 29-35 18-11 13-2 5 1 0 0Z"/>
    <style>
      .flicker { animation: flicker 1.15s ease-in-out infinite alternate; transform-origin: center; }
      .flamePulse { animation: flamePulse .72s ease-in-out infinite alternate; transform-origin: center; }
      .spark { animation: spark 2.4s ease-out infinite; }
      .spark.delay { animation-delay: -1.2s; }
      @keyframes flicker { 0% { opacity:.74; } 40% { opacity:1; } 100% { opacity:.82; } }
      @keyframes flamePulse { from { opacity:.78; transform:scale(.975); } to { opacity:1; transform:scale(1.025); } }
      @keyframes spark { 0% { opacity:0; transform:translate(0 18px) scale(.5); } 18% { opacity:1; } 100% { opacity:0; transform:translate(14px -88px) scale(.15); } }
      @media (prefers-reduced-motion: reduce) { .flicker,.flamePulse,.spark { animation:none; } }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#sky)"/>
  <ellipse cx="970" cy="386" rx="430" ry="410" fill="url(#moonGlow)" class="flicker"/>
  <g fill="#ddecff" opacity=".8"><circle cx="76" cy="122" r="2"/><circle cx="187" cy="201" r="1.5"/><circle cx="320" cy="94" r="2"/><circle cx="491" cy="174" r="1"/><circle cx="649" cy="84" r="2"/><circle cx="1123" cy="91" r="1.5"/><circle cx="1268" cy="180" r="2"/><circle cx="1350" cy="71" r="1"/></g>
