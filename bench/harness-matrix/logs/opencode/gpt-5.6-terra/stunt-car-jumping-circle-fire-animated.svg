  <path d="M0 650h1400v250H0z" fill="#080a0e"/><path d="M0 687c172-39 336 13 506 15 242 2 356-53 578-38 133 9 237 31 316 55v181H0Z" fill="#101116"/>
  <path d="M0 713c251-46 446 21 689 3 229-17 456-83 711 13" fill="none" stroke="#653129" stroke-width="6" opacity=".82"/><path d="M0 743c210-23 434 16 658 2 254-15 481-67 742 4" fill="none" stroke="#251923" stroke-width="4"/>
  <path d="M0 705h283l144-143h72L337 729H0Z" fill="#151b22" stroke="#687078" stroke-width="5"/><path d="M43 695h231l131-123" fill="none" stroke="#a1a9ad" stroke-width="4" opacity=".52"/><path d="M30 715h278" stroke="#f07b32" stroke-width="3" opacity=".65"/>
  <ellipse cx="682" cy="720" rx="325" ry="29" fill="#000" opacity=".65" filter="url(#smallGlow)"><animate attributeName="rx" values="325;305;325" dur="2.8s" repeatCount="indefinite"/></ellipse>

  <g transform="translate(980 408)">
    <ellipse rx="390" ry="382" fill="url(#fireGlow)" filter="url(#soft)" class="flicker"/>
    <path d="M-188 226-232 365M188 226l45 139" stroke="url(#steel)" stroke-width="24" stroke-linecap="round"/><path d="M-278 368h92M185 368h92" stroke="#555e64" stroke-width="15" stroke-linecap="round"/>
    <circle r="255" fill="#080e17" fill-opacity=".32" stroke="#40191a" stroke-width="38"/>
    <circle r="255" fill="none" stroke="#e8371a" stroke-width="28" opacity=".72" filter="url(#smallGlow)" class="flicker"/>
    <circle r="255" fill="none" stroke="url(#fire)" stroke-width="16" stroke-dasharray="15 7" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-132" dur="1.8s" repeatCount="indefinite"/></circle>
    <g fill="url(#fire)" stroke="#ffad31" stroke-width="2" stroke-linejoin="round" class="flamePulse">
      <use href="#flameA" transform="translate(-183 -177) rotate(-38)"/><use href="#flameB" transform="translate(-91 -237) rotate(-15)"/><use href="#flameA" transform="translate(22 -252) rotate(8)"/><use href="#flameB" transform="translate(137 -213) rotate(37)"/>
      <use href="#flameA" transform="translate(223 -118) rotate(64)"/><use href="#flameB" transform="translate(252 1) rotate(93)"/><use href="#flameA" transform="translate(203 144) rotate(130)"/><use href="#flameB" transform="translate(111 227) rotate(151)"/>
      <use href="#flameA" transform="translate(-18 253) rotate(181)"/><use href="#flameB" transform="translate(-135 215) rotate(213)"/><use href="#flameA" transform="translate(-225 113) rotate(249)"/><use href="#flameB" transform="translate(-254 -13) rotate(270)"/>
    </g>
    <g fill="#fff5a2" opacity=".92" class="flicker"><circle cx="-222" cy="-104" r="4"/><circle cx="-132" cy="-217" r="3"/><circle cx="7" cy="-251" r="4"/><circle cx="155" cy="-199" r="3"/><circle cx="246" cy="-53" r="4"/><circle cx="230" cy="132" r="3"/><circle cx="69" cy="245" r="4"/><circle cx="-115" cy="228" r="3"/><circle cx="-239" cy="71" r="4"/></g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;16 -18;0 0" keyTimes="0;.52;1" dur="2.8s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <g transform="translate(321 276) rotate(-10 290 160)" filter="url(#carShadow)">
      <path d="M34 191c5-39 28-65 73-79l76-68c27-24 59-33 116-31l112 10c39 4 67 27 87 73l51 13c32 9 48 32 49 65l2 35-49 8c-13 41-45 63-89 63-40 0-69-23-81-60H190c-13 37-43 59-82 59-44 0-76-30-84-68l-34-5 11-48c4-19 14-26 33-26Z" fill="url(#paint)" stroke="#470a14" stroke-width="8" stroke-linejoin="round"/>
      <path d="m140 111 71-64c23-20 49-26 87-23l92 9c29 3 48 22 65 64l-315 18Z" fill="url(#glass)" stroke="#5f1220" stroke-width="6" stroke-linejoin="round"/><path d="m219 47-12 65m90-80-4 74m91-65-12 61" stroke="#751824" stroke-width="6"/><path d="M151 57c25-18 54-23 78-21" fill="none" stroke="#d9ffff" stroke-width="7" stroke-linecap="round" opacity=".58"/>
      <path d="M13 152c137-12 346-16 534-10l20 38-568 11Z" fill="#fa5940" opacity=".75"/><path d="M0 191h570l2 29-580 6Z" fill="#4b0a13"/><path d="M223 132h127l8 27H207Z" fill="#ffd98b"/><path d="M371 128h90l21 30H379Z" fill="#bc2023"/><path d="M38 157h89l-21 22H28Z" fill="#ffe079"/><path d="M506 154h41l10 21h-48Z" fill="#fff5bf"/>
      <path d="M140 116h52" stroke="#fff8ce" stroke-width="7" stroke-linecap="round" opacity=".9"/><path d="M178 180v45m183-45v43m126-45v37" stroke="#73101b" stroke-width="6"/><path d="M237 204h115" stroke="#ff9673" stroke-width="6" stroke-linecap="round" opacity=".76"/><path d="M329 181h18v37h-18z" fill="#d11920" opacity=".7"/>
      <g transform="translate(108 218)"><animateTransform attributeName="transform" type="rotate" values="0 108 218;720 108 218" dur="1.4s" repeatCount="indefinite"/><circle cx="108" cy="218" r="60" fill="#070a0f" stroke="#353d46" stroke-width="9"/><circle cx="108" cy="218" r="35" fill="#b6bec0" stroke="#4c545e" stroke-width="7"/><circle cx="108" cy="218" r="13" fill="#20262e"/><path d="M108 185v66m-33-33h66m-55-23 44 46m0-46-44 46" stroke="#5d6670" stroke-width="5"/></g>
