<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Dawn beach celebration</title>
  <desc id="desc">An animated dawn beach with playing people, balls, boats, a flying banner plane, and rolling waves.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312d6f"/>
      <stop offset=".46" stop-color="#ec6b6b"/>
      <stop offset=".72" stop-color="#f9b66c"/>
      <stop offset="1" stop-color="#ffe5a1"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2d8da6"/>
      <stop offset="1" stop-color="#07566f"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7cf88"/>
      <stop offset="1" stop-color="#d99a58"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <path id="waveA" d="M-80 0 C-25-16 25 16 80 0 S185-16 240 0 S345 16 400 0 S505-16 560 0 S665 16 720 0 S825-16 880 0 S985 16 1040 0 S1145-16 1200 0 S1305 16 1360 0"/>
    <path id="palmLeaf" d="M0 0 C38-22 74-24 114-8 C70 7 34 10 0 0Z"/>
  </defs>

  <!-- dawn sky -->
  <rect width="1200" height="720" fill="url(#sky)"/>
  <circle cx="190" cy="218" r="77" fill="#ffd682" opacity=".34" filter="url(#glow)">
    <animate attributeName="r" values="67;82;67" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="218" r="50" fill="#fff0ae">
    <animate attributeName="cy" values="230;202;230" dur="12s" repeatCount="indefinite"/>
  </circle>
  <g fill="#fff2d0" opacity=".82">
    <path d="M610 128c16-17 33-17 49 0-16-8-33-8-49 0Z"><animateTransform attributeName="transform" type="translate" values="0 0;28 -8;0 0" dur="7s" repeatCount="indefinite"/></path>
    <path d="M710 174c11-12 23-12 35 0-12-6-24-6-35 0Z"><animateTransform attributeName="transform" type="translate" values="0 0;32 4;0 0" dur="8s" repeatCount="indefinite"/></path>
    <path d="M498 195c9-10 19-10 28 0-9-4-19-4-28 0Z"><animateTransform attributeName="transform" type="translate" values="0 0;36 -5;0 0" dur="6s" repeatCount="indefinite"/></path>
  </g>

  <!-- water -->
  <path d="M0 344 C170 326 310 354 470 340 S810 324 1200 345 V565 H0Z" fill="url(#sea)"/>
  <g fill="none" stroke="#93d7d2" stroke-width="5" opacity=".74">
    <use href="#waveA" x="0" y="391"><animateTransform attributeName="transform" type="translate" values="0 0;-80 0;0 0" dur="5s" repeatCount="indefinite"/></use>
    <use href="#waveA" x="-100" y="442" opacity=".7"><animateTransform attributeName="transform" type="translate" values="0 0;90 0;0 0" dur="6s" repeatCount="indefinite"/></use>
    <use href="#waveA" x="0" y="492" opacity=".6"><animateTransform attributeName="transform" type="translate" values="0 0;-70 0;0 0" dur="4.5s" repeatCount="indefinite"/></use>
  </g>

  <!-- sailboats -->
  <g transform="translate(730 298)">
    <animateTransform attributeName="transform" type="translate" values="730 298;750 289;730 298" dur="5s" repeatCount="indefinite"/>
    <path d="M-54 61h110l-13 14H-39Z" fill="#173f63"/>
    <path d="M0 55V-57L-45 55Z" fill="#fff1cb"/>
    <path d="M5 55V-35L45 55Z" fill="#eb635e"/>
    <path d="M0-62v119" stroke="#233e5c" stroke-width="4"/>
  </g>
  <g transform="translate(955 347) scale(.65)">
    <animateTransform attributeName="transform" type="translate" values="955 347;939 341;955 347" dur="6s" repeatCount="indefinite"/>
    <path d="M-54 61h110l-13 14H-39Z" fill="#173f63"/>
    <path d="M0 55V-57L-45 55Z" fill="#fff1cb"/>
    <path d="M5 55V-35L45 55Z" fill="#f3a74e"/>
    <path d="M0-62v119" stroke="#233e5c" stroke-width="4"/>
  </g>

  <!-- plane and banner -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-280 0;1260 0" dur="18s" repeatCount="indefinite"/>
    <path d="M106 113 C80 112 61 112 43 115" fill="none" stroke="#fff0cb" stroke-width="2"/>
    <path d="M-186 87h229l-12 48h-229Z" fill="#fff5dd" stroke="#d95558" stroke-width="3"/>
    <text x="-169" y="119" fill="#30456a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Qwen 3.8 can draw</text>
    <path d="M109 95l50 5 28-19 11 4-18 21 35 13-8 8-37-10-16 13-10-2 9-15-49-1-17 13-11-2 13-17-24-9 9-5Z" fill="#fff7df" stroke="#d95558" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="168" cy="105" r="5" fill="#355279"/>
  </g>

  <!-- shore -->
  <path d="M0 508 C160 474 305 535 481 511 S819 473 1200 521V720H0Z" fill="url(#sand)"/>
  <g fill="none" stroke="#fff4cf" stroke-width="8" opacity=".92">
    <path d="M0 512 C160 478 305 539 481 515 S819 477 1200 525"><animate attributeName="d" values="M0 512 C160 478 305 539 481 515 S819 477 1200 525;M0 520 C160 486 305 531 481 523 S819 485 1200 533;M0 512 C160 478 305 539 481 515 S819 477 1200 525" dur="4s" repeatCount="indefinite"/></path>
  </g>

  <!-- palm silhouettes -->
  <g fill="#174b4b" stroke="#174b4b" stroke-linecap="round">
    <path d="M72 582C76 500 94 427 111 371" fill="none" stroke-width="18"/>
    <g transform="translate(111 371)"><use href="#palmLeaf" transform="rotate(-160)"/><use href="#palmLeaf" transform="rotate(-112)"/><use href="#palmLeaf" transform="rotate(-66)"/><use href="#palmLeaf" transform="rotate(-18)"/><use href="#palmLeaf" transform="rotate(33)"/></g>
    <path d="M1131 587c-8-69-28-128-56-184" fill="none" stroke-width="18"/>
    <g transform="translate(1075 403)"><use href="#palmLeaf" transform="rotate(-156)"/><use href="#palmLeaf" transform="rotate(-106)"/><use href="#palmLeaf" transform="rotate(-61)"/><use href="#palmLeaf" transform="rotate(-13)"/><use href="#palmLeaf" transform="rotate(38)"/></g>
  </g>

  <!-- beach games -->
  <g stroke="#263d5c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- volleyball player -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -20;0 0" dur="1.1s" repeatCount="indefinite"/>
      <circle cx="402" cy="529" r="15" fill="#7b4c40" stroke="none"/>
      <path d="M402 546l-8 51m8-39l-27-23m27 23l29-28m-37 67l-26 41m26-41l29 36"/>
      <path d="M385 522q17-19 35 0" stroke="#382f4f" stroke-width="11"/>
    </g>
    <!-- ball -->
    <g fill="#fff2c4" stroke="#e36658" stroke-width="4">
      <circle cx="453" cy="442" r="17"/>
      <path d="M438 435l15 7 9-13m-9 13-2 17m-13-24 1 16"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;35 70;0 0" dur="1.1s" repeatCount="indefinite"/>
    </g>
    <!-- child running -->
    <g>
      <circle cx="616" cy="579" r="13" fill="#9a5b44" stroke="none"/>
      <path d="M615 593l-5 42m4-28l-24 15m24-15l22 12m-26 16l-20 37m20-37l28 31"/>
      <path d="M601 573q15-15 29 1" stroke="#e85555" stroke-width="10"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;18 0;0 0" dur=".8s" repeatCount="indefinite"/>
    </g>
    <!-- frisbee -->
    <ellipse cx="681" cy="542" rx="23" ry="7" fill="#f4b34f" stroke-width="4">
      <animateTransform attributeName="transform" type="rotate" values="0 681 542;360 681 542" dur="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <!-- seaside sitter -->
    <g>
      <circle cx="828" cy="603" r="13" fill="#774937" stroke="none"/>
      <path d="M824 616l-24 28 36 3m-12-29 25 27m-49-1l-22 13m57-12l31 11"/>
      <path d="M814 594q14-14 29 1" stroke="#f4b34f" stroke-width="10"/>
    </g>
  </g>
  <g fill="#bd7544" opacity=".7"><circle cx="269" cy="647" r="3"/><circle cx="330" cy="680" r="4"/><circle cx="730" cy="672" r="3"/><circle cx="992" cy="638" r="4"/><circle cx="550" cy="689" r="2"/></g>
</svg>
