<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Stunt car jumping through a circle of fire</title>
  <desc id="desc">A red stunt coupe flies nose-up through a blazing ring in a night-time arena.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#020914"/><stop offset=".48" stop-color="#102844"/><stop offset="1" stop-color="#301827"/>
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#ffb135" stop-opacity=".5"/><stop offset=".35" stop-color="#e94b1b" stop-opacity=".16"/><stop offset="1" stop-color="#df2918" stop-opacity="0"/></radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff9c4"/><stop offset=".22" stop-color="#ffe363"/><stop offset=".58" stop-color="#ff841d"/><stop offset="1" stop-color="#d62516"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#59626c"/><stop offset=".45" stop-color="#202730"/><stop offset="1" stop-color="#080c12"/></linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ff7651"/><stop offset=".22" stop-color="#e33729"/><stop offset=".67" stop-color="#971322"/><stop offset="1" stop-color="#4d0a16"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d3f3f4"/><stop offset=".23" stop-color="#639bb0"/><stop offset=".58" stop-color="#173a59"/><stop offset="1" stop-color="#071426"/></linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow" x="-30%" y="-40%" width="170%" height="190%"><feDropShadow dx="14" dy="25" stdDeviation="13" flood-color="#000" flood-opacity=".8"/></filter>
  </defs>

  <rect width="1400" height="900" fill="url(#sky)"/>
  <path d="M0 420C145 359 243 392 378 348s256 28 399-23 233-48 354-5 195 25 269-2V606H0Z" fill="#071525" opacity=".74"/>
  <path d="M0 523c140-32 260-4 416-42s298 26 458-16 316-21 526 28v140H0Z" fill="#040b14"/>
  <g fill="#d9eeff" opacity=".72"><circle cx="91" cy="125" r="2"/><circle cx="211" cy="215" r="1.5"/><circle cx="345" cy="108" r="2"/><circle cx="523" cy="183" r="1"/><circle cx="698" cy="95" r="2"/><circle cx="1125" cy="111" r="2"/><circle cx="1280" cy="220" r="1.5"/><circle cx="1342" cy="88" r="2"/></g>
  <g opacity=".35"><path d="M0 637H1400" stroke="#ff9364" stroke-width="2"/><path d="M0 655H1400" stroke="#172536" stroke-width="7"/></g>
