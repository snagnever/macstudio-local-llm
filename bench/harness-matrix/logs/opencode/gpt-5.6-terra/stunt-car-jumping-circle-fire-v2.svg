  <g transform="translate(354 296) rotate(-9 290 160)" filter="url(#shadow)">
    <path d="M35 190c5-39 27-65 73-78l74-67c26-24 57-33 115-31l111 9c39 3 65 24 86 72l52 13c31 8 47 31 48 65l3 35-48 7c-13 42-46 64-89 64-40 0-68-25-80-61H190c-13 38-43 59-82 59-43 0-75-30-83-68l-34-4 10-48c4-20 14-27 34-27Z" fill="url(#paint)" stroke="#480b15" stroke-width="8" stroke-linejoin="round"/>
