    <path d="M177 180v44m183-44v42m126-44v37" stroke="#75101b" stroke-width="6"/>
    <path d="M237 203h113" stroke="#ff8a67" stroke-width="6" stroke-linecap="round" opacity=".72"/>
    <g>
      <circle cx="108" cy="217" r="59" fill="#080b10" stroke="#313943" stroke-width="9"/><circle cx="108" cy="217" r="35" fill="#aeb7bc" stroke="#464d56" stroke-width="7"/><circle cx="108" cy="217" r="13" fill="#202630"/>
      <path d="M108 185v64m-32-32h64m-54-22 44 44m0-44-44 44" stroke="#59616a" stroke-width="5"/>
