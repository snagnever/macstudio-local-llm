<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Animated half-buried treasure barrel at sunset</title>
  <desc id="desc">A weathered open oak barrel, buried halfway in wind-swept desert sand, overflows with gold coins, pearls, and colored gems beneath a low, shimmering sunset.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#183552"/><stop offset=".42" stop-color="#a95452"/><stop offset=".73" stop-color="#f49b64"/><stop offset="1" stop-color="#ffd88d"/></linearGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%"><stop stop-color="#fff5b9" stop-opacity=".92"/><stop offset=".4" stop-color="#ffd590" stop-opacity=".38"/><stop offset="1" stop-color="#ffd590" stop-opacity="0"/></radialGradient>
    <linearGradient id="distantSand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eab66b"/><stop offset="1" stop-color="#ba6539"/></linearGradient>
    <radialGradient id="sand" cx="50%" cy="0" r="95%"><stop stop-color="#ffe4a0"/><stop offset=".45" stop-color="#e6a354"/><stop offset="1" stop-color="#a94d2c"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7a858"/><stop offset=".14" stop-color="#8e4424"/><stop offset=".48" stop-color="#542014"/><stop offset=".76" stop-color="#a95628"/><stop offset="1" stop-color="#35120e"/></linearGradient>
    <linearGradient id="stave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4a180f"/><stop offset=".28" stop-color="#a64e24"/><stop offset=".53" stop-color="#e4a14a"/><stop offset=".76" stop-color="#8a381e"/><stop offset="1" stop-color="#3c130e"/></linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8c577"/><stop offset=".18" stop-color="#92714a"/><stop offset=".47" stop-color="#302822"/><stop offset=".73" stop-color="#786043"/><stop offset="1" stop-color="#201b19"/></linearGradient>
    <radialGradient id="gold" cx="28%" cy="18%" r="78%"><stop stop-color="#fff7ab"/><stop offset=".28" stop-color="#ffd85c"/><stop offset=".67" stop-color="#dc8b16"/><stop offset="1" stop-color="#713207"/></radialGradient>
    <radialGradient id="pearl" cx="30%" cy="22%" r="70%"><stop stop-color="#fffdf0"/><stop offset=".46" stop-color="#f7e3ce"/><stop offset="1" stop-color="#b98b83"/></radialGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb9ae"/><stop offset=".3" stop-color="#e14359"/><stop offset="1" stop-color="#650e2d"/></linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7fff0"/><stop offset=".32" stop-color="#32c9ad"/><stop offset="1" stop-color="#08645f"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="13" result="b"/><feOffset in="b" dx="13" dy="20" result="o"/><feComponentTransfer in="o"><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .sun-pulse { transform-origin: 877px 245px; animation: sun-pulse 7s ease-in-out infinite; }
      .haze-drift { animation: haze-drift 11s ease-in-out infinite alternate; }
      .heat { animation: heat 5s ease-in-out infinite alternate; }
      .sand-drift { animation: sand-drift 8s linear infinite; }
      .glint { transform-box: fill-box; transform-origin: center; animation: glint 3.4s ease-in-out infinite; }
      .glint.late { animation-delay: 1.15s; }
      .glint.later { animation-delay: 2.2s; }
      @keyframes sun-pulse { 0%,100% { opacity:.91; transform:scale(1); } 50% { opacity:1; transform:scale(1.045); } }
      @keyframes haze-drift { from { transform:translate(-10px,4px) scale(.97); opacity:.62; } to { transform:translate(17px,-5px) scale(1.05); opacity:.94; } }
      @keyframes heat { from { opacity:.12; transform:translateX(-7px); } to { opacity:.27; transform:translateX(10px); } }
      @keyframes sand-drift { from { transform:translateX(-95px); opacity:0; } 12% { opacity:.42; } 82% { opacity:.27; } to { transform:translateX(135px); opacity:0; } }
      @keyframes glint { 0%,68%,100% { opacity:0; transform:scale(.25) rotate(0deg); } 80% { opacity:1; transform:scale(1) rotate(45deg); } 90% { opacity:.15; transform:scale(.5) rotate(90deg); } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration:0.001ms !important; animation-iteration-count:1 !important; } }
    </style>
  </defs>

