    <ellipse cx="605" cy="322" rx="204" ry="78" fill="#28120c" stroke="#35150e" stroke-width="15"/><ellipse cx="605" cy="317" rx="176" ry="57" fill="#110a08"/><path d="M419 326c28-47 98-71 187-71 91 0 159 25 184 71-29 34-95 51-185 51-89 0-157-17-186-51Z" fill="none" stroke="#d38a3c" stroke-width="16"/><path d="M433 325c30-37 95-56 173-56 80 0 141 20 169 56" fill="none" stroke="#ffd083" stroke-width="3" opacity=".6"/>
    <g fill="url(#gold)" stroke="#754009" stroke-width="3"><ellipse cx="474" cy="328" rx="39" ry="16" transform="rotate(-17 474 328)"/><ellipse cx="516" cy="300" rx="39" ry="16" transform="rotate(14 516 300)"/><ellipse cx="558" cy="331" rx="43" ry="17" transform="rotate(-10 558 331)"/><ellipse cx="606" cy="298" rx="40" ry="16" transform="rotate(12 606 298)"/><ellipse cx="652" cy="331" rx="42" ry="17" transform="rotate(-15 652 331)"/><ellipse cx="700" cy="302" rx="39" ry="15" transform="rotate(17 700 302)"/><ellipse cx="737" cy="332" rx="34" ry="14" transform="rotate(-8 737 332)"/><ellipse cx="499" cy="354" rx="38" ry="15" transform="rotate(15 499 354)"/><ellipse cx="549" cy="356" rx="40" ry="16" transform="rotate(-14 549 356)"/><ellipse cx="605" cy="348" rx="44" ry="17" transform="rotate(8 605 348)"/><ellipse cx="661" cy="357" rx="40" ry="16" transform="rotate(-12 661 357)"/><ellipse cx="709" cy="350" rx="35" ry="14" transform="rotate(15 709 350)"/></g>
