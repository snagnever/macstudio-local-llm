<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">An animated family picnic on a cloud beneath a hot air balloon</title>
  <desc id="desc">Two parents and two children set out food on a checked picnic tarp on a cloud. A tethered hot air balloon sways in the luminous morning sky while clouds drift slowly behind them.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4d9dcc"/><stop offset=".5" stop-color="#9fd6df"/><stop offset="1" stop-color="#f7d4b4"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop stop-color="#fffbd6"/><stop offset=".68" stop-color="#ffe49a"/><stop offset="1" stop-color="#ffc86e"/></radialGradient>
    <linearGradient id="cloudTop" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf6"/><stop offset="1" stop-color="#dcebea"/></linearGradient>
    <linearGradient id="cloudSide" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8e9e8"/><stop offset="1" stop-color="#b8d7dc"/></linearGradient>
    <linearGradient id="balloon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9c455"/><stop offset=".45" stop-color="#ec7555"/><stop offset="1" stop-color="#a94668"/></linearGradient>
    <linearGradient id="basket" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bf8250"/><stop offset="1" stop-color="#80523d"/></linearGradient>
    <pattern id="plaid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#fff4d9"/><path d="M0 8H40M0 32H40M8 0V40M32 0V40" stroke="#d95662" stroke-width="8" opacity=".68"/><path d="M0 20H40M20 0V40" stroke="#a94157" stroke-width="2.5" opacity=".86"/></pattern>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="175%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".17"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="haze" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .sky-bank { animation: sky-drift 22s ease-in-out infinite alternate; }
      .sky-bank.far { animation-delay: -11s; animation-duration: 27s; }
      .balloon-scene { transform-origin: 175px 285px; animation: balloon-sway 5.8s ease-in-out infinite; }
      .cloud-island { transform-origin: 600px 690px; animation: island-bob 7.2s ease-in-out infinite; }
      .picnic { transform-origin: 650px 620px; animation: picnic-breathe 7.2s ease-in-out infinite; }
      .glow { transform-origin: 1008px 132px; animation: sunrise 6s ease-in-out infinite; }
      .haze { animation: haze-drift 9s ease-in-out infinite alternate; }
      .sparkle { transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
      .sparkle.s2 { animation-delay: -1.1s; }
      .sparkle.s3 { animation-delay: -2.2s; }
      @keyframes sky-drift { from { transform: translateX(-12px); } to { transform: translateX(16px); } }
      @keyframes balloon-sway { 0%,100% { transform: rotate(-1.7deg) translateY(0); } 50% { transform: rotate(1.7deg) translateY(-5px); } }
      @keyframes island-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes picnic-breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes sunrise { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.055); opacity: .9; } }
      @keyframes haze-drift { from { transform: translateX(-8px); opacity: .18; } to { transform: translateX(10px); opacity: .31; } }
      @keyframes twinkle { 0%,100% { transform: scale(.55); opacity: .2; } 50% { transform: scale(1.45); opacity: .95; } }
      @media (prefers-reduced-motion: reduce) { .sky-bank,.balloon-scene,.cloud-island,.picnic,.glow,.haze,.sparkle { animation: none; } }
    </style>
  </defs>
