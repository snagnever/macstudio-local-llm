  <circle class="glow" cx="1008" cy="132" r="77" fill="url(#glow)"/>
  <g class="haze" fill="#fff9e8" opacity=".25" filter="url(#haze)"><ellipse cx="978" cy="158" rx="143" ry="36"/><ellipse cx="994" cy="183" rx="105" ry="22"/></g>
