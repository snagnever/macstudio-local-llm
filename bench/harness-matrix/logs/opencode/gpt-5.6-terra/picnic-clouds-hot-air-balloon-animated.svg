  <g class="picnic" stroke-linecap="round" stroke-linejoin="round"><path d="M302 448c-31 30-27 82 1 112l35 35 58-17-18-56 27-47Z" fill="#3d6b89" stroke="#284b62" stroke-width="5"/><path d="M338 582 306 644M379 578l48 40" fill="none" stroke="#b9785a" stroke-width="19"/><path d="M297 644h25M421 618h25" fill="none" stroke="#61433d" stroke-width="16"/><path d="M313 451c0-30 39-44 58-23 18 22 3 51-21 51-22 0-37-11-37-28Z" fill="#b9785a" stroke="#61433d" stroke-width="4"/><path d="M311 451c6-33 50-43 66-12-24-2-39 8-50 25Z" fill="#343139"/><circle cx="355" cy="455" r="3" fill="#2f282b"/><path d="M342 467q9 8 18 0" fill="none" stroke="#91494a" stroke-width="3"/><path d="M379 514 404 561 422 616" fill="none" stroke="#b9785a" stroke-width="18"/><path d="M421 613 434 620" fill="none" stroke="#61433d" stroke-width="11"/></g>
