<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Animated cow plowing a field</title>
  <desc id="description">A sturdy brown-and-cream dairy cow walks across a freshly turned field, pulling a wooden moldboard plow under a bright country sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65bddf"/><stop offset=".58" stop-color="#cbe6d0"/><stop offset="1" stop-color="#f3d58a"/></linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bd783e"/><stop offset="1" stop-color="#58271b"/></linearGradient>
    <linearGradient id="cow" x1=".15" y1="0" x2=".82" y2="1"><stop stop-color="#d6854b"/><stop offset=".55" stop-color="#a85032"/><stop offset="1" stop-color="#753021"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0a657"/><stop offset=".45" stop-color="#aa6331"/><stop offset="1" stop-color="#65351e"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef0e8"/><stop offset=".4" stop-color="#aeb8b5"/><stop offset="1" stop-color="#606d6b"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#fffbe0"/><stop offset=".7" stop-color="#fff1ad"/><stop offset="1" stop-color="#f9d46e"/></radialGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <style>
      .cloud-one { animation: drift-one 22s ease-in-out infinite alternate; }
      .cloud-two { animation: drift-two 29s ease-in-out infinite alternate; }
      .cloud-three { animation: drift-three 25s ease-in-out infinite alternate; }
      .sun-rays { animation: ray-turn 16s linear infinite; transform-origin: 988px 118px; }
      .sun-disc { animation: sunlight 5s ease-in-out infinite alternate; transform-origin: 988px 118px; }
      .stubble { animation: field-breeze 2.8s ease-in-out infinite alternate; transform-origin: 600px 450px; }
      .cow { animation: cow-step 1.6s ease-in-out infinite; transform-origin: 550px 540px; }
      .tail { animation: tail-swish 1.6s ease-in-out infinite; transform-origin: 356px 438px; }
      .leg-back-a { animation: rear-step 1.6s ease-in-out infinite; transform-origin: 438px 510px; }
      .leg-back-b { animation: fore-step 1.6s ease-in-out infinite; transform-origin: 620px 506px; }
      .leg-near-a { animation: fore-step 1.6s ease-in-out -.8s infinite; transform-origin: 482px 513px; }
      .leg-near-b { animation: rear-step 1.6s ease-in-out -.8s infinite; transform-origin: 578px 514px; }
      .head { animation: head-nod 1.6s ease-in-out infinite; transform-origin: 714px 445px; }
      .traces { animation: trace-pull 1.6s ease-in-out infinite; transform-origin: 760px 535px; }
      .plow { animation: plow-rock 1.6s ease-in-out infinite; transform-origin: 900px 740px; }
      .clod-a { animation: clod-hop 1.6s ease-out infinite; transform-origin: 930px 720px; }
      .clod-b { animation: clod-hop 1.6s ease-out -.24s infinite; transform-origin: 965px 730px; }
      .clod-c { animation: clod-hop 1.6s ease-out -.48s infinite; transform-origin: 1000px 743px; }
      .clod-d { animation: clod-hop 1.6s ease-out -.72s infinite; transform-origin: 1035px 755px; }
      .dust { animation: dust-rise 1.6s ease-out infinite; }
      @keyframes drift-one { to { transform: translateX(54px); } }
      @keyframes drift-two { to { transform: translateX(-73px); } }
      @keyframes drift-three { to { transform: translateX(38px); } }
      @keyframes ray-turn { to { transform: rotate(360deg); } }
      @keyframes sunlight { to { transform: scale(1.04); opacity: .95; } }
      @keyframes field-breeze { to { transform: skewX(-1.2deg); } }
      @keyframes cow-step { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes tail-swish { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-18deg); } }
      @keyframes rear-step { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(8deg); } }
      @keyframes fore-step { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-5deg); } }
      @keyframes head-nod { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(2deg) translateY(2px); } }
      @keyframes trace-pull { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,2px); } }
      @keyframes plow-rock { 0%,100% { transform: rotate(0deg) translate(0,0); } 50% { transform: rotate(1.3deg) translate(2px,1px); } }
      @keyframes clod-hop { 0%,34%,100% { transform: translate(0,0) rotate(0deg); } 15% { transform: translate(-5px,-13px) rotate(-18deg); } }
      @keyframes dust-rise { 0% { opacity: 0; transform: translate(0,0) scale(.5); } 20% { opacity: .55; } 100% { opacity: 0; transform: translate(24px,-30px) scale(1.25); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <g class="sun-rays" stroke="#fff1af" stroke-width="5" stroke-linecap="round" opacity=".58"><path d="M988 38v-18M988 216v18M908 118h-18M1068 118h18M931 61l-13-13M1045 175l13 13M1045 61l13-13M931 175l-13 13"/></g>
  <circle class="sun-disc" cx="988" cy="118" r="54" fill="url(#sun)"/>
