  <g class="plow" stroke="#40261b" stroke-linejoin="round" stroke-linecap="round"><path d="M871 579l62 42-30 119-40-7 21-103-39-25z" fill="url(#wood)" stroke-width="8"/><path d="M915 619l79-61 18 21-80 75z" fill="url(#wood)" stroke-width="8"/><path d="M932 619l62-61" fill="none" stroke="#edbd69" stroke-width="3" opacity=".8"/><path d="M887 633l-54 74" fill="none" stroke="#70391e" stroke-width="14"/><path d="M902 730l55 16-45 45-61-26z" fill="url(#steel)" stroke-width="7"/><path d="M851 765l61 26-28 14-63-23z" fill="#78827e" stroke-width="5"/><path d="M871 736c28-21 53-23 80 10l-39 45-61-26z" fill="#a9b5b2" stroke-width="5"/></g>
