  <path d="M0 384c129-47 216-19 350 7 104 20 203-37 314-43 174-9 254 37 378-13 69-28 118-34 158-30v162H0z" fill="#5e8948"/>
  <path d="M0 433c157-25 314-16 465 13 186 35 382-28 735-10v364H0z" fill="url(#earth)"/>
  <path d="M0 452c201-26 354 4 490 18 205 22 424-41 710-12v37c-293-34-491 38-712 11C324 474 172 456 0 484z" fill="#d39850" opacity=".32"/>
  <g class="stubble" stroke="#e5ba62" stroke-width="5" stroke-linecap="round" opacity=".9"><path d="M45 447v-22m25 19v-30m30 29v-22m30 25v-29m31 28v-18m526 17v-27m29 28v-33m31 32v-23m29 24v-30m261 26v-24m29 22v-31m27 28v-20"/></g>
  <g fill="none" stroke-linecap="round"><path d="M-58 796C179 669 397 616 710 574" stroke="#4c2118" stroke-width="35" opacity=".59"/><path d="M-24 806C205 692 416 642 716 584" stroke="#db9d51" stroke-width="9" opacity=".84"/><path d="M120 817C350 684 531 625 772 576" stroke="#512319" stroke-width="38" opacity=".62"/><path d="M153 813c214-116 399-169 625-226" stroke="#dfa457" stroke-width="10" opacity=".75"/><path d="M433 818c144-123 265-173 365-233" stroke="#482017" stroke-width="37" opacity=".66"/><path d="M467 814c129-107 245-162 337-218" stroke="#de9f50" stroke-width="9" opacity=".8"/><path d="M782 816c57-122 94-176 119-235" stroke="#482017" stroke-width="35" opacity=".67"/><path d="M816 811c45-103 78-158 96-220" stroke="#e0a458" stroke-width="9" opacity=".76"/><path d="M1152 816c-19-106-63-178-156-244" stroke="#4b2118" stroke-width="34" opacity=".59"/></g>
  <ellipse cx="607" cy="666" rx="329" ry="43" fill="#352018" opacity=".29" filter="url(#shadow)"/>

  <g class="traces" fill="none" stroke-linecap="round"><path d="M637 483C741 486 812 526 896 592" stroke="#372119" stroke-width="15"/><path d="M637 504c98 19 164 55 243 112" stroke="#4e2b1b" stroke-width="10"/><path d="M644 483c99 6 166 45 246 109" stroke="#c78341" stroke-width="3" opacity=".8"/><path d="M644 505c96 21 157 54 230 109" stroke="#b77138" stroke-width="2" opacity=".75"/></g>

  <g class="cow" stroke="#3e251d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g class="tail"><path d="M356 438c-54 9-88 47-86 89 1 25 16 39 36 44" fill="none" stroke="#6e3225" stroke-width="13"/><path d="M307 559c-8 20-24 24-39 16" fill="none" stroke="#35221a" stroke-width="11"/></g>
    <g class="leg-back-a"><path d="M411 511c8 47 3 99-15 145l47 8c23-49 30-105 22-151z" fill="#733023"/><path d="M393 658l52 6-4 23-58-1z" fill="#2c201a"/></g>
    <g class="leg-back-b"><path d="M603 507c35 28 43 75 37 123l42 4c15-64 0-114-41-146z" fill="#743023"/><path d="M639 628l47 3 4 20-53 4z" fill="#2d201a"/></g>
    <path d="M344 416c12-81 109-124 222-100 86 19 130 71 111 137-18 61-85 89-184 75-105-15-160-45-149-112z" fill="url(#cow)"/>
    <path d="M389 396c26-43 83-56 121-30 23 16 25 49 6 84-29 43-87 38-123 7-22-19-21-41-4-61z" fill="#f5e3bd" stroke="none"/><path d="M532 451c41-27 85-11 102 21-8 35-41 57-79 52-33-4-53-23-56-43z" fill="#f6e7c3" stroke="none"/><path d="M487 335c25 4 42 16 50 33-16 14-24 31-26 51-31-5-53-24-58-51 7-17 18-28 34-33z" fill="#f5e3bd" stroke="none"/>
    <path d="M485 514c8 5 34 7 44-1 8 10 4 29-8 35-14 7-35 1-39-13-3-9-2-16 3-21z" fill="#e7ae85" stroke-width="5"/><path d="M496 544v11m19-10v11" stroke="#7d422e" stroke-width="5"/>
    <g class="leg-near-a"><path d="M457 513c7 48-3 101-22 146l49 9c24-48 34-102 28-153z" fill="#974128"/><path d="M435 658l53 8-4 23-60-2z" fill="#302019"/></g>
    <g class="leg-near-b"><path d="M563 514c10 42 10 77-12 117l47 16c33-43 41-88 28-134z" fill="#914129"/><path d="M551 629l53 15-8 22-57-10z" fill="#302019"/></g>
    <path d="M611 373c42-50 96-46 132-10 28 29 26 80-4 109-31 30-88 26-117-6l-29-46z" fill="#ba6339"/>
    <g class="head"><path d="M714 387c31-17 71-2 83 28 15 36-8 79-48 87-35 7-65-18-68-50-3-26 10-52 33-65z" fill="#c47145"/><path d="M750 446c31-7 59 5 65 28 5 24-17 44-51 43-28-1-48-17-45-38 2-15 14-28 31-33z" fill="#efc08a"/><ellipse cx="786" cy="482" rx="6" ry="8" fill="#39231c" stroke="none"/><ellipse cx="757" cy="484" rx="5" ry="7" fill="#39231c" stroke="none"/><path d="M752 501c15 8 30 8 44 1" fill="none" stroke-width="3"/><path d="M705 395c-24-24-47-27-60-10 17 17 36 26 58 25z" fill="#9f4b30"/><path d="M742 390c7-30 21-47 40-56 5 26-4 48-23 67z" fill="#f5dea0"/><circle cx="747" cy="430" r="8" fill="#201814" stroke="none"/><circle cx="750" cy="427" r="2.5" fill="#fff9e8" stroke="none"/></g>
    <path d="M653 397c-13 25-16 58-5 83" fill="none" stroke="#51301f" stroke-width="18"/><path d="M651 402c-10 24-12 47-3 70" fill="none" stroke="#d9a04a" stroke-width="4"/><circle cx="649" cy="476" r="10" fill="#e9bf59" stroke="none"/>
  </g>
