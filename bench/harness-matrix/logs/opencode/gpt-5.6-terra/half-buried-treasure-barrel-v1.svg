<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Half-buried treasure barrel</title>
  <desc id="desc">A weathered wooden treasure barrel protrudes from sunlit sand, overflowing with gold coins and jewels.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74c8df"/>
      <stop offset="1" stop-color="#f8d393"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b4e20"/>
      <stop offset="0.48" stop-color="#5e2816"/>
      <stop offset="1" stop-color="#32140f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e39b38"/>
      <stop offset="0.45" stop-color="#8f451c"/>
      <stop offset="1" stop-color="#482015"/>
    </linearGradient>
    <radialGradient id="sand" cx="50%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffe7a5"/>
      <stop offset="0.58" stop-color="#e8b65f"/>
      <stop offset="1" stop-color="#bd7537"/>
    </radialGradient>
    <radialGradient id="gold" cx="32%" cy="24%" r="75%">
      <stop offset="0" stop-color="#fff7a5"/>
      <stop offset="0.38" stop-color="#f7c83f"/>
      <stop offset="0.75" stop-color="#bd7115"/>
      <stop offset="1" stop-color="#71370a"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16" dx="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.34"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkle" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.25"/>
    </filter>
  </defs>

