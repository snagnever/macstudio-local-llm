<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Animated rubber ducky in a soapy bathtub</title>
  <desc id="desc">A glossy yellow rubber duck gently bobs in turquoise bathwater while foam shifts, bubbles rise, and a tap drips.</desc>
  <style>
    .duck-bob { animation: duck-bob 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .duck-wing { animation: wing-rock 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 54% 60%; }
    .current-a { animation: current-a 5.4s ease-in-out infinite; }
    .current-b { animation: current-b 6.7s ease-in-out infinite; }
    .wake { animation: wake 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .foam-left { animation: foam-left 4.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .foam-right { animation: foam-right 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bubble { animation: bubble-rise 7s ease-in infinite; transform-box: fill-box; transform-origin: center; }
    .bubble.delay-1 { animation-delay: -2.1s; animation-duration: 8.4s; }
    .bubble.delay-2 { animation-delay: -4.8s; animation-duration: 6.5s; }
    .bubble.delay-3 { animation-delay: -1.3s; animation-duration: 9s; }
    .bubble.delay-4 { animation-delay: -5.7s; animation-duration: 7.5s; }
    .tap-drip { animation: drip 2.6s ease-in infinite; }
    .tap-ripple { animation: ripple 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes duck-bob { 0%,100% { transform: translate(0,0) rotate(-.5deg); } 50% { transform: translate(0,-13px) rotate(1deg); } }
    @keyframes wing-rock { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-2deg) translate(1px,-2px); } }
    @keyframes current-a { 0%,100% { transform: translateX(-15px); } 50% { transform: translateX(18px); } }
    @keyframes current-b { 0%,100% { transform: translateX(18px); } 50% { transform: translateX(-16px); } }
    @keyframes wake { 0%,100% { transform: translateX(-5px) scaleX(.98); opacity: .62; } 50% { transform: translateX(7px) scaleX(1.04); opacity: .9; } }
    @keyframes foam-left { 0%,100% { transform: translate(0,0) rotate(-1deg); } 50% { transform: translate(9px,-5px) rotate(1deg); } }
    @keyframes foam-right { 0%,100% { transform: translate(0,0) rotate(1deg); } 50% { transform: translate(-10px,-4px) rotate(-1deg); } }
    @keyframes bubble-rise { 0% { transform: translateY(20px) scale(.72); opacity: 0; } 12% { opacity: .8; } 75% { opacity: .72; } 100% { transform: translateY(-145px) scale(1.2); opacity: 0; } }
    @keyframes drip { 0%,55% { transform: translateY(0) scaleY(.15); opacity: 0; } 62% { opacity: .9; transform: translateY(0) scaleY(.8); } 84% { opacity: .92; transform: translateY(132px) scaleY(1.2); } 100% { transform: translateY(150px) scaleY(.5); opacity: 0; } }
    @keyframes ripple { 0%,80% { transform: scale(.2); opacity: 0; } 86% { opacity: .58; } 100% { transform: scale(2.5); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff5f4"/><stop offset="1" stop-color="#a8d8d8"/></linearGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#e8f7f8"/><stop offset="1" stop-color="#9bcbd2"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#c9edf0"/><stop offset="1" stop-color="#76b7c1"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b8f5f2"/><stop offset=".35" stop-color="#53d5db"/><stop offset="1" stop-color="#1685a9"/></linearGradient>
    <radialGradient id="duck" cx="35%" cy="20%" r="77%"><stop stop-color="#fff9ac"/><stop offset=".29" stop-color="#ffe647"/><stop offset=".72" stop-color="#ffc11a"/><stop offset="1" stop-color="#e88d08"/></radialGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffc855"/><stop offset=".52" stop-color="#fa8429"/><stop offset="1" stop-color="#cf4e1d"/></linearGradient>
    <radialGradient id="bubble" cx="31%" cy="20%" r="78%"><stop stop-color="#fff" stop-opacity=".99"/><stop offset=".51" stop-color="#eaffff" stop-opacity=".9"/><stop offset="1" stop-color="#86dfe3" stop-opacity=".74"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".25" stop-color="#81b9c2"/><stop offset=".52" stop-color="#f5ffff"/><stop offset="1" stop-color="#5c929d"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="15"/><feComponentTransfer><feFuncA type="linear" slope=".24"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="duckShadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".27"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="basinClip"><path d="M160 491c0-61 53-99 124-99h632c71 0 124 38 124 99v109c0 93-67 145-163 145H323c-96 0-163-52-163-145z"/></clipPath>
  </defs>
