  <g transform="translate(999 328)"><ellipse class="tap-ripple" cx="0" cy="0" rx="9" ry="3" fill="none" stroke="#d6ffff" stroke-width="3"/><path class="tap-drip" d="M0 0c-7 10-8 17 0 23 8-6 7-13 0-23z" fill="#d9ffff"/></g>
  <ellipse cx="600" cy="812" rx="504" ry="59" fill="#3d7783" opacity=".25"/>
  <path d="M79 493c0-93 77-151 174-151h694c97 0 174 58 174 151v181c0 123-94 199-211 199H290C173 873 79 797 79 674z" fill="url(#porcelain)" filter="url(#shadow)"/>
  <path d="M112 496c0-79 65-127 146-127h684c81 0 146 48 146 127v112c0 112-83 177-192 177H304c-109 0-192-65-192-177z" fill="url(#rim)"/><path d="M142 496c0-66 55-106 129-106h658c74 0 129 40 129 106v107c0 101-74 158-179 158H321c-105 0-179-57-179-158z" fill="#bfe9ec"/><path d="M160 491c0-61 53-99 124-99h632c71 0 124 38 124 99v109c0 93-67 145-163 145H323c-96 0-163-52-163-145z" fill="url(#water)"/>
  <g clip-path="url(#basinClip)">
    <g class="current-a"><path d="M144 521c90-30 161-19 246 8 78 25 144 19 224-7 83-27 157-31 247-3 70 22 130 24 204-1" fill="none" stroke="#e2ffff" stroke-width="12" stroke-linecap="round" opacity=".62"/></g>
    <g class="current-b"><path d="M132 655c89-31 171-29 250-1 83 30 155 26 232-2 82-30 163-36 244-9 75 25 137 23 211-3" fill="none" stroke="#087e9d" stroke-width="14" stroke-linecap="round" opacity=".34"/><path d="M207 706c93 17 161 11 230-12 82-27 153-25 226 1 86 30 166 27 284-5" fill="none" stroke="#c5ffff" stroke-width="7" stroke-linecap="round" opacity=".4"/></g>
    <ellipse cx="593" cy="627" rx="190" ry="39" fill="#0a7293" opacity=".38"/>
    <g class="duck-bob" filter="url(#duckShadow)"><path d="M429 582c-23-50-13-116 31-156 28-25 67-36 104-27 12-58 61-101 121-101 69 0 125 56 125 125 0 81-65 137-154 149-85 12-183 23-227 10z" fill="url(#duck)"/><g class="duck-wing"><path d="M439 573c52 24 126 29 197 14-36 38-109 58-164 40-19-7-34-21-33-54z" fill="#df9008" opacity=".38"/><path d="M476 519c31-43 95-54 135-11 23 25 27 63 8 92-36 21-100 21-147-3-14-25-12-54 4-78z" fill="#f8b70e" opacity=".92"/><path d="M487 536c34-27 80-28 109-4" fill="none" stroke="#ffe775" stroke-width="10" stroke-linecap="round" opacity=".58"/></g><ellipse cx="518" cy="434" rx="34" ry="54" fill="#fff8a8" opacity=".57"/><path d="M625 363c28-22 66-22 93 0" fill="none" stroke="#edac0e" stroke-width="10" stroke-linecap="round" opacity=".58"/><ellipse cx="704" cy="387" rx="15" ry="18" fill="#203544"/><ellipse cx="699" cy="381" rx="5" ry="6" fill="#fff"/><path d="M730 419c29-20 71-17 96 8 3 3 3 8 0 12-23 31-73 45-104 22-14-10-8-32 8-42z" fill="url(#beak)"/><path d="M745 449c20 9 47 7 65-5" fill="none" stroke="#b9421d" stroke-width="5" stroke-linecap="round" opacity=".82"/><path d="M634 458c17 12 40 16 61 7" fill="none" stroke="#d9910b" stroke-width="7" stroke-linecap="round" opacity=".58"/></g>
    <g class="wake"><path d="M385 622c61-20 121-14 177 7 63 24 129 20 189-2 72-27 146-28 239-4" fill="none" stroke="#bcfbf6" stroke-width="18" stroke-linecap="round" opacity=".77"/><path d="M407 641c56 10 96 9 137-2M781 638c48-13 91-13 139-2" fill="none" stroke="#f1ffff" stroke-width="5" stroke-linecap="round" opacity=".68"/></g>
  </g>
  <g fill="url(#bubble)" stroke="#aee4e6" stroke-width="3"><g class="foam-left" transform="translate(198 495)"><circle cx="0" cy="27" r="33"/><circle cx="37" cy="3" r="30"/><circle cx="76" cy="29" r="40"/><circle cx="40" cy="59" r="35"/><path d="M14 18c12-16 28-20 41-14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g><g class="foam-right" transform="translate(887 502)"><circle cx="0" cy="28" r="36"/><circle cx="39" cy="0" r="31"/><circle cx="81" cy="31" r="42"/><circle cx="43" cy="61" r="35"/><path d="M22 19c13-17 29-20 43-13" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g><g class="foam-right" transform="translate(244 666)"><circle cx="0" cy="22" r="29"/><circle cx="33" cy="0" r="23"/><circle cx="65" cy="24" r="32"/><circle cx="101" cy="11" r="19"/><path d="M-8 15c9-10 18-13 27-9" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g><g class="foam-left" transform="translate(921 653)"><circle cx="0" cy="25" r="31"/><circle cx="38" cy="0" r="25"/><circle cx="70" cy="27" r="33"/><circle cx="111" cy="10" r="21"/><path d="M-7 17c9-11 19-13 28-9" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g></g>
  <g fill="url(#bubble)" stroke="#c1eff0" stroke-width="3" filter="url(#glow)"><circle class="bubble" cx="154" cy="349" r="19"/><circle class="bubble delay-1" cx="190" cy="309" r="12"/><circle class="bubble delay-2" cx="365" cy="318" r="14"/><circle class="bubble delay-3" cx="763" cy="269" r="17"/><circle class="bubble delay-4" cx="797" cy="236" r="10"/><circle class="bubble delay-2" cx="1046" cy="337" r="22"/><circle class="bubble delay-1" cx="1084" cy="288" r="13"/></g>
