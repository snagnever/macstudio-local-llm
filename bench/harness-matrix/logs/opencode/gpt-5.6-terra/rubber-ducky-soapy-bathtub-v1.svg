    <circle cx="1000" cy="646" r="25"/><circle cx="1032" cy="626" r="19"/><circle cx="1051" cy="655" r="27"/>
    <circle cx="453" cy="702" r="22"/><circle cx="480" cy="686" r="16"/><circle cx="502" cy="707" r="23"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9">
    <path d="M285 497c10-12 25-14 36-8"/><path d="M878 523c9-11 21-13 31-7"/>
    <path d="M224 647c6-8 15-10 22-5"/><path d="M995 638c7-9 16-11 23-5"/>
  </g>
  <g fill="#f9ffff" stroke="#d7f3f1" stroke-width="3" opacity=".94">
    <circle cx="180" cy="337" r="17"/><circle cx="207" cy="301" r="10"/><circle cx="1014" cy="329" r="20"/><circle cx="1051" cy="286" r="12"/>
