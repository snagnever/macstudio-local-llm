<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Rubber duck floating in a soapy bathtub</title>
  <desc id="desc">A bright yellow rubber duck rests among blue water, white soap bubbles, and a porcelain bathtub.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e6f4f1"/>
      <stop offset="1" stop-color="#c9e6e1"/>
    </linearGradient>
    <linearGradient id="tub" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9edf1"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7fdae3"/>
      <stop offset="1" stop-color="#269eb5"/>
    </linearGradient>
    <radialGradient id="duck" cx="36%" cy="26%" r="75%">
      <stop stop-color="#fff7a0"/>
      <stop offset=".48" stop-color="#ffd936"/>
      <stop offset="1" stop-color="#e6a30c"/>
    </radialGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff9b35"/>
      <stop offset="1" stop-color="#e85b1d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13"/>
      <feOffset dy="13"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bubbleGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#fff" flood-opacity=".75" result="light"/>
      <feComposite in="light" in2="blur" operator="in" result="shine"/>
      <feMerge><feMergeNode in="shine"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>
  <path d="M0 205H1200M0 410H1200M220 0V410M600 0V410M980 0V410" stroke="#b4d8d5" stroke-width="7" opacity=".8"/>
  <path d="M0 210H1200" stroke="#f7ffff" stroke-width="6" opacity=".75"/>

  <g opacity=".85">
    <path d="M936 130v128M875 194h122" stroke="#89b9c0" stroke-width="25" stroke-linecap="round"/>
    <path d="M936 130v128M875 194h122" stroke="#e7fbfb" stroke-width="15" stroke-linecap="round"/>
    <path d="M923 242c4 31 22 43 38 43s34-12 38-43" fill="none" stroke="#e7fbfb" stroke-width="15" stroke-linecap="round"/>
  </g>

  <ellipse cx="600" cy="774" rx="507" ry="89" fill="#88afb6" opacity=".32"/>
  <path d="M104 485c0-79 62-123 138-123h716c76 0 138 44 138 123v181c0 113-87 180-190 180H294c-103 0-190-67-190-180z" fill="url(#tub)" filter="url(#shadow)"/>
  <path d="M137 497c0-67 48-101 112-101h702c64 0 112 34 112 101v94c0 96-67 150-164 150H301c-97 0-164-54-164-150z" fill="#b9e7eb"/>
  <path d="M155 504c0-51 39-80 97-80h696c58 0 97 29 97 80v75c0 84-55 133-150 133H305c-95 0-150-49-150-133z" fill="url(#water)"/>
  <path d="M178 569c104-41 196 35 291 2s143-59 250-10 194 14 295-30" fill="none" stroke="#c8fbf7" stroke-width="13" stroke-linecap="round" opacity=".7"/>
  <path d="M208 638c101-27 141 17 239 12 88-5 157-48 259-13 95 33 172 10 296-12" fill="none" stroke="#0f7793" stroke-width="10" stroke-linecap="round" opacity=".35"/>

  <g filter="url(#shadow)">
    <ellipse cx="608" cy="664" rx="179" ry="39" fill="#0c7891" opacity=".4"/>
    <path d="M514 600c-34-45-33-126 9-172 33-36 93-44 135-17 25-46 80-65 132-44 65 26 96 103 68 166-29 65-111 102-199 102-62 0-117-11-145-35z" fill="url(#duck)"/>
    <path d="M521 593c47 29 152 47 225 18-31 26-88 41-145 32-35-6-65-22-80-41z" fill="#d8960c" opacity=".5"/>
    <ellipse cx="602" cy="438" rx="33" ry="46" fill="#fff4a0" opacity=".55"/>
    <circle cx="713" cy="427" r="13" fill="#213345"/>
    <circle cx="709" cy="423" r="4" fill="#fff"/>
    <path d="M757 464c31-17 75-11 94 13-14 33-67 46-100 26-12-8-9-30 6-39z" fill="url(#beak)"/>
    <path d="M777 489c19 7 44 4 60-7" fill="none" stroke="#bd3f1d" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  </g>

