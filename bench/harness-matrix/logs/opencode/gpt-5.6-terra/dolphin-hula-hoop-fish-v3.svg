<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A dolphin leaps through a hoop for a fish</title>
  <desc id="desc">In a bright aquarium show, a dolphin arcs out of the pool through a colorful hula hoop to take a fish offered by its trainer.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9ce4ed"/><stop offset=".6" stop-color="#d9f0dc"/><stop offset=".601" stop-color="#0e92b1"/><stop offset="1" stop-color="#07516e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#167f9d"/><stop offset="1" stop-color="#063d5b"/></linearGradient>
    <linearGradient id="dolphin" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#c8f0ee"/><stop offset=".43" stop-color="#55b5c2"/><stop offset="1" stop-color="#17647d"/></linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#fffde9"/><stop offset="1" stop-color="#a9d9d5"/></linearGradient>
    <linearGradient id="hoop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdf4d"/><stop offset=".22" stop-color="#fb8b42"/><stop offset=".52" stop-color="#e7447d"/><stop offset=".77" stop-color="#8457b5"/><stop offset="1" stop-color="#32b9c5"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f16b5b"/><stop offset="1" stop-color="#b9395b"/></linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#164056" flood-opacity=".24"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <circle cx="139" cy="128" r="56" fill="#fff8bd" opacity=".9"/>
  <g fill="#fff" opacity=".72">
    <path d="M55 260c24-33 63-33 88-2 26-23 66-12 79 20H30c2-8 12-15 25-18z"/>
    <path d="M695 160c19-26 51-25 71 0 18-14 48-7 59 17H674c3-7 11-13 21-17z"/>
  </g>
  <path d="M0 590C158 568 313 576 470 601c245 39 480 28 730-12v211H0z" fill="url(#water)"/>
  <path d="M0 592c161-23 314-15 472 10 244 39 478 29 728-11" fill="none" stroke="#a9f1ec" stroke-width="8" opacity=".9"/>
  <path d="M0 686c190-23 341-11 506 15 229 35 455 28 694-12" fill="none" stroke="#178ba5" stroke-width="8" opacity=".72"/>
  <g fill="none" stroke="#d9ffff" stroke-linecap="round" opacity=".7">
    <path d="M63 643c27 14 53 14 80 0m29 79c31 15 60 14 89-2m721-59c23 13 47 13 69 0" stroke-width="4"/>
    <path d="M318 662c14 9 28 9 42 0m-93 88c9 6 18 6 27 0" stroke-width="3"/>
  </g>

  <!-- Rear rim makes the opening unambiguous before the dolphin crosses it. -->
  <g transform="rotate(-11 553 335)" fill="none">
    <ellipse cx="553" cy="335" rx="176" ry="222" stroke="#184d6e" stroke-width="43" opacity=".16"/>
    <ellipse cx="553" cy="327" rx="176" ry="222" stroke="url(#hoop)" stroke-width="29"/>
    <ellipse cx="553" cy="327" rx="160" ry="206" stroke="#fff7b8" stroke-width="3" opacity=".82"/>
  </g>

  <!-- The trainer's body sits behind the offered hand so the hand-to-fish action stays readable. -->
  <g filter="url(#lift)">
    <path d="M1005 571c-10-66 5-125 44-153 45-2 81 40 78 102l27 51z" fill="#273e75"/>
    <path d="M1008 424c-18-28-10-69 19-87 33 1 54 29 47 63-6 32-36 48-66 24z" fill="#d18d70"/>
    <path d="M1009 355c8-33 45-43 67-17 9 11 11 25 7 38-16-15-43-20-67-8z" fill="#332b52"/>
    <path d="M997 442c17-25 53-34 82-12l37 49-87 61-44-52c-12-15-8-32 12-46z" fill="url(#shirt)"/>
    <path d="M1048 451c-18-32-36-68-57-115-7-16-23-21-34-12-9 7-10 19-5 29 16 32 29 76 51 112z" fill="#d18d70" stroke="#9f5a4e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M1001 571h161c17 0 27 14 22 31H973c-4-17 10-31 28-31z" fill="#fff8e7"/>
  </g>

  <!-- A single strong curve from tail to beak gives the dolphin a credible jumping trajectory. -->
  <g filter="url(#lift)">
    <path d="M330 437c-51-38-101-32-135-2 39 14 59 39 68 72-44 2-73 24-85 53 58 12 115-12 151-66z" fill="url(#dolphin)" stroke="#105570" stroke-width="7" stroke-linejoin="round"/>
    <path d="M327 441c-38-8-74 3-101 29 31 4 54 18 70 39z" fill="#d9f4ee" opacity=".76"/>
    <path d="M318 486c27-130 122-209 252-211 82-1 145 28 202 19 32-5 61-22 89-7-22 13-43 29-66 48 33 1 61 10 86 27-43 17-87 21-131 13-69 50-157 89-254 106-84 15-143 15-178-1z" fill="url(#dolphin)" stroke="#105570" stroke-width="7" stroke-linejoin="round"/>
    <path d="M329 472c74-41 145-54 218-42 61 10 132-8 182-41 18 10 39 19 61 21-61 37-149 68-245 82-83 13-152 7-216-20z" fill="url(#belly)"/>
    <path d="M474 308c-19-59-1-111 49-145-4 63 19 112 52 148z" fill="#267c93" stroke="#105570" stroke-width="6" stroke-linejoin="round"/>
    <path d="M497 445c-18 60-60 101-108 108 20-42 20-81 8-116z" fill="#287b91" stroke="#105570" stroke-width="6" stroke-linejoin="round"/>
    <path d="M637 425c34 46 80 66 123 58-35-28-53-59-58-96z" fill="#287b91" stroke="#105570" stroke-width="6" stroke-linejoin="round"/>
    <path d="M750 330c31-17 68-22 101-16-24 14-47 32-71 51-23 17-51 22-78 16 12-19 28-36 48-51z" fill="#9bd4d6" stroke="#105570" stroke-width="6" stroke-linejoin="round"/>
    <path d="M708 380c27 10 55 8 82-6-19 19-43 30-70 31-16 0-29-8-40-18z" fill="#fffde9"/>
    <ellipse cx="747" cy="318" rx="10" ry="12" fill="#173c53"/><circle cx="744" cy="314" r="3.5" fill="#fff"/>
    <path d="M755 362c14 5 29 5 42-1" fill="none" stroke="#105570" stroke-width="3" stroke-linecap="round"/>
    <path d="M442 392c25 10 48 11 69 5m21-80c25 9 52 10 78 4" fill="none" stroke="#d7f8f0" stroke-width="5" stroke-linecap="round" opacity=".48"/>
  </g>

  <!-- Only this near lower segment covers the dolphin, completing the through-the-hoop illusion. -->
  <g transform="rotate(-11 553 327)" fill="none" stroke-linecap="round">
    <path d="M391 444c34 79 113 119 193 102 68-15 121-82 124-159" stroke="#d53e7e" stroke-width="29"/>
    <path d="M397 445c35 70 107 107 176 94" stroke="#ffda4e" stroke-width="7" opacity=".95"/>
  </g>

  <!-- Fish nose meets the dolphin's open beak; its tail remains visibly held by the trainer. -->
  <g filter="url(#lift)">
    <path d="M844 329c18-17 46-18 67-7l18-17 4 20 22 9-20 11-7 22-18-16c-24 11-51 4-66-22z" fill="#f4a83b" stroke="#a9503e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M891 320c7 9 7 18 0 27" fill="none" stroke="#c85d40" stroke-width="3"/><circle cx="869" cy="327" r="4" fill="#273849"/>
    <path d="M850 340c11 4 21 2 29-3" fill="none" stroke="#a9503e" stroke-width="3" stroke-linecap="round"/>
    <path d="M930 315c8-10 23-9 31 1l7 10-10 18-19-4c-11-2-15-15-9-25z" fill="#d18d70" stroke="#9f5a4e" stroke-width="3"/>
    <path d="M942 320c7 3 12 8 15 14m-20-4c5 2 9 6 12 10" fill="none" stroke="#9f5a4e" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Splash follows from the tail instead of obscuring the silhouette. -->
  <g fill="#d9ffff" opacity=".9">
    <path d="M234 548c-24 40-16 75 4 99 7-37 26-61 55-76-27-6-45-15-59-23z"/>
    <path d="M302 550c-8 37 6 64 29 82-4-33 5-58 26-78z"/>
    <path d="M274 582c-11 33-4 57 13 74 0-28 10-47 28-62z"/>
    <circle cx="199" cy="650" r="7"/><circle cx="230" cy="691" r="4"/><circle cx="352" cy="624" r="5"/>
  </g>
  <g fill="#a6eeee" opacity=".75"><circle cx="96" cy="745" r="6"/><circle cx="149" cy="768" r="3"/><circle cx="1088" cy="738" r="6"/><circle cx="1042" cy="775" r="4"/></g>
</svg>
