<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">A bustling fruit stall at the market</title>
  <desc id="description">A sunlit wooden market stall under a red and cream striped canopy, with crates of oranges, apples, pears, bananas, grapes and watermelon.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f5d9a8"/><stop offset="1" stop-color="#d8925f"/></linearGradient>
    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#c78250"/><stop offset="1" stop-color="#925338"/></linearGradient>
    <linearGradient id="wood" x2=".15" y2="1"><stop stop-color="#c87939"/><stop offset=".55" stop-color="#87431f"/><stop offset="1" stop-color="#512719"/></linearGradient>
    <linearGradient id="canvas" x2="0" y2="1"><stop stop-color="#fff1c9"/><stop offset="1" stop-color="#eac882"/></linearGradient>
    <radialGradient id="orange" cx="32%" cy="25%"><stop stop-color="#ffe29b"/><stop offset=".35" stop-color="#ffb83e"/><stop offset="1" stop-color="#d95a14"/></radialGradient>
    <radialGradient id="apple" cx="31%" cy="22%"><stop stop-color="#ffb19a"/><stop offset=".4" stop-color="#e4533e"/><stop offset="1" stop-color="#8d2830"/></radialGradient>
    <radialGradient id="pear" cx="33%" cy="25%"><stop stop-color="#fff3a1"/><stop offset=".45" stop-color="#c8d64e"/><stop offset="1" stop-color="#6e8c2c"/></radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#3b2019" flood-opacity=".28"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="slats" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 2h28M0 24h28" stroke="#f1b369" stroke-opacity=".35" stroke-width="3"/></pattern>
  </defs>

  <!-- Market setting -->
  <rect width="1200" height="900" fill="url(#wall)"/>
