<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Family picnic above a sea of clouds</title>
  <desc id="desc">Two parents and two children arrange a picnic on a red checked tarp, beside their landed striped hot air balloon, on a broad cloud high in a blue sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#58bddd"/><stop offset=".58" stop-color="#bce8eb"/><stop offset="1" stop-color="#f9dcc4"/></linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop stop-color="#fff9cc"/><stop offset="1" stop-color="#ffd87a"/></radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#d5e7e5"/></linearGradient>
    <linearGradient id="balloon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffcf59"/><stop offset=".48" stop-color="#ef7758"/><stop offset="1" stop-color="#b63d61"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="checks" width="42" height="42" patternUnits="userSpaceOnUse"><rect width="42" height="42" fill="#fff0d8"/><path d="M0 0H42V42H0Z" fill="none" stroke="#e86f62" stroke-width="16" opacity=".58"/><path d="M0 21H42M21 0V42" stroke="#c94f59" stroke-width="2" opacity=".75"/></pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1030" cy="128" r="66" fill="url(#sun)" opacity=".96"/>
  <g fill="#fff" opacity=".65">
    <path d="M74 184c28-35 70-30 91 1 31-23 82-5 84 30H32c2-17 18-29 42-31Z"/>
    <path d="M658 142c25-30 63-27 82 1 27-22 70-5 74 25H586c5-16 33-27 72-26Z"/>
  </g>
  <!-- Soft cloud horizon makes the picnic's cloud feel high above the world. -->
  <g fill="#c6e1e2" opacity=".7">
    <path d="M0 519c61-66 146-57 184-5 62-56 161-45 195 18 80-55 161-40 193 20v105H0Z"/>
    <path d="M653 545c47-59 125-52 159-8 55-42 135-37 171 17 59-48 152-34 217 31v72H653Z"/>
  </g>
  <g fill="url(#cloud)">
    <path d="M0 661c31-70 119-95 178-48 35-83 170-102 227-24 73-81 205-47 220 49 67-63 173-47 209 23 48-68 164-75 215-6 62-54 126-23 151 33V800H0Z"/>
  </g>
  <g fill="#bedcdb" opacity=".65"><ellipse cx="159" cy="733" rx="130" ry="26"/><ellipse cx="500" cy="745" rx="181" ry="30"/><ellipse cx="902" cy="737" rx="158" ry="27"/></g>

  <!-- Landed balloon: its basket rests on the cloud and is visibly tethered. -->
  <g filter="url(#shadow)" stroke-linejoin="round">
    <path d="M145 106C66 142 67 286 151 351c28 22 82 22 109 0 85-66 86-210 7-245-37-17-86-17-122 0Z" fill="url(#balloon)" stroke="#8c3c56" stroke-width="5"/>
    <path d="M151 119c-42 58-38 166 11 231M205 105c22 67 23 179 1 261M258 116c46 62 41 169-8 235" fill="none" stroke="#ffe170" stroke-width="23" opacity=".88"/>
    <path d="M164 349 181 414M246 350 230 414" fill="none" stroke="#754c43" stroke-width="5"/>
    <path d="M178 402h57l-7 49h-44Z" fill="#a86d45" stroke="#70473a" stroke-width="5"/>
    <path d="M180 421h53M206 405v44" stroke="#e6ae6d" stroke-width="4"/>
    <path d="M183 451c-12 23-34 36-57 41" fill="none" stroke="#795448" stroke-width="4"/>
    <path d="M121 488c-6 7-2 17 7 17 9 0 13-11 7-17-4-5-10-5-14 0Z" fill="#e9c56e" stroke="#795448" stroke-width="3"/>
  </g>

  <!-- The spread is centered and large enough that each food item reads clearly. -->
  <g filter="url(#shadow)" stroke-linejoin="round">
    <path d="M364 580 735 535 936 683 493 732Z" fill="url(#checks)" stroke="#bd5360" stroke-width="5"/>
    <path d="M364 580 735 535 936 683" fill="none" stroke="#fff9e9" stroke-width="3" opacity=".8"/>
    <ellipse cx="665" cy="625" rx="94" ry="28" fill="#c25959" opacity=".3"/>
    <ellipse cx="665" cy="613" rx="94" ry="30" fill="#fff8df" stroke="#b64d58" stroke-width="4"/>
    <path d="M600 610c10-15 23-16 35 0 11-16 27-16 39 0 11-16 28-15 40 1 11-15 25-14 35 1" fill="none" stroke="#eaa34b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="613" cy="636" r="12" fill="#e94e4d"/><path d="M611 622c5-11 15-13 20-13" fill="none" stroke="#55915d" stroke-width="4"/>
    <path d="M768 602h61l9 58h-74Z" fill="#b87b52" stroke="#754b3e" stroke-width="4"/><path d="M774 611h51l-5 18h-43Z" fill="#fff1bd"/>
    <path d="M489 641c9-28 49-31 63-5 12 23-7 46-31 43-23-2-39-16-32-38Z" fill="#db5555" stroke="#9e3e4b" stroke-width="4"/><path d="M520 642c-1-14 8-26 22-30" fill="none" stroke="#4e955d" stroke-width="6" stroke-linecap="round"/>
    <path d="M838 587c26-17 57 4 50 35l-11 22h-56l-7-27c-4-13 10-26 24-30Z" fill="#83a960" stroke="#547b4e" stroke-width="4"/><path d="M827 612c16-12 39-12 54 0" fill="none" stroke="#ecf0bd" stroke-width="5"/>
    <path d="M568 669h56l-7 33h-43Z" fill="#75a3b7" stroke="#456f87" stroke-width="4"/><path d="M575 678h42" stroke="#e6f4eb" stroke-width="5"/>
  </g>

  <!-- Left parent kneels to place the apple. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M366 469c-31 20-34 67-13 101l27 41 57-21-19-50 29-43Z" fill="#45698c" stroke="#294963" stroke-width="5"/>
    <path d="M383 596 349 650M419 586l44 38" stroke="#c98261" stroke-width="18"/><path d="M341 650h22M457 623h23" stroke="#63443c" stroke-width="15"/>
    <path d="M376 492c-3-29 35-43 54-24 18 19 5 48-19 49-22 1-34-10-35-25Z" fill="#c98261" stroke="#63443c" stroke-width="4"/>
    <path d="M374 491c4-31 45-42 62-14-19 4-31 13-39 25Z" fill="#46383a"/><circle cx="415" cy="495" r="3" fill="#342b2c" stroke="none"/><path d="M405 507q8 8 17 0" fill="none" stroke="#9d4f4c" stroke-width="3"/>
    <path d="M426 537 470 574 510 648" fill="none" stroke="#c98261" stroke-width="17"/><path d="M505 643 519 653" stroke="#63443c" stroke-width="12"/>
  </g>

  <!-- Child one is actively passing a sandwich. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M518 496c-23 17-25 50-10 76l16 34 43-8-4-39 17-34Z" fill="#6fa57d" stroke="#47765e" stroke-width="4"/>
    <path d="M528 600 510 646M556 596l24 43" stroke="#ce845d" stroke-width="14"/><path d="M504 646h16M576 639h16" stroke="#67473e" stroke-width="12"/>
    <path d="M524 506c0-23 29-32 45-14 15 17 1 39-18 39-18 0-27-11-27-25Z" fill="#ce845d" stroke="#67473e" stroke-width="3.5"/><path d="M523 504c6-25 38-30 52-7-20-1-33 6-43 17Z" fill="#5a403a"/><circle cx="555" cy="509" r="2.5" fill="#332a2b" stroke="none"/><path d="M546 520q7 6 14 0" fill="none" stroke="#9b4d49" stroke-width="2.5"/>
    <path d="M570 547 612 565 640 584" fill="none" stroke="#ce845d" stroke-width="13"/><path d="M635 578 651 587" stroke="#67473e" stroke-width="10"/>
  </g>

  <!-- Child two crouches beside the picnic basket. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M693 491c-25 17-27 52-9 78l20 30 42-14-10-38 20-34Z" fill="#8577ad" stroke="#5f5685" stroke-width="4"/>
    <path d="M706 591 687 637M735 582l28 42" stroke="#945f49" stroke-width="14"/><path d="M681 637h16M759 624h16" stroke="#533b39" stroke-width="12"/>
    <path d="M699 500c0-23 30-31 45-12 14 18-1 39-19 38-18-1-27-11-26-26Z" fill="#945f49" stroke="#533b39" stroke-width="3.5"/><path d="M698 499c6-25 39-29 53-6-20-2-35 6-43 18Z" fill="#342e31"/><circle cx="730" cy="505" r="2.5" fill="#2d2829" stroke="none"/><path d="M721 516q7 6 14 0" fill="none" stroke="#753e45" stroke-width="2.5"/>
    <path d="M700 546 671 575 644 595" fill="none" stroke="#945f49" stroke-width="13"/><path d="M649 588 637 600" stroke="#533b39" stroke-width="10"/>
  </g>

  <!-- Right parent arrives with a rolled blanket, completing the family of four. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M908 448c-31 19-36 62-19 101l22 49 55-19-13-53 25-44Z" fill="#d96759" stroke="#a8464b" stroke-width="5"/>
    <path d="M915 588 889 645M950 579l38 43" stroke="#aa6d50" stroke-width="18"/><path d="M882 645h23M981 621h23" stroke="#57413d" stroke-width="15"/>
    <path d="M915 469c-2-29 37-41 55-20 17 20 2 48-21 48-21 0-33-11-34-28Z" fill="#aa6d50" stroke="#57413d" stroke-width="4"/><path d="M913 467c6-31 47-39 63-10-19 1-34 10-43 23Z" fill="#2d3038"/><circle cx="954" cy="473" r="3" fill="#30292b" stroke="none"/><path d="M944 486q9 8 18 0" fill="none" stroke="#864446" stroke-width="3"/>
    <path d="M957 526 996 548 1035 571" fill="none" stroke="#aa6d50" stroke-width="17"/><rect x="1027" y="557" width="82" height="29" rx="14" fill="#668cab" stroke="#415d78" stroke-width="4" transform="rotate(12 1068 572)"/><path d="M1042 558 1036 584M1085 565l-6 25" stroke="#f2d987" stroke-width="4"/>
  </g>
  <g fill="#fff" opacity=".85"><circle cx="459" cy="176" r="3"/><circle cx="1080" cy="292" r="4"/><circle cx="1130" cy="344" r="2.5"/></g>
</svg>
