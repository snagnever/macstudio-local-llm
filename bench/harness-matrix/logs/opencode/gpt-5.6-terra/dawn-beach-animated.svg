<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Dawn games at the beach</title>
  <desc id="desc">An animated sunrise beach scene: friends play volleyball and paddle ball, sailboats cross the sea, palms sway, and a plane pulls a banner that reads Qwen 3.8 can draw.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17284d"/><stop offset=".38" stop-color="#6b5b86"/><stop offset=".66" stop-color="#ec9475"/><stop offset="1" stop-color="#ffe0a1"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#427f9d"/><stop offset=".48" stop-color="#22728c"/><stop offset="1" stop-color="#125970"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8d995"/><stop offset="1" stop-color="#d99055"/></linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7db"/><stop offset="1" stop-color="#f5c968"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#fff6ba" stop-opacity=".88"/><stop offset=".45" stop-color="#ffd782" stop-opacity=".35"/><stop offset="1" stop-color="#ffd782" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#553c4a" flood-opacity=".24"/></filter>
    <path id="wave" d="M-80 0q25-11 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0"/>
    <path id="frond" d="M0 0C35-32 79-37 124-19C84-3 42 8 0 0Z"/>
  </defs>
  <!-- Dawn sky, slowly brightening glow, and drifting clouds. -->
  <rect width="1200" height="720" fill="url(#sky)"/>
  <ellipse cx="597" cy="311" rx="205" ry="147" fill="url(#glow)" filter="url(#blur)"><animate attributeName="opacity" values=".72;1;.72" dur="9s" repeatCount="indefinite"/></ellipse>
  <g transform="translate(597 331)"><circle r="58" fill="#fff2a7"/><circle r="50" fill="#fff7c7" opacity=".58"/><animateTransform attributeName="transform" type="translate" values="597 343;597 315;597 343" dur="18s" repeatCount="indefinite"/></g>
  <g fill="#ffe6cb" opacity=".48">
