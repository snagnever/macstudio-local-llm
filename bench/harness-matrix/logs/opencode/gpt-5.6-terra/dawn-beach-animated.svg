  </g>
  <g fill="none" stroke="#34466d" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M149 249q12-11 24 0q12-11 24 0"><animateTransform attributeName="transform" type="translate" values="0 0;54 -5;0 0" dur="9s" repeatCount="indefinite"/></path><path d="M829 222q12-10 24 0q12-10 24 0"><animateTransform attributeName="transform" type="translate" values="0 0;48 4;0 0" dur="11s" repeatCount="indefinite"/></path></g>
