  <g transform="translate(926 371) scale(.67)" filter="url(#shadow)"><g><path d="M-67 37H68L45 57H-43Z" fill="#1f415b"/><path d="M-5 35V-58L-55 35Z" fill="#fff2c9"/><path d="M1 35V-36L51 35Z" fill="#e6a94e"/><path d="M-5-61V39" stroke="#22455d" stroke-width="5"/><animateTransform attributeName="transform" type="rotate" values="2;-2;2" dur="5s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="translate" values="926 371;908 366;926 371" dur="8s" repeatCount="indefinite"/></g>
