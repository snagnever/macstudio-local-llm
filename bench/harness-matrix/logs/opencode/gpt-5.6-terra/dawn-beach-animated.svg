  <g filter="url(#shadow)"><path d="M432 560v119m156-119v119" stroke="#fff1cf" stroke-width="5" stroke-dasharray="8 9"/><path d="M433 603h155" stroke="#fff1cf" stroke-width="3"/><g stroke="#273b58" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"><g><circle cx="358" cy="548" r="15" fill="#915b42" stroke="none"/><path d="M346 540q13-19 28-2" stroke="#3b3351" stroke-width="12"/><path d="M357 565l-5 53m3-36l-30-26m30 26l34-42m-37 78l-27 43m27-43l29 38"/><path d="M347 575l19 5" stroke="#e45f5b" stroke-width="14"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -44;0 0" dur="1.4s" repeatCount="indefinite"/></g><g><circle cx="660" cy="582" r="15" fill="#754836" stroke="none"/><path d="M648 574q14-19 28 0" stroke="#efb24f" stroke-width="12"/><path d="M659 599l2 51m-1-31l-30-13m30 13l33-24m-31 55l-25 35m25-35l32 30"/><path d="M651 608l19 2" stroke="#4d78a5" stroke-width="14"/><animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="1.1s" repeatCount="indefinite"/></g></g><g stroke="#cf5e58" stroke-width="3" fill="#fff4ce"><circle cx="465" cy="456" r="19"/><path d="M448 450l17 7 13-13m-13 13 2 19m-19-26 3 17" fill="none"/><animateTransform attributeName="transform" type="translate" values="0 0;132 78;0 0" dur="1.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" additive="sum" values="0 465 456;360 465 456" dur="1.4s" repeatCount="indefinite"/></g></g>
