  <g><g><path d="M-230 120c36 6 61 6 93-2" fill="none" stroke="#fff0cf" stroke-width="3"/><path d="M-468 82h235l-8 58h-235Z" fill="#fff6dc" stroke="#b74f58" stroke-width="3"/><path d="M-455 94h209" stroke="#edb35e" stroke-width="4" opacity=".75"/><text x="-453" y="120" fill="#273b60" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Qwen 3.8 can draw</text><path d="M-117 98l49 5 33-22 14 6-23 22 42 14-10 10-44-13-19 16-13-4 12-17-57-2-19 15-13-4 16-20-28-10 11-7Z" fill="#fff8df" stroke="#b74f58" stroke-width="3" stroke-linejoin="round"/><path d="M-66 105l18 2" stroke="#6482a1" stroke-width="3" stroke-linecap="round"/><circle cx="-58" cy="113" r="5" fill="#365879"/><animateTransform attributeName="transform" type="translate" values="-10 0;1700 -28" dur="24s" repeatCount="indefinite"/></g></g>
