    <path d="M710 638 L738 635 L747 649 L715 653Z" fill="#fff3c9"/>
    <path d="M498 637 C507 609 545 606 555 633 C563 655 545 669 526 667 C507 666 490 655 498 637Z" fill="#df4b4e" stroke="#a93847" stroke-width="3"/>
    <path d="M526 622 C525 610 533 601 544 596" fill="none" stroke="#4e925b" stroke-width="6" stroke-linecap="round"/>
    <path d="M539 599 C551 591 561 598 554 607" fill="#62a866"/>
