  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M729 479 C703 491 700 529 713 559 L730 602 L771 593 L768 546 L782 500Z" fill="#8372ae" stroke="#62558a" stroke-width="4"/>
    <path d="M730 595 L709 642 M761 591 L788 633" stroke="#8f5e48" stroke-width="14"/>
    <path d="M702 641 L716 644 M782 632 L796 629" stroke="#553e3b" stroke-width="12"/>
    <path d="M713 492 C713 470 742 464 758 481 C771 497 758 517 739 517 C719 516 707 508 713 492Z" fill="#8f5e48" stroke="#553e3b" stroke-width="3.5"/>
    <path d="M712 491 C714 466 748 461 764 482 C748 481 736 486 724 500Z" fill="#3b3132"/>
    <circle cx="742" cy="495" r="2.4" fill="#30292a" stroke="none"/>
