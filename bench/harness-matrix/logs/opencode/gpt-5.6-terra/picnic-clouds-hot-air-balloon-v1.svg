  <g filter="url(#shadow)">
    <path d="M179 115 C96 151 95 288 182 364 C206 385 269 385 294 362 C382 280 375 151 294 115 C262 100 212 100 179 115Z" fill="url(#balloon)" stroke="#9d4354" stroke-width="5"/>
    <path d="M190 120 C157 167 154 279 205 359" fill="none" stroke="#ffdd69" stroke-width="28" opacity="0.88"/>
    <path d="M246 108 C274 176 276 286 252 375" fill="none" stroke="#963a58" stroke-width="28" opacity="0.8"/>
    <path d="M301 123 C340 177 341 280 282 362" fill="none" stroke="#ffd357" stroke-width="25" opacity="0.87"/>
