    <path d="M865 476 C868 448 906 442 923 465 C937 484 923 506 901 505 C878 504 859 495 865 476Z" fill="#a86a4e" stroke="#5e4741" stroke-width="4"/>
    <path d="M864 473 C869 445 909 439 927 464 C914 470 906 478 902 489 C888 478 876 481 864 473Z" fill="#2e3139"/>
    <circle cx="901" cy="478" r="2.8" fill="#302a2b" stroke="none"/>
    <path d="M892 492 Q902 498 911 491" fill="none" stroke="#844445" stroke-width="3"/>
    <path d="M921 523 L965 544 L995 572" fill="none" stroke="#a86a4e" stroke-width="17"/>
    <rect x="984" y="556" width="72" height="28" rx="14" fill="#6687a7" stroke="#415d78" stroke-width="4" transform="rotate(14 1020 570)"/>
    <path d="M998 557 L992 583 M1041 563 L1034 588" stroke="#e3d28b" stroke-width="4"/>
  </g>

  <!-- Two children help with the picnic. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M540 510 C519 520 513 551 523 579 L535 611 L572 607 L575 565 L590 530Z" fill="#6aa77d" stroke="#4d8067" stroke-width="4"/>
    <path d="M536 605 L521 649 M565 604 L587 645" stroke="#c87a55" stroke-width="14"/>
    <path d="M515 648 L528 651 M581 644 L594 641" stroke="#68473e" stroke-width="12"/>
    <path d="M526 522 C526 501 554 493 570 510 C583 525 570 544 551 544 C532 545 519 536 526 522Z" fill="#c87a55" stroke="#68473e" stroke-width="3.5"/>
    <path d="M525 519 C530 495 562 493 575 511 C558 509 545 510 532 522Z" fill="#613e38"/>
    <circle cx="553" cy="523" r="2.4" fill="#33292b" stroke="none"/>
    <path d="M548 533 Q555 538 562 532" fill="none" stroke="#954a46" stroke-width="2.5"/>
    <path d="M574 552 L601 573 L613 592" fill="none" stroke="#c87a55" stroke-width="13"/>
    <path d="M608 587 L618 596" stroke="#68473e" stroke-width="10"/>
