<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A family picnic above the clouds</title>
  <desc id="desc">Two parents and two children prepare a picnic on a mustard tarp on soft clouds beside their landed hot air balloon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74c9e9"/>
      <stop offset="0.62" stop-color="#bce9ee"/>
      <stop offset="1" stop-color="#edf8ef"/>
    </linearGradient>
    <linearGradient id="balloon" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffcb4c"/>
      <stop offset="0.43" stop-color="#f36e4d"/>
      <stop offset="1" stop-color="#bc3f58"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef6"/>
      <stop offset="1" stop-color="#d9ecdf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-15%" y="-25%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="996" cy="123" r="55" fill="#fff3b2" opacity="0.92"/>
  <g fill="#fff" opacity="0.7" filter="url(#soft)">
    <ellipse cx="145" cy="174" rx="101" ry="22"/>
    <ellipse cx="228" cy="162" rx="74" ry="30"/>
    <ellipse cx="622" cy="125" rx="122" ry="21"/>
    <ellipse cx="720" cy="114" rx="85" ry="26"/>
  </g>

  <!-- Distant cloud layers establish the floating landscape. -->
  <g fill="#d4e9e5" opacity="0.75">
    <ellipse cx="88" cy="568" rx="150" ry="49"/>
    <ellipse cx="260" cy="574" rx="162" ry="54"/>
    <ellipse cx="789" cy="549" rx="190" ry="56"/>
    <ellipse cx="1053" cy="567" rx="194" ry="61"/>
  </g>
  <g fill="url(#cloud)">
    <ellipse cx="28" cy="690" rx="140" ry="92"/>
    <ellipse cx="161" cy="650" rx="124" ry="110"/>
    <ellipse cx="320" cy="676" rx="176" ry="112"/>
    <ellipse cx="478" cy="643" rx="156" ry="107"/>
    <ellipse cx="668" cy="682" rx="183" ry="117"/>
    <ellipse cx="861" cy="655" rx="159" ry="107"/>
    <ellipse cx="1045" cy="675" rx="170" ry="113"/>
    <ellipse cx="1200" cy="636" rx="132" ry="101"/>
    <rect y="684" width="1200" height="116" fill="#e4f1e8"/>
  </g>
  <g fill="#c9e1d7" opacity="0.72">
    <ellipse cx="149" cy="731" rx="101" ry="26"/>
    <ellipse cx="453" cy="740" rx="137" ry="31"/>
    <ellipse cx="797" cy="727" rx="112" ry="25"/>
    <ellipse cx="1089" cy="742" rx="128" ry="30"/>
  </g>

