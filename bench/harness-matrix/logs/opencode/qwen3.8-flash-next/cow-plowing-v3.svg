<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <title>A draft cow pulling a walking plow, with farmer</title>
  <desc>A muscular draft cow with solid tapered limbs and a broad-headed bovine face pulls a walking plow with a shining moldboard across a field whose furrows converge gently to the far left; the farmer leans into the handles on a fresh strip of turned clods trailing to the lower right.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8ea"/>
      <stop offset="1" stop-color="#eaf5fb"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98d5e"/>
      <stop offset="0.45" stop-color="#8a5a33"/>
      <stop offset="1" stop-color="#63401f"/>
    </linearGradient>
    <linearGradient id="tilth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c28c50"/>
      <stop offset="1" stop-color="#8f5f33"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccd2d9"/>
      <stop offset="1" stop-color="#7e858e"/>
    </linearGradient>
    <clipPath id="stripClip">
      <path d="M496,502 L800,552 L800,600 L556,600 C530,560 508,528 496,502 Z"/>
    </clipPath>
    <clipPath id="headClip">
      <path d="M214,360 C192,366 172,376 158,386 C146,392 132,396 124,402 C117,408 116,420 122,428 C128,436 140,442 154,442 C178,440 202,430 216,414 C224,404 226,392 224,378 C223,368 220,360 214,360 Z"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="600" fill="#eaf5fb"/>
  <rect x="0" y="0" width="800" height="274" fill="url(#sky)"/>
  <circle cx="98" cy="86" r="54" fill="#ffdf6b" opacity="0.3"/>
  <circle cx="98" cy="86" r="34" fill="#ffdf6b" stroke="#f4c542" stroke-width="2"/>
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="554" cy="76" rx="28" ry="13"/>
    <ellipse cx="580" cy="64" rx="42" ry="16"/>
    <ellipse cx="608" cy="76" rx="30" ry="13"/>
    <ellipse cx="312" cy="102" rx="20" ry="9"/>
    <ellipse cx="334" cy="94" rx="29" ry="11"/>
    <ellipse cx="356" cy="102" rx="20" ry="9"/>
  </g>
  <path d="M430,96 q8,-8 16,0 q8,-8 16,0 M492,124 q6,-6 12,0 q6,-6 12,0" fill="none" stroke="#4a4a4a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- distant hills, barn, trees -->
  <path d="M0,248 Q140,200 300,244 Q450,272 620,240 Q720,224 800,246 L800,278 L0,278 Z" fill="#9dbb85"/>
  <path d="M0,262 Q200,238 420,260 Q620,278 800,254 L800,280 L0,280 Z" fill="#6f9463"/>
  <g>
    <rect x="672" y="228" width="52" height="32" fill="#a5432e"/>
    <path d="M664,230 L698,206 L732,230 Z" fill="#5a3a2e"/>
    <rect x="690" y="242" width="14" height="18" fill="#3d2b22"/>
    <rect x="66" y="232" width="6" height="28" fill="#5f4630"/>
    <circle cx="69" cy="226" r="16" fill="#4f7a44"/>
    <rect x="104" y="242" width="5" height="20" fill="#5f4630"/>
    <circle cx="106" cy="236" r="12" fill="#59844d"/>
    <rect x="762" y="238" width="5" height="24" fill="#5f4630"/>
    <circle cx="764" cy="232" r="14" fill="#4f7a44"/>
  </g>

  <!-- field base -->
  <rect x="0" y="272" width="800" height="328" fill="url(#field)"/>

  <!-- furrows: nearly horizontal, converging gently to a vanishing point far left beyond the horizon -->
  <g fill="none" stroke="#6d4526" stroke-linecap="round">
    <path d="M0,282 L800,292" stroke-width="1.2"/>
    <path d="M0,291 L800,306" stroke-width="1.6"/>
    <path d="M0,302 L800,322" stroke-width="2"/>
    <path d="M0,315 L800,342" stroke-width="2.4"/>
    <path d="M0,330 L800,366" stroke-width="2.8"/>
    <path d="M0,348 L800,396" stroke-width="3.4"/>
    <path d="M0,369 L800,434" stroke-width="4"/>
    <path d="M0,395 L800,482" stroke-width="4.8"/>
    <path d="M0,426 L800,540" stroke-width="5.6"/>
    <path d="M0,468 L620,600" stroke-width="6.5"/>
    <path d="M0,528 L250,600" stroke-width="7.5"/>
  </g>
  <g fill="none" stroke="#c39a67" stroke-width="1.4" opacity="0.35">
