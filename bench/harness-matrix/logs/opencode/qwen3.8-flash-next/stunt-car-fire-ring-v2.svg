<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Stunt car leaping through a flaming hoop between launch and landing ramps under spotlights at night">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a1c"/>
      <stop offset="0.62" stop-color="#1d1438"/>
      <stop offset="1" stop-color="#41213a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26263e"/>
      <stop offset="1" stop-color="#0e0e1c"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454560"/>
      <stop offset="1" stop-color="#1c1c32"/>
    </linearGradient>
    <linearGradient id="ringFire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe470"/>
      <stop offset="0.5" stop-color="#ff8c1a"/>
      <stop offset="1" stop-color="#e03a00"/>
    </linearGradient>
    <linearGradient id="flameO" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffdf6b"/>
      <stop offset="0.45" stop-color="#ff8f1f"/>
      <stop offset="1" stop-color="#ff4400" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.55" stop-color="#b81a2a"/>
      <stop offset="1" stop-color="#5f0a16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf8ff"/>
      <stop offset="1" stop-color="#8ec4ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff5a00" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <path id="tongue" d="M -10 8 C -18 -4 -15 -20 -3 -42 C -6 -22 5 -15 9 2 C 5 9 -3 12 -10 8 Z" fill="url(#flameO)"/>
    <path id="tongueCore" d="M -5 7 C -9 -2 -8 -12 -2 -26 C -3 -13 3 -9 5 2 C 2 7 -2 9 -5 7 Z" fill="#ffd76a" opacity="0.9"/>
    <g id="tonguePair">
      <use href="#tongue"/>
      <use href="#tongueCore"/>
    </g>
