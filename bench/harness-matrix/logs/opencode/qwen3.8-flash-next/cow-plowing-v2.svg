  <path d="M606,450 L592,488 L584,524" fill="none" stroke="#33415c" stroke-width="12" stroke-linecap="round"/>
  <rect x="572" y="522" width="20" height="9" rx="4" fill="#2b2b2b"/>
  <path d="M601,378 L590,388" stroke="#3f5c8a" stroke-width="8" stroke-linecap="round"/>
  <path d="M586,366 L606,366 L621,452 L598,452 Z" fill="#46648f" stroke="#2b3850" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M600,376 L587,380" stroke="#4a6ea3" stroke-width="8" stroke-linecap="round"/>
  <path d="M604,378 L599,386" stroke="#4a6ea3" stroke-width="8" stroke-linecap="round"/>
  <circle cx="598" cy="350" r="13" fill="#cf9a6b" stroke="#8a6136" stroke-width="2"/>
  <path d="M586,351 l-4,3 5,2 Z" fill="#cf9a6b" stroke="#8a6136" stroke-width="1.5"/>
  <circle cx="590" cy="349" r="1.8" fill="#2b2b2b"/>
  <ellipse cx="598" cy="341" rx="21" ry="6" fill="#d9b64e" stroke="#a2812f" stroke-width="2"/>
  <path d="M587,341 Q587,322 598,322 Q609,322 609,341 Z" fill="#e7c766" stroke="#a2812f" stroke-width="2"/>
  <circle cx="586" cy="379" r="5" fill="#cf9a6b" stroke="#8a6136" stroke-width="1.5"/>
  <circle cx="598" cy="386" r="5" fill="#cf9a6b" stroke="#8a6136" stroke-width="1.5"/>
</svg>
