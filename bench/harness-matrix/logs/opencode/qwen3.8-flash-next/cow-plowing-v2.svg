  <g fill="none" stroke="#6d4526" stroke-linecap="round">
    <path d="M140,276 L800,300" stroke-width="1.5"/>
    <path d="M140,276 L800,312" stroke-width="2"/>
    <path d="M140,276 L800,328" stroke-width="2"/>
    <path d="M140,276 L800,348" stroke-width="2.5"/>
    <path d="M140,276 L800,374" stroke-width="3"/>
    <path d="M140,276 L800,404" stroke-width="3.5"/>
    <path d="M140,276 L800,436" stroke-width="4"/>
    <path d="M140,276 L800,470" stroke-width="4.5"/>
    <path d="M140,276 L800,504" stroke-width="5"/>
    <path d="M140,276 L800,540" stroke-width="5.5"/>
    <path d="M140,276 L60,600" stroke-width="6"/>
    <path d="M140,276 L340,600" stroke-width="6.5"/>
    <path d="M140,276 L440,600" stroke-width="7"/>
    <path d="M140,276 L540,600" stroke-width="7.5"/>
  </g>
