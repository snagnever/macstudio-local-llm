    <path d="M334,390 L342,428 L344,452" stroke="#2b2b2b" stroke-width="17"/>
    <path d="M334,390 L342,428 L344,452" stroke="#cfc9bd" stroke-width="10"/>
    <path d="M400,388 L394,426 L388,452" stroke="#2b2b2b" stroke-width="17"/>
    <path d="M400,388 L394,426 L388,452" stroke="#cfc9bd" stroke-width="10"/>
  </g>
  <rect x="336" y="450" width="17" height="11" rx="3" fill="#2b2b2b"/>
  <rect x="379" y="450" width="17" height="11" rx="3" fill="#2b2b2b"/>

  <!-- tail and udder behind body -->
  <path d="M438,344 C452,362 456,382 454,400" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
  <path d="M454,398 c-6,9 -4,17 2,22 c7,-6 8,-15 3,-23 Z" fill="#2b2b2b"/>
  <ellipse cx="404" cy="413" rx="9" ry="7" fill="#d9a0a8" stroke="#a5757c" stroke-width="1.5"/>

  <!-- head far horn (behind head) -->
  <path d="M276,314 C272,301 267,294 260,292 C266,299 269,305 270,314 Z" fill="#d6c8a8" stroke="#2b2b2b" stroke-width="2"/>

  <!-- cow body: deep chest, withers, muscular shoulders and haunch, lowered working neck -->
  <path d="M300,332 C330,316 376,316 416,332 C432,340 442,352 442,368 C442,390 432,406 420,412 L408,412 C388,424 352,426 330,416 C312,408 300,396 294,380 C284,362 276,346 278,330 L292,326 Z" fill="#f6f1e6" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M302,336 Q290,362 300,390" fill="none" stroke="#d8d2c6" stroke-width="5" stroke-linecap="round"/>
  <path d="M428,344 Q436,372 424,404" fill="none" stroke="#d8d2c6" stroke-width="5" stroke-linecap="round"/>
  <path d="M318,328 Q340,324 350,338 Q354,356 338,364 Q320,362 316,346 Z" fill="#33302e"/>
  <path d="M382,328 Q406,324 414,340 Q416,356 400,358 Q382,354 378,340 Z" fill="#33302e"/>
  <circle cx="356" cy="404" r="8" fill="#33302e"/>

  <!-- head: side profile with muzzle, eye, ear, small horns -->
  <path d="M276,320 L300,310 Q309,312 304,321 L282,329 Z" fill="#f6f1e6" stroke="#2b2b2b" stroke-width="2.5"/>
  <path d="M284,317 L298,314" fill="none" stroke="#b98d84" stroke-width="3" stroke-linecap="round"/>
  <path d="M276,316 C258,306 240,318 228,334 C222,342 221,352 230,356 C240,362 252,362 262,356 C274,350 282,340 284,328 C284,320 282,316 276,316 Z" fill="#f6f1e6" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M266,314 C260,298 252,292 244,292 C252,300 256,306 258,314 Z" fill="#e8dcc0" stroke="#2b2b2b" stroke-width="2"/>
  <ellipse cx="231" cy="347" rx="12" ry="10" fill="#e6cbc4" stroke="#2b2b2b" stroke-width="2"/>
  <ellipse cx="226" cy="344" rx="3" ry="2.6" fill="#2b2b2b"/>
  <path d="M224,353 Q230,356 236,354" fill="none" stroke="#8a6156" stroke-width="2" stroke-linecap="round"/>
  <circle cx="252" cy="330" r="3.6" fill="#2b2b2b"/>
  <circle cx="253.2" cy="328.8" r="1.1" fill="#ffffff"/>

  <!-- headstall and bit -->
  <path d="M262,312 L270,322" fill="none" stroke="#4a3018" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M270,322 L240,348" fill="none" stroke="#4a3018" stroke-width="3" stroke-linecap="round"/>
  <circle cx="236" cy="347" r="4" fill="none" stroke="#4a3018" stroke-width="2.5"/>

  <!-- near legs: foreleg striding forward, hind leg pushing off -->
  <g stroke-linecap="round" fill="none">
    <path d="M318,388 L296,428 L290,454" stroke="#2b2b2b" stroke-width="18"/>
    <path d="M318,388 L296,428 L290,454" stroke="#f6f1e6" stroke-width="11"/>
    <path d="M420,392 L436,432 L446,456" stroke="#2b2b2b" stroke-width="18"/>
    <path d="M420,392 L436,432 L446,456" stroke="#f6f1e6" stroke-width="11"/>
  </g>
  <rect x="281" y="454" width="18" height="11" rx="3" fill="#2b2b2b"/>
  <rect x="438" y="455" width="18" height="11" rx="3" fill="#2b2b2b"/>

  <!-- collar and hames on the neck, hook at the chest -->
  <path d="M300,332 C284,350 285,370 298,383" fill="none" stroke="#6b4423" stroke-width="8" stroke-linecap="round"/>
  <path d="M300,334 C287,351 288,368 298,381" fill="none" stroke="#9a6a3a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="384" r="4" fill="#38230f"/>

  <!-- near trace: from collar hook, sagging under the belly, ending on the plow beam -->
  <path d="M302,386 Q362,446 438,452" fill="none" stroke="#4a3018" stroke-width="5" stroke-linecap="round"/>
  <path d="M356,418 L357,431" stroke="#4a3018" stroke-width="4" stroke-linecap="round"/>

  <!-- rein: bit ring to farmer's hand -->
  <path d="M240,344 Q400,312 584,376" fill="none" stroke="#4a3018" stroke-width="2.5"/>

  <!-- walking plow: beam along the ground line, moldboard cutting soil -->
  <circle cx="438" cy="451" r="5" fill="none" stroke="#38230f" stroke-width="3"/>
  <path d="M438,451 L502,461" stroke="#5a3a1e" stroke-width="9" stroke-linecap="round"/>
  <path d="M440,450 L500,459" stroke="#9a6a3a" stroke-width="3" stroke-linecap="round"/>
  <path d="M500,459 L505,471" stroke="#3c4048" stroke-width="7" stroke-linecap="round"/>
  <path d="M498,468 C502,452 512,442 526,440 C536,442 539,452 534,462 C528,471 512,472 498,468 Z" fill="#9aa0a8" stroke="#3c4048" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M503,458 C509,449 517,445 525,445" fill="none" stroke="#cfd4da" stroke-width="2.5" stroke-linecap="round"/>
  <!-- handles rising up-and-back to the farmer's hands -->
