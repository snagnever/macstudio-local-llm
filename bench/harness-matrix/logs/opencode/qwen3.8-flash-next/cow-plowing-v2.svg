<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <title>A draft cow pulling a walking plow, with farmer</title>
  <desc>A muscular draft cow in a harnessed collar pulls a walking plow across a field of perspective furrows converging to the horizon; a farmer walks behind with hands on the plow handles, fresh tilth trailing from the moldboard.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8ea"/>
      <stop offset="1" stop-color="#eaf5fb"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98d5e"/>
      <stop offset="0.45" stop-color="#8a5a33"/>
      <stop offset="1" stop-color="#63401f"/>
    </linearGradient>
    <linearGradient id="tilth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bd8950"/>
      <stop offset="1" stop-color="#936136"/>
    </linearGradient>
    <clipPath id="stripClip">
      <path d="M498,467 L750,600 L665,600 L498,497 Z"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="600" fill="#eaf5fb"/>
  <rect x="0" y="0" width="800" height="272" fill="url(#sky)"/>
  <circle cx="98" cy="86" r="54" fill="#ffdf6b" opacity="0.3"/>
  <circle cx="98" cy="86" r="34" fill="#ffdf6b" stroke="#f4c542" stroke-width="2"/>
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="554" cy="76" rx="28" ry="13"/>
    <ellipse cx="580" cy="64" rx="42" ry="16"/>
    <ellipse cx="608" cy="76" rx="30" ry="13"/>
    <ellipse cx="312" cy="102" rx="20" ry="9"/>
    <ellipse cx="334" cy="94" rx="29" ry="11"/>
    <ellipse cx="356" cy="102" rx="20" ry="9"/>
  </g>
  <path d="M430,96 q8,-8 16,0 q8,-8 16,0 M492,124 q6,-6 12,0 q6,-6 12,0" fill="none" stroke="#4a4a4a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- distant hills, barn, trees -->
  <path d="M0,248 Q140,200 300,244 Q450,272 620,240 Q720,224 800,246 L800,276 L0,276 Z" fill="#9dbb85"/>
  <path d="M0,262 Q200,238 420,260 Q620,278 800,254 L800,278 L0,278 Z" fill="#6f9463"/>
  <g>
    <rect x="672" y="228" width="52" height="32" fill="#a5432e"/>
    <path d="M664,230 L698,206 L732,230 Z" fill="#5a3a2e"/>
    <rect x="690" y="242" width="14" height="18" fill="#3d2b22"/>
    <rect x="66" y="232" width="6" height="28" fill="#5f4630"/>
