    <path d="M650,375 v-6"/>
    <path d="M560,421 v-7"/>
    <path d="M660,455 v-7"/>
    <path d="M700,440 v-7"/>
    <path d="M760,458 v-8"/>
    <path d="M520,428 v-6"/>
    <path d="M300,434 v-8"/>
  </g>

  <!-- fresh plowed strip: upper edge passes exactly through the blade share point (498,467) -->
  <path d="M498,467 L750,600 L665,600 L498,497 Z" fill="url(#tilth)"/>
  <g clip-path="url(#stripClip)" fill="none">
    <path d="M140,276 L800,520" stroke="#754a24" stroke-width="2" opacity="0.8"/>
    <path d="M144,281 L800,514" stroke="#c89258" stroke-width="1.5" opacity="0.55"/>
    <path d="M140,276 L800,552" stroke="#754a24" stroke-width="2.5" opacity="0.8"/>
    <path d="M144,281 L800,545" stroke="#c89258" stroke-width="1.5" opacity="0.55"/>
    <path d="M140,276 L780,600" stroke="#754a24" stroke-width="3" opacity="0.8"/>
    <path d="M144,281 L774,600" stroke="#c89258" stroke-width="1.5" opacity="0.55"/>
    <path d="M140,276 L700,600" stroke="#754a24" stroke-width="2.5" opacity="0.7"/>
    <path d="M140,276 L640,600" stroke="#754a24" stroke-width="2" opacity="0.7"/>
    <path d="M140,276 L590,600" stroke="#754a24" stroke-width="1.5" opacity="0.6"/>
  </g>
  <path d="M498,467 L750,600" fill="none" stroke="#4a2d12" stroke-width="3.5" stroke-linecap="round"/>
