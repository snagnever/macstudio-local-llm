    <rect x="762" y="238" width="5" height="24" fill="#5f4630"/>
    <circle cx="764" cy="232" r="14" fill="#4f7a44"/>
  </g>

  <!-- field base -->
  <rect x="0" y="270" width="800" height="330" fill="url(#field)"/>

