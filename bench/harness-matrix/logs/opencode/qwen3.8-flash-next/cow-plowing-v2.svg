    <ellipse cx="524" cy="476" rx="26" ry="6" opacity="0.16"/>
    <ellipse cx="612" cy="537" rx="30" ry="7" opacity="0.16"/>
    <ellipse cx="294" cy="466" rx="11" ry="4" opacity="0.18"/>
    <ellipse cx="350" cy="463" rx="11" ry="4" opacity="0.18"/>
    <ellipse cx="394" cy="463" rx="11" ry="4" opacity="0.18"/>
