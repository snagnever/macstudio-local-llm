<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Stunt car leaping through a flaming ring between two ramps at night">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1e"/>
      <stop offset="0.6" stop-color="#1c1436"/>
      <stop offset="1" stop-color="#3a1d33"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23233a"/>
      <stop offset="1" stop-color="#101020"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a66"/>
      <stop offset="1" stop-color="#20203a"/>
    </linearGradient>
    <linearGradient id="ringFire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.5" stop-color="#ff8c1a"/>
      <stop offset="1" stop-color="#e03a00"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffdf6b"/>
      <stop offset="0.45" stop-color="#ff8f1f"/>
      <stop offset="1" stop-color="#ff4400" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5d5d"/>
      <stop offset="0.5" stop-color="#c81e2c"/>
      <stop offset="1" stop-color="#7a0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff5a00" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <path id="tongue" d="M -8 6 Q -14 -12 0 -36 Q 13 -14 7 6 Q 0 10 -8 6 Z" fill="url(#flame)"/>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="60" cy="60" r="1.4" opacity="0.8"/>
    <circle cx="140" cy="110" r="1" opacity="0.5"/>
    <circle cx="220" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="310" cy="90" r="1" opacity="0.4"/>
    <circle cx="520" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="610" cy="120" r="1" opacity="0.5"/>
    <circle cx="90" cy="180" r="1" opacity="0.5"/>
  </g>
  <circle cx="705" cy="85" r="40" fill="#e8e6f0" opacity="0.12"/>
  <circle cx="705" cy="85" r="26" fill="#e8e6f0" opacity="0.9"/>

  <polygon points="120,500 300,60 360,70 180,500" fill="#ffffff" opacity="0.05"/>
  <polygon points="680,500 500,60 440,70 620,500" fill="#ffffff" opacity="0.05"/>

  <rect y="440" width="800" height="60" fill="url(#ground)"/>
  <ellipse cx="400" cy="448" rx="210" ry="18" fill="#ff7a1a" opacity="0.28" filter="url(#softer)"/>

  <circle cx="400" cy="240" r="235" fill="url(#glow)"/>
  <circle cx="400" cy="240" r="130" fill="url(#glow)" opacity="0.5"/>

  <path d="M 262 372 Q 400 130 538 372" fill="none" stroke="#ffb066" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round" opacity="0.35"/>

  <path d="M 30 440 L 262 372 L 262 440 Z" fill="url(#ramp)"/>
  <path d="M 30 440 L 262 372" stroke="#7a7aa0" stroke-width="3" opacity="0.7"/>
  <path d="M 538 372 L 770 440 L 538 440 Z" fill="url(#ramp)"/>
  <path d="M 538 372 L 770 440" stroke="#7a7aa0" stroke-width="3" opacity="0.7"/>
  <g fill="#9aa0c0">
    <circle cx="120" cy="434" r="16" opacity="0.15"/>
    <circle cx="150" cy="428" r="11" opacity="0.12"/>
    <circle cx="95" cy="437" r="10" opacity="0.1"/>
  </g>

  <path d="M 400 398 L 372 440 L 384 440 L 400 412 L 416 440 L 428 440 Z" fill="#26264a"/>
  <circle cx="400" cy="240" r="150" fill="none" stroke="#ff2d00" stroke-width="40" opacity="0.45" filter="url(#soft)"/>
  <circle cx="400" cy="240" r="150" fill="none" stroke="url(#ringFire)" stroke-width="22"/>
  <circle cx="400" cy="240" r="150" fill="none" stroke="#fff1b8" stroke-width="7" opacity="0.75"/>

  <g>
    <use href="#tongue" transform="rotate(0 400 240) translate(400 86)"/>
    <use href="#tongue" transform="rotate(30 400 240) translate(400 86)"/>
    <use href="#tongue" transform="rotate(60 400 240) translate(400 86)"/>
    <use href="#tongue" transform="rotate(90 400 240) translate(400 86)"/>
    <use href="#tongue" transform="rotate(120 400 240) translate(400 86)"/>
    <use href="#tongue" transform="rotate(150 400 240) translate(400 86)"/>
    <use href="#tongue" transform="rotate(180 400 240) translate(400 86)"/>
    <use href="#tongue" transform="rotate(210 400 240) translate(400 86)"/>
    <use href="#tongue" transform="rotate(240 400 240) translate(400 86)"/>
    <use href="#tongue" transform="rotate(270 400 240) translate(400 86)"/>
    <use href="#tongue" transform="rotate(300 400 240) translate(400 86)"/>
    <use href="#tongue" transform="rotate(330 400 240) translate(400 86)"/>
  </g>
  <g opacity="0.85">
    <use href="#tongue" transform="rotate(15 400 240) translate(400 92) scale(0.62)"/>
    <use href="#tongue" transform="rotate(45 400 240) translate(400 92) scale(0.62)"/>
    <use href="#tongue" transform="rotate(75 400 240) translate(400 92) scale(0.62)"/>
    <use href="#tongue" transform="rotate(105 400 240) translate(400 92) scale(0.62)"/>
    <use href="#tongue" transform="rotate(135 400 240) translate(400 92) scale(0.62)"/>
    <use href="#tongue" transform="rotate(165 400 240) translate(400 92) scale(0.62)"/>
    <use href="#tongue" transform="rotate(195 400 240) translate(400 92) scale(0.62)"/>
    <use href="#tongue" transform="rotate(225 400 240) translate(400 92) scale(0.62)"/>
    <use href="#tongue" transform="rotate(255 400 240) translate(400 92) scale(0.62)"/>
    <use href="#tongue" transform="rotate(285 400 240) translate(400 92) scale(0.62)"/>
    <use href="#tongue" transform="rotate(315 400 240) translate(400 92) scale(0.62)"/>
    <use href="#tongue" transform="rotate(345 400 240) translate(400 92) scale(0.62)"/>
  </g>

  <g stroke="#ffd98f" stroke-linecap="round" opacity="0.7">
    <path d="M 272 226 L 322 222" stroke-width="4"/>
    <path d="M 264 252 L 330 248" stroke-width="5"/>
    <path d="M 276 278 L 326 276" stroke-width="4"/>
  </g>

  <g transform="translate(398 250) rotate(-12)">
    <path d="M 76 0 L 128 -16 L 132 18 L 76 10 Z" fill="#ffe9a0" opacity="0.18"/>
    <path d="M -70 8 Q -96 10 -116 2 Q -94 16 -70 16 Z" fill="url(#flame)" opacity="0.9"/>
    <rect x="-80" y="-14" width="22" height="6" rx="2" fill="#8a1220"/>
    <path d="M -70 14 L -70 2 C -70 -4 -64 -8 -56 -9 L -30 -12 C -20 -26 -2 -30 10 -28 C 24 -26 34 -18 40 -10 L 58 -6 C 68 -4 74 2 74 10 L 74 16 C 74 20 70 22 64 22 L -64 22 C -68 22 -70 18 -70 14 Z" fill="url(#carBody)"/>
    <path d="M -26 -12 C -17 -24 -2 -27 9 -25 C 19 -23 27 -17 32 -11 Z" fill="#9fd8ff" opacity="0.9"/>
    <path d="M 66 -2 L 74 2 L 74 8 L 64 6 Z" fill="#fff3b0"/>
    <rect x="-71" y="0" width="5" height="7" rx="2" fill="#ff4444"/>
    <path d="M -64 22 L 62 22" stroke="#ff9a3c" stroke-width="3" opacity="0.5"/>
    <g>
      <circle cx="-42" cy="20" r="15" fill="#0d0d12" stroke="#3a3a48" stroke-width="3"/>
      <circle cx="-42" cy="20" r="6" fill="#b9bec9"/>
      <circle cx="46" cy="20" r="15" fill="#0d0d12" stroke="#3a3a48" stroke-width="3"/>
      <circle cx="46" cy="20" r="6" fill="#b9bec9"/>
    </g>
  </g>

  <g fill="#ffb347">
    <circle cx="300" cy="150" r="3" opacity="0.8"/>
    <circle cx="470" cy="120" r="2.5" opacity="0.7"/>
    <circle cx="350" cy="110" r="2" opacity="0.6"/>
    <circle cx="520" cy="180" r="2.2" opacity="0.7"/>
    <circle cx="280" cy="320" r="2.6" opacity="0.6"/>
    <circle cx="540" cy="300" r="2" opacity="0.55"/>
    <circle cx="420" cy="80" r="2" opacity="0.7"/>
    <circle cx="250" cy="180" r="1.8" opacity="0.6"/>
    <circle cx="560" cy="150" r="2" opacity="0.7"/>
    <circle cx="600" cy="250" r="1.6" opacity="0.5"/>
    <circle cx="200" cy="260" r="1.8" opacity="0.5"/>
  </g>
</svg>
