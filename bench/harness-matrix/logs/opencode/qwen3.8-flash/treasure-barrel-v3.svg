<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74c4e6"/>
      <stop offset="0.65" stop-color="#ffeccd"/>
      <stop offset="1" stop-color="#ffdfa8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7cf" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffe9a3" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sandBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4dcab"/>
      <stop offset="1" stop-color="#e7c78c"/>
    </linearGradient>
    <linearGradient id="sandMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eecf96"/>
      <stop offset="1" stop-color="#dcb674"/>
    </linearGradient>
    <linearGradient id="sandFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9cb8d"/>
      <stop offset="1" stop-color="#cda45c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2a10"/>
      <stop offset="0.18" stop-color="#7c4e24"/>
      <stop offset="0.45" stop-color="#9a6530"/>
      <stop offset="0.72" stop-color="#7c4e24"/>
      <stop offset="0.92" stop-color="#5a3516"/>
      <stop offset="1" stop-color="#3c2109"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98e"/>
      <stop offset="1" stop-color="#d89a1e"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M-100,-150 C-122,-66 -122,66 -100,150 L100,150 C122,66 122,-66 100,-150 Z"/>
    </clipPath>
    <clipPath id="pileClip">
      <ellipse cx="0" cy="-150" rx="94" ry="40"/>
    </clipPath>
    <radialGradient id="shadowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a5a2e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7a5a2e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="665" cy="105" r="95" fill="url(#halo)">
    <animate attributeName="r" values="95;105;95" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="665" cy="105" r="38" fill="#ffd964">
    <animate attributeName="opacity" values="1;0.82;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g fill="#ffffff" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" values="0,0; 28,0; 0,0" dur="26s" repeatCount="indefinite"/>
    <ellipse cx="160" cy="95" rx="52" ry="16"/>
    <ellipse cx="205" cy="82" rx="34" ry="13"/>
  </g>

  <!-- distant dunes -->
  <path d="M-5,345 Q180,315 400,338 Q620,360 805,330 L805,605 L-5,605 Z" fill="url(#sandBack)"/>
  <path d="M-5,380 Q220,352 460,375 Q640,392 805,370 L805,605 L-5,605 Z" fill="url(#sandMid)"/>

  <!-- leaning barrel, half sunk into the dune -->
  <g transform="translate(490,340) rotate(-18)">
    <!-- body -->
    <path d="M-100,-150 C-122,-66 -122,66 -100,150 L100,150 C122,66 122,-66 100,-150 Z"
          fill="url(#wood)" stroke="#331b06" stroke-width="3"/>
    <g clip-path="url(#bodyClip)">
      <!-- plank tone variation -->
      <rect x="-70" y="-152" width="35" height="304" fill="#ffffff" opacity="0.05"/>
      <rect x="0" y="-152" width="35" height="304" fill="#ffffff" opacity="0.07"/>
      <rect x="70" y="-152" width="35" height="304" fill="#000000" opacity="0.10"/>
      <!-- wood grain -->
      <g stroke="#2b1804" stroke-width="1.5" fill="none" opacity="0.25">
        <path d="M-86,-130 C-92,-60 -92,60 -86,130"/>
        <path d="M-52,-138 C-57,-50 -57,50 -52,138"/>
        <path d="M-18,-142 C-21,-50 -21,50 -18,142"/>
        <path d="M18,-142 C21,-50 21,50 18,142"/>
        <path d="M52,-138 C57,-50 57,50 52,138"/>
        <path d="M86,-130 C92,-60 92,60 86,130"/>
      </g>
      <!-- stave seams -->
      <g stroke="#2b1804" stroke-width="2" opacity="0.6" fill="none">
        <path d="M-70,-150 C-78,-60 -78,60 -70,150"/>
        <path d="M-35,-150 C-40,-60 -40,60 -35,150"/>
        <path d="M0,-150 L0,150"/>
        <path d="M35,-150 C40,-60 40,60 35,150"/>
        <path d="M70,-150 C78,-60 78,60 70,150"/>
      </g>
      <!-- iron bands -->
      <g fill="none">
        <path d="M-124,-100 Q0,-76 124,-100" stroke="#3d3d46" stroke-width="17"/>
        <path d="M-124,-35 Q0,-11 124,-35" stroke="#3d3d46" stroke-width="17"/>
        <path d="M-124,55 Q0,79 124,55" stroke="#3d3d46" stroke-width="17"/>
        <path d="M-124,-105 Q0,-81 124,-105" stroke="#70707d" stroke-width="3" opacity="0.8"/>
        <path d="M-124,-40 Q0,-16 124,-40" stroke="#70707d" stroke-width="3" opacity="0.8"/>
        <path d="M-124,50 Q0,74 124,50" stroke="#70707d" stroke-width="3" opacity="0.8"/>
        <path d="M-124,-92 Q0,-68 124,-92" stroke="#16161c" stroke-width="4" opacity="0.55"/>
        <path d="M-124,-27 Q0,-3 124,-27" stroke="#16161c" stroke-width="4" opacity="0.55"/>
        <path d="M-124,63 Q0,87 124,63" stroke="#16161c" stroke-width="4" opacity="0.55"/>
      </g>
      <!-- rivets -->
      <g fill="#141419">
        <circle cx="-59" cy="-91" r="3.2"/><circle cx="0" cy="-88" r="3.2"/><circle cx="59" cy="-91" r="3.2"/>
        <circle cx="-59" cy="-26" r="3.2"/><circle cx="0" cy="-23" r="3.2"/><circle cx="59" cy="-26" r="3.2"/>
        <circle cx="-59" cy="64" r="3.2"/><circle cx="0" cy="67" r="3.2"/><circle cx="59" cy="64" r="3.2"/>
      </g>
    </g>

    <!-- rim and treasure -->
    <ellipse cx="0" cy="-150" rx="100" ry="26" fill="#201102" stroke="#4a2a10" stroke-width="9"/>
    <g stroke="#96670f" stroke-width="1.6" clip-path="url(#pileClip)">
      <ellipse cx="-70" cy="-150" rx="14" ry="6" fill="#eab02e"/>
      <ellipse cx="-40" cy="-151" rx="14" ry="6" fill="#f6c548"/>
      <ellipse cx="-10" cy="-152" rx="14" ry="6" fill="#eab02e"/>
      <ellipse cx="20" cy="-151" rx="14" ry="6" fill="#f6c548"/>
      <ellipse cx="50" cy="-150" rx="14" ry="6" fill="#eab02e"/>
      <ellipse cx="78" cy="-149" rx="13" ry="5.5" fill="#f6c548"/>
      <ellipse cx="-55" cy="-158" rx="14" ry="6" fill="#ffe27a"/>
      <ellipse cx="-22" cy="-159" rx="14" ry="6" fill="#f6c548"/>
      <ellipse cx="10" cy="-160" rx="14" ry="6" fill="#ffe27a"/>
      <ellipse cx="42" cy="-158" rx="14" ry="6" fill="#eab02e"/>
      <ellipse cx="68" cy="-157" rx="13" ry="5.5" fill="#ffe27a"/>
      <ellipse cx="-38" cy="-166" rx="14" ry="6" fill="#f6c548"/>
      <ellipse cx="-8" cy="-167" rx="14" ry="6" fill="#ffe98e"/>
      <ellipse cx="22" cy="-166" rx="14" ry="6" fill="#f6c548"/>
      <ellipse cx="50" cy="-164" rx="13" ry="5.5" fill="#ffe27a"/>
      <ellipse cx="-22" cy="-173" rx="14" ry="6" fill="#ffe98e"/>
      <ellipse cx="8" cy="-174" rx="14" ry="6" fill="#ffe27a"/>
      <ellipse cx="34" cy="-172" rx="13" ry="5.5" fill="#f6c548"/>
      <ellipse cx="-80" cy="-142" rx="15" ry="6.5" fill="#eab02e"/>
      <ellipse cx="-48" cy="-143" rx="15" ry="6.5" fill="#ffe27a"/>
      <ellipse cx="-14" cy="-144" rx="15" ry="6.5" fill="#f6c548"/>
      <ellipse cx="20" cy="-143" rx="15" ry="6.5" fill="#ffe27a"/>
      <ellipse cx="50" cy="-142" rx="15" ry="6.5" fill="#eab02e"/>
      <ellipse cx="74" cy="-141" rx="14" ry="6" fill="#ffe27a"/>
    </g>
    <!-- front rim lip hides coin bottoms -->
    <path d="M-100,-150 A100,26 0 0,0 100,-150" fill="none" stroke="#4a2a10" stroke-width="9"/>
    <path d="M-96,-146 A96,22 0 0,0 96,-146" fill="none" stroke="#6b4222" stroke-width="2.5" opacity="0.8"/>
    <!-- rolling glint across the coin heap -->
    <ellipse cx="-40" cy="-160" rx="30" ry="8" fill="#fffbe8" opacity="0" transform="rotate(-5 -40 -160)">
      <animate attributeName="opacity" values="0;0.55;0" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="-30,4; 60,-6; -30,4" dur="4s" begin="1s" repeatCount="indefinite" additive="sum"/>
    </ellipse>
  </g>

  <!-- foreground dune, swallowing the lower half of the barrel -->
  <path d="M-5,470 Q200,428 385,406 Q500,362 613,331 Q710,308 805,318 L805,605 L-5,605 Z"
        fill="url(#sandFront)"/>
  <!-- sand piled against the hull, with sunlit lip -->
  <g fill="#e9cb8d">
    <ellipse cx="425" cy="402" rx="60" ry="16" transform="rotate(-18 425 402)"/>
    <ellipse cx="590" cy="338" rx="54" ry="14" transform="rotate(-18 590 338)"/>
  </g>
  <g fill="none" stroke="#f8e3a8" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="6s" repeatCount="indefinite"/>
    <path d="M398,399 Q424,387 455,391"/>
    <path d="M548,350 Q592,329 638,332"/>
  </g>

  <!-- cast shadow on the dune, away from the sun -->
  <ellipse cx="502" cy="484" rx="104" ry="20" fill="url(#shadowGrad)" transform="rotate(-10 502 484)"/>

  <!-- ripples and pebbles -->
  <g fill="none" stroke="#c29c60" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <path d="M585,428 Q650,418 720,426"/>
    <path d="M620,472 Q700,460 780,468"/>
    <path d="M50,540 Q200,518 370,532"/>
    <path d="M120,482 Q210,470 300,480"/>
  </g>
  <circle cx="648" cy="504" r="5" fill="#b59463"/>
  <circle cx="168" cy="512" r="4" fill="#b59463"/>
  <circle cx="716" cy="545" r="6" fill="#bd9c6b"/>

  <!-- spilled coins -->
  <g fill="#8f6a35" opacity="0.45">
    <ellipse cx="324" cy="443" rx="17" ry="5"/>
    <ellipse cx="284" cy="457" rx="17" ry="5"/>
    <ellipse cx="356" cy="460" rx="17" ry="5"/>
    <ellipse cx="240" cy="471" rx="17" ry="5"/>
    <ellipse cx="308" cy="477" rx="17" ry="5"/>
    <ellipse cx="380" cy="433" rx="17" ry="5"/>
  </g>
  <g stroke="#96670f" stroke-width="1.6">
    <ellipse cx="320" cy="438" rx="16" ry="6.5" fill="url(#gold)" transform="rotate(-14 320 438)"/>
    <ellipse cx="281" cy="451" rx="16" ry="6.5" fill="#f6c548" transform="rotate(8 281 451)"/>
    <ellipse cx="353" cy="454" rx="16" ry="6.5" fill="#ffe27a" transform="rotate(-6 353 454)"/>
    <ellipse cx="237" cy="465" rx="16" ry="6.5" fill="#f6c548" transform="rotate(15 237 465)"/>
    <ellipse cx="305" cy="471" rx="16" ry="6.5" fill="#eab02e" transform="rotate(3 305 471)"/>
    <ellipse cx="377" cy="427" rx="15" ry="6" fill="#ffe27a" transform="rotate(-24 377 427)"/>
    <ellipse cx="250" cy="452" rx="16" ry="6.5" fill="#ffe98e"/>
    <ellipse cx="251" cy="445" rx="16" ry="6.5" fill="#f6c548"/>
    <ellipse cx="252" cy="438" rx="16" ry="6.5" fill="#ffe27a"/>
  </g>
  <!-- gem -->
  <path d="M300,481 l11,-9 11,9 -11,12 Z" fill="#d8453c" stroke="#7e1f1a" stroke-width="1.5"/>
  <path d="M300,481 l22,0" stroke="#f2837b" stroke-width="1.5"/>

  <!-- sparkles -->
  <g fill="#fff6c9">
    <path d="M438,167 l2.2,5.3 5.3,2.2 -5.3,2.2 -2.2,5.3 -2.2,-5.3 -5.3,-2.2 5.3,-2.2 Z">
      <animate attributeName="opacity" values="0;1;0;0" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M252,420 l1.8,4.3 4.3,1.8 -4.3,1.8 -1.8,4.3 -1.8,-4.3 -4.3,-1.8 4.3,-1.8 Z">
      <animate attributeName="opacity" values="0;0;1;0" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M355,439 l1.8,4.3 4.3,1.8 -4.3,1.8 -1.8,4.3 -1.8,-4.3 -4.3,-1.8 4.3,-1.8 Z">
      <animate attributeName="opacity" values="0;0.9;0;0.9;0" dur="4.5s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M560,315 l1.6,3.8 3.8,1.6 -3.8,1.6 -1.6,3.8 -1.6,-3.8 -3.8,-1.6 3.8,-1.6 Z">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M311,477 l1.6,3.8 3.8,1.6 -3.8,1.6 -1.6,3.8 -1.6,-3.8 -3.8,-1.6 3.8,-1.6 Z">
      <animate attributeName="opacity" values="0;0;1;0" dur="5s" begin="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
