<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(24px); } }
    @keyframes fly {
      0% { transform: translate(-380px, 0); }
      50% { transform: translate(260px, -16px); }
      100% { transform: translate(920px, 0); }
    }
    @keyframes sway {
      from { transform: rotate(-1.3deg) translateY(2px); }
      to { transform: rotate(1.3deg) translateY(-2px); }
    }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      25% { opacity: 0.8; }
      100% { transform: translateY(-18px); opacity: 0; }
    }
    @keyframes wave {
      from { transform: rotate(-12deg); }
      to { transform: rotate(10deg); }
    }
    .rays { transform-origin: 706px 84px; animation: spin 40s linear infinite; }
    .sun { transform-origin: 706px 84px; animation: pulse 4s ease-in-out infinite alternate; }
    .cld1 { animation: drift 14s ease-in-out infinite alternate; }
    .cld2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
    .cld3 { animation: drift 22s ease-in-out infinite alternate; }
    .birds { animation: fly 22s linear infinite; }
    .sway { transform-origin: 605px 372px; animation: sway 6s ease-in-out infinite alternate; }
    .st { animation: rise 2.4s ease-out infinite; }
    .st2 { animation-delay: 0.8s; }
    .st3 { animation-delay: 1.6s; }
    .wave { transform-origin: 266px 400px; animation: wave 0.9s ease-in-out infinite alternate; }
  </style>
