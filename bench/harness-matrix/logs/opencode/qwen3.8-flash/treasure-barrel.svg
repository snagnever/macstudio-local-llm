<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8e3"/>
      <stop offset="0.7" stop-color="#ffe9c2"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <linearGradient id="sandBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d9a0"/>
      <stop offset="1" stop-color="#e3c184"/>
    </linearGradient>
    <linearGradient id="sandFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c98a"/>
      <stop offset="0" stop-color="#e8c98a"/>
      <stop offset="1" stop-color="#cfa95f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e3617"/>
      <stop offset="0.2" stop-color="#8a5a2b"/>
      <stop offset="0.5" stop-color="#a0692f"/>
      <stop offset="0.8" stop-color="#8a5a2b"/>
      <stop offset="1" stop-color="#4e2c12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#d99a1f"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="95" r="60" fill="#ffe27a" opacity="0.35"/>
  <circle cx="680" cy="95" r="36" fill="#ffd76b"/>

  <!-- distant dunes -->
  <path d="M0,360 Q200,325 420,352 T800,340 L800,600 L0,600 Z" fill="url(#sandBack)"/>

  <!-- buried barrel -->
  <g transform="translate(400,300) rotate(14)">
    <!-- body -->
    <path d="M-90,-125 C-108,-55 -108,55 -90,125 L90,125 C108,55 108,-55 90,-125 Z"
          fill="url(#wood)" stroke="#3a2008" stroke-width="3"/>
    <!-- staves -->
    <g stroke="#3a2008" stroke-width="2" opacity="0.55">
      <path d="M-60,-122 C-70,-55 -70,55 -60,122" fill="none"/>
      <path d="M-30,-124 C-35,-55 -35,55 -30,124" fill="none"/>
      <path d="M0,-125 L0,125" fill="none"/>
      <path d="M30,-124 C35,-55 35,55 30,124" fill="none"/>
      <path d="M60,-122 C70,-55 70,55 60,122" fill="none"/>
    </g>
    <!-- iron bands -->
    <g fill="none" stroke="#4d4d55" stroke-width="12" stroke-linecap="round">
      <path d="M-100,-85 Q0,-70 100,-85"/>
      <path d="M-104,-35 Q0,-20 104,-35"/>
      <path d="M-104,45 Q0,60 104,45"/>
    </g>
    <g fill="none" stroke="#7a7a85" stroke-width="3" opacity="0.7">
      <path d="M-98,-88 Q0,-74 98,-88"/>
      <path d="M-102,-38 Q0,-24 102,-38"/>
      <path d="M-102,42 Q0,56 102,42"/>
    </g>
    <!-- open top -->
    <ellipse cx="0" cy="-125" rx="90" ry="24" fill="#241303" stroke="#3a2008" stroke-width="4"/>
    <!-- gold heap inside -->
    <path d="M-78,-122 Q-40,-146 0,-138 Q45,-148 78,-120 Q40,-112 0,-116 Q-40,-112 -78,-122 Z"
          fill="url(#gold)" stroke="#a8741a" stroke-width="2"/>
    <ellipse cx="-30" cy="-130" rx="14" ry="5" fill="#ffe27a" stroke="#a8741a" stroke-width="1.5"/>
    <ellipse cx="8" cy="-136" rx="14" ry="5" fill="#f6c548" stroke="#a8741a" stroke-width="1.5"/>
    <ellipse cx="42" cy="-128" rx="14" ry="5" fill="#ffe27a" stroke="#a8741a" stroke-width="1.5"/>
    <ellipse cx="-6" cy="-124" rx="14" ry="5" fill="#eab02e" stroke="#a8741a" stroke-width="1.5"/>
  </g>

  <!-- shadow -->
  <ellipse cx="415" cy="428" rx="175" ry="22" fill="#8a6a30" opacity="0.35"/>

  <!-- foreground sand half-burying the barrel -->
  <path d="M0,442 Q170,392 320,414 Q400,426 470,404 Q620,372 800,412 L800,600 L0,600 Z"
        fill="url(#sandFront)" stroke="#b8946a" stroke-width="2"/>
  <path d="M60,505 Q260,470 470,492 T800,480" fill="none" stroke="#b8946a" stroke-width="2" opacity="0.5"/>

  <!-- spilled coins -->
  <g stroke="#a8741a" stroke-width="1.5">
    <ellipse cx="492" cy="398" rx="15" ry="6" fill="#ffe27a" transform="rotate(-12 492 398)"/>
    <ellipse cx="521" cy="416" rx="15" ry="6" fill="#f6c548" transform="rotate(8 521 416)"/>
    <ellipse cx="556" cy="431" rx="15" ry="6" fill="#ffe27a" transform="rotate(-6 556 431)"/>
    <ellipse cx="594" cy="447" rx="15" ry="6" fill="#eab02e" transform="rotate(14 594 447)"/>
    <ellipse cx="632" cy="458" rx="15" ry="6" fill="#ffe27a" transform="rotate(-4 632 458)"/>
    <ellipse cx="318" cy="446" rx="15" ry="6" fill="#f6c548" transform="rotate(10 318 446)"/>
    <ellipse cx="286" cy="459" rx="15" ry="6" fill="#ffe27a" transform="rotate(-9 286 459)"/>
    <ellipse cx="330" cy="438" rx="15" ry="6" fill="#eab02e" transform="rotate(-3 330 438)"/>
  </g>
  <!-- gem -->
  <path d="M565,452 l10,-8 10,8 -10,10 Z" fill="#d94040" stroke="#8a1f1f" stroke-width="1.5"/>

  <!-- sparkles -->
  <g fill="none" stroke="#fff6c9" stroke-width="3" stroke-linecap="round">
    <path d="M405,168 l0,16 M397,176 l16,0"/>
    <path d="M520,405 l0,12 M514,411 l12,0"/>
    <path d="M290,437 l0,12 M284,443 l12,0"/>
    <path d="M618,447 l0,12 M612,453 l12,0"/>
  </g>
</svg>
