<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="A stunt car jumping through a circle of fire">
  <defs>
    <linearGradient id="v2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1a4d"/>
      <stop offset="35%" stop-color="#7a2f57"/>
      <stop offset="62%" stop-color="#d9603a"/>
      <stop offset="80%" stop-color="#f4a44c"/>
      <stop offset="100%" stop-color="#f7d489"/>
    </linearGradient>
    <radialGradient id="v2sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="45%" stop-color="#ffc766" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v2mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a2f4a"/>
      <stop offset="100%" stop-color="#2a1630"/>
    </linearGradient>
    <linearGradient id="v2ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a4a2c"/>
      <stop offset="45%" stop-color="#4f2718"/>
      <stop offset="100%" stop-color="#1d0e10"/>
    </linearGradient>
    <linearGradient id="v2ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="40%" stop-color="#ffb020"/>
      <stop offset="72%" stop-color="#ff5a12"/>
      <stop offset="100%" stop-color="#c81a00"/>
    </linearGradient>
    <linearGradient id="v2flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffe98f"/>
      <stop offset="40%" stop-color="#ff9a1a"/>
      <stop offset="100%" stop-color="#ff2d00" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="v2body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7ff"/>
      <stop offset="38%" stop-color="#5ec8f0"/>
      <stop offset="100%" stop-color="#155a86"/>
    </linearGradient>
    <linearGradient id="v2glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eafaff"/>
      <stop offset="60%" stop-color="#7fb9d8"/>
      <stop offset="100%" stop-color="#24435e"/>
    </linearGradient>
    <radialGradient id="v2blaze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd36b" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ff6a1f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>
    <filter id="v2blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="v2blurBig" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <path id="v2tongue" d="M -10 14 C -16 -10 -8 -30 -2 -50 C 2 -64 4 -76 0 -94 C 9 -72 17 -52 19 -32 C 21 -16 16 0 10 14 Z"/>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="url(#v2sky)"/>
  <circle cx="720" cy="430" r="150" fill="url(#v2sun)"/>

  <g fill="#3b1d3d" opacity="0.55">
    <path d="M0 430 L70 430 L70 360 L140 360 L140 430 L210 430 L210 385 L260 385 L260 430 L0 430 Z"/>
    <path d="M760 430 L830 430 L830 350 L910 350 L910 400 L1000 400 L1000 430 L760 430 Z"/>
  </g>

  <path d="M0 460 Q120 425 240 440 Q380 458 480 440 L480 600 L0 600 Z" fill="url(#v2mesa)"/>
  <path d="M1000 455 Q880 420 760 442 Q660 460 560 438 L560 600 L1000 600 Z" fill="url(#v2mesa)"/>

  <path d="M0 470 Q250 445 500 462 Q750 479 1000 452 L1000 600 L0 600 Z" fill="url(#v2ground)"/>
  <path d="M0 470 Q250 445 500 462 Q750 479 1000 452" fill="none" stroke="#c07a45" stroke-width="3" opacity="0.5"/>

  <path d="M60 470 L250 470 L250 395 L120 400 Z" fill="#3a2018" stroke="#6b3d29" stroke-width="3"/>
  <path d="M120 400 L250 395 L250 382 L140 386 Z" fill="#54301f"/>
  <path d="M120 386 L250 382" fill="none" stroke="#ffb35c" stroke-width="2" opacity="0.6"/>

  <ellipse cx="560" cy="470" rx="220" ry="42" fill="url(#v2blaze)" filter="url(#v2blur)"/>

  <ellipse cx="560" cy="300" rx="230" ry="250" fill="url(#v2blaze)" filter="url(#v2blurBig)"/>

  <g transform="translate(560 300) rotate(-8)">
    <ellipse cx="0" cy="0" rx="118" ry="150" fill="none" stroke="#ff6a1f" stroke-width="52" opacity="0.35" filter="url(#v2blur)"/>
    <ellipse cx="0" cy="0" rx="118" ry="150" fill="none" stroke="url(#v2ring)" stroke-width="24"/>
    <ellipse cx="0" cy="0" rx="104" ry="136" fill="none" stroke="#fff3b0" stroke-width="3" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="132" ry="164" fill="none" stroke="#7c1400" stroke-width="2" opacity="0.7"/>

    <g>
      <use href="#v2tongue" transform="rotate(0) translate(0 -150) scale(0.9)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(30) translate(0 -150) scale(0.7)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(60) translate(0 -150) scale(0.95)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(90) translate(0 -150) scale(0.72)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(120) translate(0 -150) scale(1.0)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(150) translate(0 -150) scale(0.7)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(180) translate(0 -150) scale(0.92)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(210) translate(0 -150) scale(0.72)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(240) translate(0 -150) scale(1.02)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(270) translate(0 -150) scale(0.7)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(300) translate(0 -150) scale(0.95)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(330) translate(0 -150) scale(0.72)" fill="url(#v2flame)"/>
    </g>
    <g opacity="0.7">
      <use href="#v2tongue" transform="rotate(20) translate(0 -134) rotate(180) scale(0.5)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(110) translate(0 -134) rotate(180) scale(0.46)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(200) translate(0 -134) rotate(180) scale(0.5)" fill="url(#v2flame)"/>
      <use href="#v2tongue" transform="rotate(290) translate(0 -134) rotate(180) scale(0.46)" fill="url(#v2flame)"/>
    </g>
  </g>

  <g fill="#ffd98a">
    <circle cx="430" cy="180" r="3" opacity="0.9"/>
    <circle cx="700" cy="210" r="2.4" opacity="0.8"/>
    <circle cx="380" cy="330" r="2.8" opacity="0.85"/>
    <circle cx="730" cy="400" r="2.6" opacity="0.8"/>
    <circle cx="470" cy="470" r="3" opacity="0.7"/>
    <circle cx="650" cy="130" r="2.2" opacity="0.7"/>
    <circle cx="800" cy="300" r="2.4" opacity="0.7"/>
  </g>

  <g stroke="#ffd88a" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <path d="M150 360 L250 330"/>
    <path d="M120 400 L240 366"/>
    <path d="M180 438 L262 408"/>
  </g>

  <g transform="translate(560 300) rotate(-22)">
    <path d="M -150 12 C -186 8 -214 0 -232 -10 C -214 -4 -188 -2 -156 4 Z" fill="#ff8c1a" opacity="0.85"/>
    <path d="M -150 10 C -180 4 -200 -6 -212 -18 C -194 -8 -170 -4 -150 -2 Z" fill="#ffe27a" opacity="0.9" filter="url(#v2blur)"/>

    <path d="M -136 30 L -136 4 Q -134 -16 -108 -19 L -54 -22 L -24 -58 Q -17 -66 -4 -66 L 40 -66 Q 62 -66 76 -50 L 100 -22 L 126 -17 Q 146 -12 148 14 L 148 30 Z" fill="url(#v2body)" stroke="#0d3c58" stroke-width="2.5"/>
    <path d="M -136 30 L 148 30 L 148 23 L -136 23 Z" fill="#0f4a6b" opacity="0.85"/>
    <path d="M -22 -27 L -20 -54 Q -16 -60 -4 -60 L 34 -60 Q 50 -60 58 -46 L 66 -27 Z" fill="url(#v2glass)" stroke="#122530" stroke-width="2"/>
    <path d="M -16 -27 L -14 -50 Q -12 -55 -3 -55 L 14 -55 L 14 -27 Z" fill="#eaf7ff" opacity="0.35"/>
    <path d="M -132 8 L -106 -8 L -54 -10 L -24 -46 L 40 -46 L 76 -14 L 124 -10 L 146 8 Z" fill="#ffffff" opacity="0.12"/>
    <ellipse cx="138" cy="6" rx="13" ry="9" fill="#fff2b8" stroke="#c9a24a" stroke-width="1.5"/>
    <path d="M -124 14 L -140 6 L -140 16 L -124 18 Z" fill="#ffe27a"/>

    <path d="M 60 -66 L 76 -66 L 90 -90 L 60 -90 Z" fill="#155a86" stroke="#0d3c58" stroke-width="2"/>

    <circle cx="-74" cy="34" r="26" fill="#141418"/>
    <circle cx="-74" cy="34" r="14" fill="#585866"/>
    <circle cx="-74" cy="34" r="5" fill="#d6d6e2"/>
    <circle cx="88" cy="34" r="26" fill="#141418"/>
    <circle cx="88" cy="34" r="14" fill="#585866"/>
    <circle cx="88" cy="34" r="5" fill="#d6d6e2"/>
  </g>

  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.18">
    <path d="M300 470 C 340 420 360 380 380 330"/>
    <path d="M340 470 C 380 428 396 390 410 350"/>
  </g>
</svg>
