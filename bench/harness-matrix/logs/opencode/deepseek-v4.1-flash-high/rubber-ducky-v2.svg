<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="A rubber ducky floating on a soapy bathtub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f3fb"/>
      <stop offset="1" stop-color="#b8dcef"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3fbff"/>
      <stop offset="1" stop-color="#d8ecf6"/>
    </linearGradient>
    <linearGradient id="tubOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f0f6fa"/>
      <stop offset="1" stop-color="#c2d2dc"/>
    </linearGradient>
    <linearGradient id="tubInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdffff"/>
      <stop offset="1" stop-color="#dcebf3"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ecfa"/>
      <stop offset="1" stop-color="#79c2e6"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf6fd"/>
    </linearGradient>
    <radialGradient id="duckBody" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#fff29a"/>
      <stop offset="1" stop-color="#f3a90f"/>
    </radialGradient>
    <radialGradient id="duckHead" cx="0.38" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#fff7ad"/>
      <stop offset="1" stop-color="#f6b81f"/>
    </radialGradient>
    <radialGradient id="duckWing" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffe877"/>
      <stop offset="1" stop-color="#eda410"/>
    </radialGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bfe2f5" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- tiled wall -->
  <rect x="0" y="0" width="900" height="700" fill="url(#bg)"/>
  <g stroke="#c3e0ef" stroke-width="2" opacity="0.7">
    <path d="M0 120 H900 M0 240 H900 M0 360 H900 M0 480 H900"/>
    <path d="M150 0 V120 M300 0 V120 M450 0 V120 M600 0 V120 M750 0 V120"/>
    <path d="M75 120 V240 M225 120 V240 M375 120 V240 M525 120 V240 M675 120 V240 M825 120 V240"/>
    <path d="M150 240 V360 M300 240 V360 M450 240 V360 M600 240 V360 M750 240 V360"/>
  </g>
  <rect x="0" y="0" width="900" height="360" fill="url(#tile)" opacity="0.25"/>

  <!-- soft sparkles -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="120" cy="80" r="6"/>
    <circle cx="760" cy="120" r="8"/>
    <circle cx="640" cy="60" r="5"/>
    <circle cx="340" cy="180" r="5"/>
    <circle cx="820" cy="300" r="6"/>
  </g>

  <!-- tub -->
  <g>
    <path d="M105 275 q0 -46 46 -46 h600 q46 0 46 46 v78 q0 172 -184 172 h-324 q-184 0 -184 -172 z"
          fill="url(#tubOuter)" stroke="#9fb0bb" stroke-width="5"/>
    <ellipse cx="451" cy="275" rx="346" ry="52" fill="url(#tubInner)" stroke="#9fb0bb" stroke-width="5"/>
    <ellipse cx="451" cy="275" rx="310" ry="36" fill="#e4f0f6"/>
    <!-- rolled rim -->
    <path d="M105 275 q0 -46 46 -46 h600 q46 0 46 46" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.8"/>

    <!-- claw feet -->
    <g fill="#c79a5a" stroke="#8b6634" stroke-width="4">
      <path d="M190 505 q-30 44 4 58 q30 10 40 -20 q8 -26 -16 -40 z"/>
      <path d="M712 505 q30 44 -4 58 q-30 10 -40 -20 q-8 -26 16 -40 z"/>
      <path d="M320 540 q-24 30 2 40 q24 8 32 -14 q6 -18 -12 -28 z" opacity="0.85"/>
      <path d="M582 540 q24 30 -2 40 q-24 8 -32 -14 q-6 -18 12 -28 z" opacity="0.85"/>
    </g>
    <path d="M150 300 q-18 90 30 150" fill="none" stroke="#ffffff" stroke-width="9" opacity="0.45"/>
  </g>

  <!-- water -->
  <path d="M140 322 h622 v34 q0 138 -170 138 h-282 q-170 0 -170 -138 z" fill="url(#water)" opacity="0.92"/>
  <g stroke="#a7d9f0" stroke-width="3" fill="none" opacity="0.7">
    <path d="M200 380 q40 16 80 0 q40 -16 80 0"/>
    <path d="M540 400 q40 16 80 0 q40 -16 80 0"/>
    <path d="M300 440 q40 16 80 0"/>
  </g>

  <!-- foam ridge -->
  <path d="M140 322 q42 -30 88 -4 q42 24 86 -6 q44 -30 88 2 q44 30 88 -4 q42 -30 88 6 q40 26 88 6 v40 q-42 20 -88 -2 q-44 -22 -88 2 q-44 24 -88 -2 q-42 -24 -88 4 q-42 26 -88 -2 q-40 -24 -88 6 z"
        fill="url(#foam)"/>
  <g fill="url(#bubble)" stroke="#ffffff" stroke-width="1.5">
    <circle cx="190" cy="322" r="26"/>
    <circle cx="230" cy="306" r="18"/>
    <circle cx="262" cy="326" r="22"/>
    <circle cx="300" cy="304" r="15"/>
    <circle cx="600" cy="320" r="24"/>
    <circle cx="640" cy="302" r="17"/>
    <circle cx="676" cy="326" r="21"/>
    <circle cx="712" cy="308" r="14"/>
    <circle cx="356" cy="332" r="16"/>
    <circle cx="548" cy="334" r="18"/>
  </g>

  <!-- duck -->
  <g>
    <!-- body -->
    <ellipse cx="450" cy="378" rx="118" ry="74" fill="url(#duckBody)"/>
    <!-- tail -->
    <path d="M536 330 q68 -26 60 14 q-10 40 -74 34 z" fill="#f6b922"/>
    <!-- wing -->
    <ellipse cx="492" cy="368" rx="56" ry="42" fill="url(#duckWing)" transform="rotate(-12 492 368)"/>
    <path d="M470 350 q30 -14 56 6 q-30 22 -56 -6 z" fill="#ffe58a" opacity="0.55"/>
    <!-- head -->
    <circle cx="440" cy="272" r="74" fill="url(#duckHead)"/>
    <!-- neck blend -->
    <path d="M392 318 q44 26 96 -6 q18 30 -14 52 q-46 26 -92 0 q-24 -24 10 -46 z" fill="url(#duckHead)"/>
    <!-- beak -->
    <path d="M378 258 q-58 10 -62 42 q-4 20 22 32 q20 8 40 -10 z" fill="#f29a10"/>
    <path d="M322 288 q-16 14 4 30 q24 16 58 2 q-42 -6 -62 -32 z" fill="#dd7708"/>
    <path d="M330 300 q18 10 42 6" fill="none" stroke="#c96a06" stroke-width="3" opacity="0.7"/>
    <!-- eye -->
    <circle cx="462" cy="252" r="14" fill="#3a2a17"/>
    <circle cx="467" cy="247" r="4.5" fill="#ffffff"/>
    <circle cx="458" cy="256" r="2.5" fill="#ffffff" opacity="0.7"/>
    <!-- head highlight -->
    <path d="M398 226 q40 -40 90 -16 q-46 -6 -90 16 z" fill="#fff7c2" opacity="0.75"/>
    <!-- cheek blush -->
    <ellipse cx="398" cy="286" rx="16" ry="10" fill="#ff9d6b" opacity="0.35"/>
    <!-- waterline overlap -->
    <path d="M344 372 q50 34 112 6 q50 -24 96 4 q-52 34 -108 34 q-64 0 -100 -44 z" fill="url(#water)" opacity="0.55"/>
  </g>

  <!-- floating bubbles above -->
  <g fill="url(#bubble)" stroke="#ffffff" stroke-width="1.5">
    <circle cx="300" cy="200" r="18"/>
    <circle cx="330" cy="160" r="11"/>
    <circle cx="600" cy="190" r="22"/>
    <circle cx="634" cy="150" r="13"/>
    <circle cx="660" cy="204" r="9"/>
    <circle cx="250" cy="240" r="8"/>
    <circle cx="560" cy="238" r="10"/>
    <circle cx="200" cy="160" r="12"/>
    <circle cx="700" cy="230" r="7"/>
  </g>

  <!-- faucet -->
  <g fill="#c9d3da" stroke="#8f9ba4" stroke-width="4">
    <path d="M760 275 v-110 q0 -22 24 -22 h26 q22 0 22 22 v22" fill="none" stroke-linecap="round"/>
    <rect x="806" y="90" width="62" height="18" rx="8"/>
    <rect x="742" y="260" width="60" height="18" rx="8"/>
  </g>
  <ellipse cx="812" cy="99" rx="18" ry="5" fill="#eef4f8" opacity="0.8"/>

  <!-- reflections -->
  <ellipse cx="300" cy="470" rx="130" ry="24" fill="#ffffff" opacity="0.16"/>
  <ellipse cx="620" cy="480" rx="110" ry="20" fill="#ffffff" opacity="0.12"/>
</svg>
