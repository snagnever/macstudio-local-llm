      <rect x="60" y="202" width="290" height="72" fill="#f6b93b"/>
      <rect x="60" y="274" width="290" height="72" fill="#e94f37"/>
      <rect x="60" y="346" width="290" height="72" fill="#f6b93b"/>
      <rect x="60" y="418" width="290" height="80" fill="#e94f37"/>
