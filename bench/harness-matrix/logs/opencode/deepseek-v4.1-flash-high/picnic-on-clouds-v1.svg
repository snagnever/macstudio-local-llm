    <ellipse cx="360" cy="140" rx="60" ry="22"/>
    <ellipse cx="860" cy="220" rx="110" ry="28"/>
    <ellipse cx="930" cy="208" rx="70" ry="22"/>
    <ellipse cx="120" cy="330" rx="80" ry="22"/>
  </g>

