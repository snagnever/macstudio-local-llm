    <circle cx="813" cy="616" r="21" fill="#f6d0ad"/>
    <circle cx="791" cy="616" r="9" fill="#e0a23c"/>
    <circle cx="835" cy="616" r="9" fill="#e0a23c"/>
    <path d="M792 610 a21 21 0 0 1 42 0 q -21 -13 -42 0 z" fill="#e0a23c"/>
    <circle cx="806" cy="616" r="2.5" fill="#2b2b2b"/>
    <circle cx="820" cy="616" r="2.5" fill="#2b2b2b"/>
