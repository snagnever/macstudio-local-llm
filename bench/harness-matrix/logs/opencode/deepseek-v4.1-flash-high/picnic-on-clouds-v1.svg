<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c4f8a"/>
      <stop offset="0.45" stop-color="#5aa7dd"/>
      <stop offset="0.8" stop-color="#a9d8f5"/>
      <stop offset="1" stop-color="#d9eefb"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="envClip">
      <path d="M200 140 C265 140 330 220 330 320 C330 395 265 455 248 485 L152 485 C135 455 70 395 70 320 C70 220 135 140 200 140 Z"/>
    </clipPath>
    <pattern id="check" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)">
      <rect width="44" height="44" fill="#f6f1e7"/>
      <rect width="22" height="22" fill="#d94f4f"/>
      <rect x="22" y="22" width="22" height="22" fill="#d94f4f"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1080" cy="110" r="140" fill="url(#sunGlow)"/>
  <circle cx="1080" cy="110" r="58" fill="#ffe08a"/>

