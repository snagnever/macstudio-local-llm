<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="A stunt car jumping through a circle of fire">
  <defs>
    <linearGradient id="v3sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
