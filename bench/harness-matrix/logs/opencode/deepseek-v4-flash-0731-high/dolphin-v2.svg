<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="deep2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="skin2" cx="0.4" cy="0.3" r="1.1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="0.6" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="400" fill="url(#sky2)"/>

  <!-- Sun with glow -->
  <circle cx="650" cy="110" r="38" fill="#fff7cc"/>
  <circle cx="650" cy="110" r="50" fill="#fde047" opacity="0.25"/>
  <circle cx="650" cy="110" r="70" fill="#fde047" opacity="0.10"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="120" cy="150" rx="70" ry="24"/>
    <ellipse cx="175" cy="138" rx="45" ry="17"/>
    <ellipse cx="68" cy="144" rx="34" ry="14"/>
    <ellipse cx="420" cy="100" rx="55" ry="18"/>
    <ellipse cx="468" cy="90" rx="38" ry="13"/>
  </g>

  <!-- Birds -->
  <g stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 240 120 q 8 -9 16 0 q 8 -9 16 0"/>
    <path d="M 300 90 q 6 -7 12 0 q 6 -7 12 0"/>
  </g>

  <!-- Pier -->
  <g>
    <rect x="520" y="300" width="200" height="16" rx="4" fill="#8b5a2b"/>
    <g fill="#6b4226">
      <rect x="536" y="316" width="14" height="86" rx="4"/>
      <rect x="620" y="316" width="14" height="86" rx="4"/>
      <rect x="696" y="316" width="14" height="86" rx="4"/>
    </g>
    <g fill="#a16207" opacity="0.9">
      <rect x="525" y="302" width="12" height="14" rx="3"/>
      <rect x="700" y="302" width="12" height="14" rx="3"/>
    </g>
  </g>

  <!-- Trainer -->
  <g>
    <!-- Whiteshorts / legs -->
    <g>
      <rect x="580" y="260" width="15" height="44" rx="7" fill="#f7c08a"/>
      <rect x="600" y="260" width="15" height="44" rx="7" fill="#f7c08a"/>
      <rect x="574" y="258" width="48" height="18" rx="8" fill="#f1f5f9"/>
    </g>
    <!-- Torso, arm extended left-down toward dolphin -->
    <path d="M 583 256 C 580 225 590 208 598 206 C 606 204 612 214 612 240 L 604 256 Z" fill="#0ea5e9"/>
    <!-- Head -->
    <circle cx="598" cy="194" r="15" fill="#f7c08a"/>
    <path d="M 583 194 a 15 15 0 0 1 30 0 Z" fill="#78350f"/>
    <circle cx="606" cy="191" r="2" fill="#1e293b"/>
    <!-- Extended arm -->
    <path d="M 588 224 L 505 214 L 505 226 L 588 236 Z" fill="#f7c08a"/>
    <circle cx="503" cy="219" r="8" fill="#fca5a5"/>
  </g>

  <!-- Fish wobbling in trainer's fingers -->
  <g>
    <line x1="496" y1="225" x2="488" y2="219" stroke="#fca5a5" stroke-width="4" stroke-linecap="round"/>
    <line x1="498" y1="213" x2="488" y2="217" stroke="#fca5a5" stroke-width="4" stroke-linecap="round"/>
    <path d="M 486 219 C 470 214 466 224 480 229 C 462 236 470 246 486 240 C 494 238 495 224 486 219 Z" fill="#fbbf24"/>
    <path d="M 446 226 L 432 218 L 432 234 Z" fill="#fdba74"/>
    <path d="M 482 231 L 470 233 L 472 227 Z" fill="#ffffff"/>
    <circle cx="474" cy="223" r="2.2" fill="#1f2937"/>
    <path d="M 452 220 Q 456 216 452 212" stroke="#fdba74" stroke-width="2" fill="none"/>
  </g>

  <!-- Hula hoop, tilted toward the dolphin's arc -->
  <g transform="translate(360,300) rotate(-20)">
    <circle r="74" fill="none" stroke="#f43f5e" stroke-width="8"/>
    <circle r="74" fill="none" stroke="#fda4af" stroke-width="3" opacity="0.8"/>
    <path d="M -26 -74 A 74 74 0 0 1 26 -74" fill="none" stroke="#fff1f2" stroke-width="3" stroke-dasharray="10 8"/>
  </g>

  <!-- Dolphin leaping: muzzle reaching the fish, body curling in a high arc -->
  <g transform="translate(400,330) rotate(-55)">
    <!-- body -->
    <path d="M -95 5 C -85 -10 -55 -20 -20 -24 C 25 -28 70 -20 100 -6 C 118 3 132 16 143 28 C 148 33 152 33 150 28 C 146 16 136 6 122 -2 C 90 -24 35 -40 -20 -38 C -75 -36 -105 -22 -118 -6 C -128 7 -126 16 -118 20 C -108 25 -98 22 -100 14 Z" fill="url(#skin2)"/>
    <!-- tail -->
    <path d="M -118 4 L -150 -12 L -132 4 L -150 20 Z" fill="#1e293b"/>
    <!-- dorsal -->
    <path d="M -5 -24 C 2 -52 18 -58 22 -52 C 26 -42 20 -30 20 -24 Z" fill="#334155"/>
    <!-- belly -->
    <path d="M -60 -14 C -30 -8 10 -4 40 2 C 60 6 78 12 90 18 C 55 28 0 30 -60 0 Z" fill="#e2e8f0" opacity="0.95"/>
    <!-- flipper -->
    <path d="M 60 8 C 58 26 46 34 42 28 C 40 20 50 12 60 8 Z" fill="#334155"/>
    <!-- eye -->
    <circle cx="80" cy="-14" r="4.5" fill="#0f172a"/>
    <circle cx="81.5" cy="-15.5" r="1.6" fill="#ffffff"/>
    <!-- blowhole -->
    <path d="M 14 -25 C 16 -30 20 -30 22 -26" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- spout -->
    <g fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <path d="M -34 -70 C -40 -82 -46 -84 -52 -80"/>
      <path d="M -26 -74 C -28 -88 -34 -92 -40 -92 C -40 -82 -34 -78 -30 -78"/>
      <path d="M -22 -72 C -18 -84 -12 -88 -6 -84 C -8 -76 -16 -74 -20 -74"/>
    </g>
    <!-- open mouth grasping toward fish -->
    <path d="M 143 28 C 150 34 158 34 161 29 C 163 24 158 20 152 20 Z" fill="#e2e8f0"/>
    <path d="M 143 28 L 158 32 L 152 24 Z" fill="#fda4af"/>
    <!-- teeth -->
    <g fill="#fff">
      <path d="M 148 24 l 3 3 l 2 -3 Z"/>
      <path d="M 155 27 l 2 3 l 2 -3 Z"/>
    </g>
  </g>

  <!-- Water splash around exit point -->
  <g fill="#bae6fd">
    <ellipse cx="330" cy="404" rx="90" ry="26"/>
    <path d="M 270 396 q -18 -30 -30 -18 q 10 8 30 18" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round"/>
    <path d="M 260 392 q 6 -28 18 -24 q -4 12 -14 20" fill="none" stroke="#f0f9ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="298" cy="372" r="6"/>
    <circle cx="352" cy="366" r="7"/>
    <circle cx="320" cy="360" r="5"/>
    <circle cx="378" cy="380" r="6"/>
    <circle cx="258" cy="372" r="5"/>
  </g>

  <!-- Reflection arc on the water -->
  <path d="M 330 406 C 380 396 430 396 470 402" stroke="#bae6fd" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Ocean -->
  <rect x="0" y="400" width="800" height="200" fill="url(#sea2)"/>
  <path d="M 0 400 Q 55 388 110 400 T 220 400 T 330 400 T 440 400 T 550 400 T 660 400 T 800 400 L 800 424 L 0 424 Z" fill="url(#deep2)"/>
  <g stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 40 440 Q 80 432 120 440"/>
    <path d="M 300 470 Q 340 462 380 470"/>
    <path d="M 560 455 Q 600 447 640 455"/>
    <path d="M 150 510 Q 190 502 230 510"/>
    <path d="M 620 520 Q 660 512 700 520"/>
  </g>
  <path d="M 0 600 Q 200 560 400 585 T 800 595 L 800 600 Z" fill="#1e3a8a" opacity="0.5"/>
</svg>