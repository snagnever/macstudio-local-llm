<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0820"/>
      <stop offset="55%" stop-color="#251030"/>
      <stop offset="100%" stop-color="#3a1420"/>
    </linearGradient>
    <radialGradient id="haloA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#e24412" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d42a08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c0"/>
      <stop offset="40%" stop-color="#ffd27a"/>
      <stop offset="75%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#e24412" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="torusA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a1200"/>
      <stop offset="45%" stop-color="#e24412"/>
      <stop offset="100%" stop-color="#ff9a3c"/>
    </linearGradient>
    <radialGradient id="flameA" cx="42%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff8c8"/>
      <stop offset="32%" stop-color="#ffc95e"/>
      <stop offset="62%" stop-color="#ff7a1a"/>
      <stop offset="85%" stop-color="#e24412"/>
      <stop offset="100%" stop-color="#8a1600"/>
    </radialGradient>
    <radialGradient id="haloG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f04a50"/>
      <stop offset="100%" stop-color="#b01820"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3ecff"/>
      <stop offset="100%" stop-color="#2c5d7a"/>
    </linearGradient>
    <filter id="blurLA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurSA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <path id="tongueA" d="M 0 -22 C 6 -12 9 -3 8 5 C 7 10 3 14 0 16 C -3 14 -7 10 -8 5 C -9 -3 -6 -12 0 -22 Z"/>
  </defs>

  <!-- sky -->
  <rect width="900" height="650" fill="url(#skyA)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="40" r="1.4"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="24" r="1.6"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="50" r="1.3"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="80" r="1.6"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="170" r="1.2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="1.2"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- breathing halo behind the hoop -->
  <circle cx="450" cy="300" r="240" fill="url(#haloA)" filter="url(#blurLA)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- ground -->
  <rect x="0" y="528" width="900" height="122" fill="#160b12"/>
  <line x1="0" y1="528" x2="900" y2="528" stroke="#ff8a2a" stroke-width="2" opacity="0.25"/>
  <ellipse cx="450" cy="544" rx="230" ry="22" fill="url(#haloG)" filter="url(#blurSA)">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="1.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- launch ramps -->
  <polygon points="-30,650 60,542 150,542 210,650" fill="#1a0f14"/>
  <polygon points="700,542 790,542 880,650 930,650" fill="#1a0f14"/>

  <!-- ============ CIRCLE OF FIRE (bobbing hoop) ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- pulsing core inside the opening -->
    <circle cx="450" cy="300" r="126" fill="url(#coreA)">
      <animate attributeName="r" values="120;132;120" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <!-- main torus -->
    <path fill-rule="evenodd" fill="url(#torusA)"
          d="M 260 300 A 190 190 0 1 0 640 300 A 190 190 0 1 0 260 300 Z M 322 300 A 128 128 0 1 1 578 300 A 128 128 0 1 1 322 300 Z"/>
    <!-- hot inner rim -->
    <circle cx="450" cy="300" r="128" fill="none" stroke="#ffe08a" stroke-width="7">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <!-- rotating energy ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 450 300" to="360 450 300" dur="9s" repeatCount="indefinite"/>
      <circle cx="450" cy="300" r="128" fill="none" stroke="#ff9638" stroke-width="3" stroke-dasharray="3 18" opacity="0.8"/>
    </g>
    <!-- flickering flame tongues around the hoop -->
    <g>
      <use href="#tongueA" transform="translate(655 300) rotate(90)"><animateTransform attributeName="transform" type="scale" values="0.9 1.1 0.95 1.15 0.9" dur="0.45s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(627.5 197.5) rotate(60)"><animateTransform attributeName="transform" type="scale" values="1.15 0.9 1.05 0.92 1.15" dur="0.55s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(552.5 122.5) rotate(30)"><animateTransform attributeName="transform" type="scale" values="0.95 1.1 1.15 0.92 0.95" dur="0.5s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(450 95) rotate(0)"><animateTransform attributeName="transform" type="scale" values="1.1 0.9 1.15 0.95 1.1" dur="0.42s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(347.5 122.5) rotate(-30)"><animateTransform attributeName="transform" type="scale" values="1.05 1.2 0.9 1.1 1.05" dur="0.6s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(272.5 197.5) rotate(-60)"><animateTransform attributeName="transform" type="scale" values="0.9 1.05 1.2 0.92 0.9" dur="0.48s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(245 300) rotate(-90)"><animateTransform attributeName="transform" type="scale" values="1.15 0.95 1.1 0.9 1.15" dur="0.52s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(272.5 402.5) rotate(-120)"><animateTransform attributeName="transform" type="scale" values="0.95 1.15 0.9 1.05 0.95" dur="0.58s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(347.5 477.5) rotate(-150)"><animateTransform attributeName="transform" type="scale" values="1.1 0.92 1.15 0.95 1.1" dur="0.47s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(450 505) rotate(-180)"><animateTransform attributeName="transform" type="scale" values="0.92 1.18 1 0.9 0.92" dur="0.44s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(552.5 477.5) rotate(-210)"><animateTransform attributeName="transform" type="scale" values="1.05 0.9 1.15 0.95 1.05" dur="0.56s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(627.5 402.5) rotate(-240)"><animateTransform attributeName="transform" type="scale" values="0.95 1.12 0.9 1.08 0.95" dur="0.5s" repeatCount="indefinite"/></use>
    </g>
    <!-- inner licks licking up from the rim -->
    <g>
      <use href="#tongueA" transform="translate(365.1 384.9) rotate(45)"><animateTransform attributeName="transform" type="scale" values="0.85 1.1 0.9 0.85" dur="0.6s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(450 420) rotate(0)"><animateTransform attributeName="transform" type="scale" values="1.05 0.85 1.1 1.05" dur="0.5s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(534.9 384.9) rotate(-45)"><animateTransform attributeName="transform" type="scale" values="0.9 1.12 0.86 0.9" dur="0.55s" repeatCount="indefinite"/></use>
      <use href="#tongueA" transform="translate(450 180) rotate(180)"><animateTransform attributeName="transform" type="scale" values="1.1 0.88 1.05 1.1" dur="0.7s" repeatCount="indefinite"/></use>
    </g>
  </g>

  <!-- ============ STUNT CAR (jumps through the hoop) ============ -->
  <g>
    <animateMotion dur="5s" rotate="auto" repeatCount="indefinite"
                   path="M 140 530 C 300 200 600 200 760 530"/>
    <!-- rear exhaust thrust, flickering -->
    <g>
      <polygon points="-84 8 -156 26 -156 36 -84 16" fill="#ffd27a" opacity="0.55" filter="url(#blurSA)">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="0.25s" repeatCount="indefinite"/>
      </polygon>
      <path d="M -84 10 L -118 2 L -112 18 Z" fill="url(#flameA)">
        <animateTransform attributeName="transform" type="scale" values="0.85 1.12 0.92 1.2 0.85" dur="0.18s" repeatCount="indefinite"/>
      </path>
      <path d="M -84 14 L -106 10 L -102 20 Z" fill="#fff8c8">
        <animateTransform attributeName="transform" type="scale" values="1.15 0.85 1.05 0.9 1.15" dur="0.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- rear wing -->
    <polygon points="-74 -22 -54 -30 -44 -22 -62 -16" fill="#180a12"/>
    <!-- body -->
    <path fill="url(#bodyA)" stroke="#5c060c" stroke-width="1.5"
          d="M -78 -6 L -64 -24 L -40 -34 L -18 -40 L 30 -40 L 58 -24 L 78 -6 L 90 8 L 86 20 L 64 28 L 46 28 L 40 18 L -50 18 L -66 26 L -84 10 Z"/>
    <!-- racing stripe -->
    <path d="M -52 -16 L 62 -16 L 66 -6 L -56 -6 Z" fill="#fff" opacity="0.85"/>
    <path d="M -44 -23 L 40 -23 L 44 -15 L -48 -15 Z" fill="#2b0a12"/>
    <!-- glass -->
    <polygon points="-38 -26 -28 -38 8 -44 26 -38 32 -26 -38 -26" fill="url(#glassA)" stroke="#5c060c" stroke-width="1"/>
    <!-- headlight + beam -->
    <rect x="86" y="2" width="6" height="5" rx="1" fill="#fff8d0"/>
    <polygon points="92 3 118 -2 118 20 92 9" fill="#fff3b0" opacity="0.4"/>
    <!-- speed streak -->
    <polygon points="-80 12 -170 30 -170 42 -80 20" fill="#ffe9a8" opacity="0.4">
      <animate attributeName="opacity" values="0.25;0.55;0.25" dur="0.3s" repeatCount="indefinite"/>
    </polygon>
    <!-- fender skirts -->
    <path d="M -78 -6 L -74 14 L -56 18 L -52 -8 Z" fill="#80121a"/>
    <path d="M 44 18 L 70 14 L 72 -2 L 58 -8 Z" fill="#80121a"/>
    <!-- rear wheel -->
    <g transform="translate(-42 24)">
      <circle r="17" fill="#14111c" stroke="#3a3546" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.3s" repeatCount="indefinite"/>
        <circle r="9" fill="#c9c3cf"/>
        <line x1="-9" y1="0" x2="9" y2="0" stroke="#575060" stroke-width="2.5"/>
        <line x1="0" y1="-9" x2="0" y2="9" stroke="#575060" stroke-width="2.5"/>
        <line x1="-6.4" y1="-6.4" x2="6.4" y2="6.4" stroke="#575060" stroke-width="2.5"/>
        <line x1="-6.4" y1="6.4" x2="6.4" y2="-6.4" stroke="#575060" stroke-width="2.5"/>
        <circle r="3" fill="#575060"/>
      </g>
    </g>
    <!-- front wheel -->
    <g transform="translate(44 24)">
      <circle r="16" fill="#14111c" stroke="#3a3546" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.28s" repeatCount="indefinite"/>
        <circle r="8.5" fill="#c9c3cf"/>
        <line x1="-8.5" y1="0" x2="8.5" y2="0" stroke="#575060" stroke-width="2.5"/>
        <line x1="0" y1="-8.5" x2="0" y2="8.5" stroke="#575060" stroke-width="2.5"/>
        <line x1="-6" y1="-6" x2="6" y2="6" stroke="#575060" stroke-width="2.5"/>
        <line x1="-6" y1="6" x2="6" y2="-6" stroke="#575060" stroke-width="2.5"/>
        <circle r="3" fill="#575060"/>
      </g>
    </g>
  </g>

  <!-- near bottom rim of the hoop, in front of the car -->
  <use href="#tongueA" transform="translate(450 499) rotate(-180) scale(2.1)" fill="url(#flameA)">
    <animateTransform attributeName="transform" type="scale" values="1.8 2.3 1.9 2.25 1.8" dur="0.5s" repeatCount="indefinite"/>
  </use>
  <use href="#tongueA" transform="translate(505 492) rotate(-205) scale(1.4)" fill="url(#flameA)">
    <animateTransform attributeName="transform" type="scale" values="1.3 1.55 1.35 1.5 1.3" dur="0.55s" repeatCount="indefinite"/>
  </use>

  <!-- torch flames on ramps -->
  <g opacity="0.9">
    <use href="#tongueA" transform="translate(150 540) scale(0.9)" fill="url(#flameA)"><animateTransform attributeName="transform" type="scale" values="0.8 1 0.85 0.95 0.8" dur="0.4s" repeatCount="indefinite"/></use>
    <use href="#tongueA" transform="translate(700 540) scale(0.9)" fill="url(#flameA)"><animateTransform attributeName="transform" type="scale" values="0.85 1.05 0.8 1 0.85" dur="0.45s" repeatCount="indefinite"/></use>
  </g>

  <!-- takeoff puff of dust -->
  <g transform="translate(150 536)">
    <animate attributeName="opacity" values="0;0.75;0" dur="1.1s" begin="0.1s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="14" fill="#4a3a3a" filter="url(#blurSA)" opacity="0.85"><animateTransform attributeName="transform" type="scale" values="0.6 1.4 1.3" dur="1.1s" begin="0.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- landing puff of dust -->
  <g transform="translate(752 536)">
    <animate attributeName="opacity" values="0;0.75;0" dur="1.1s" begin="4.05s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="14" fill="#4a3a3a" filter="url(#blurSA)" opacity="0.85"><animateTransform attributeName="transform" type="scale" values="0.6 1.5 1.2" dur="1.1s" begin="4.05s" repeatCount="indefinite"/></circle>
  </g>

  <!-- drifting embers -->
  <g filter="url(#blurSA)">
    <circle cx="330" cy="470" r="3" fill="#ffd27a"><animateMotion dur="3.2s" begin="0.2s" repeatCount="indefinite" path="c -20 -60 -30 -120 -50 -180"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="480" r="2.6" fill="#ff8a32"><animateMotion dur="2.8s" begin="1.1s" repeatCount="indefinite" path="c -10 -70 -25 -130 -30 -210"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="480" r="3.2" fill="#fff3c0"><animateMotion dur="3.6s" begin="0.8s" repeatCount="indefinite" path="c 10 -60 30 -120 35 -200"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="470" r="2.4" fill="#ffd27a"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="c 15 -55 20 -115 15 -190"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="300" r="2.6" fill="#ff8a32"><animateMotion dur="4s" begin="1.7s" repeatCount="indefinite" path="c 5 -40 5 -90 -10 -150"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="4s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="340" r="2.8" fill="#fff3c0"><animateMotion dur="3.4s" begin="0.5s" repeatCount="indefinite" path="c -5 -45 -15 -95 -35 -150"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="420" r="2.2" fill="#ffd27a"><animateMotion dur="2.6s" begin="2.6s" repeatCount="indefinite" path="c -5 -50 -20 -100 -45 -160"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="2.6s" begin="2.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>