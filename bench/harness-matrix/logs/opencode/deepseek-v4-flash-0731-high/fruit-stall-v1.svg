<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd9f0"/>
      <stop offset="1" stop-color="#e8f1f8"/>
    </linearGradient>
    <linearGradient id="awning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="1" stop-color="#e0453a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98a5c"/>
      <stop offset="1" stop-color="#8f663f"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5de"/>
      <stop offset="1" stop-color="#ffe9bd"/>
    </linearGradient>
    <pattern id="awningStripe" width="60" height="12" patternUnits="userSpaceOnUse">
      <rect width="60" height="12" fill="#ffe9bd"/>
      <rect x="30" width="30" height="12" fill="#ff6b5e"/>
    </pattern>
  </defs>

  <!-- Sky background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="690" cy="90" r="46" fill="#ffd866" opacity="0.9"/>
  <circle cx="690" cy="90" r="60" fill="#ffd866" opacity="0.25"/>

  <!-- Distant rooftops -->
  <rect x="30" y="190" width="120" height="70" fill="#4a6b8a" opacity="0.35"/>
  <polygon points="90,160 30,190 150,190" fill="#4a6b8a" opacity="0.35"/>
  <rect x="170" y="210" width="90" height="50" fill="#5a7a99" opacity="0.3"/>
  <polygon points="215,180 170,210 260,210" fill="#5a7a99" opacity="0.3"/>
  <rect x="640" y="200" width="130" height="60" fill="#5a7a99" opacity="0.3"/>
  <polygon points="705,170 640,200 770,200" fill="#5a7a99" opacity="0.3"/>

  <!-- Ground -->
  <rect x="0" y="420" width="800" height="180" fill="#c8a06a"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#a8834f" stroke-width="3"/>

  <!-- Stall back pole -->
  <rect x="150" y="140" width="16" height="290" fill="#7a5836"/>

  <!-- Wooden counter -->
  <rect x="120" y="360" width="560" height="34" rx="4" fill="url(#wood)"/>
  <rect x="130" y="394" width="540" height="44" fill="#6b4a2a"/>
  <rect x="146" y="408" width="508" height="8" rx="4" fill="#5a3e22"/>

  <!-- Counter legs -->
  <rect x="150" y="438" width="18" height="90" fill="#7a5836"/>
  <rect x="632" y="438" width="18" height="90" fill="#7a5836"/>

  <!-- Awning support pole (front left) -->
  <rect x="108" y="150" width="12" height="260" fill="#8a6642"/>

  <!-- Awning -->
  <g>
    <path d="M 110 150 L 690 150 L 660 230 L 140 230 Z" fill="url(#awning)" stroke="#c94235" stroke-width="2"/>
    <path d="M 110 150 L 690 150 L 660 230 L 140 230 Z" fill="url(#awningStripe)"/>
    <path d="M 110 150 L 690 150 L 690 148 L 110 148 Z" fill="#d13a2e"/>
    <!-- scalloped edge -->
    <g fill="#ff6b5e">
      <ellipse cx="185" cy="230" rx="30" ry="16"/>
      <ellipse cx="255" cy="230" rx="30" ry="16"/>
      <ellipse cx="325" cy="230" rx="30" ry="16"/>
      <ellipse cx="395" cy="230" rx="30" ry="16"/>
      <ellipse cx="465" cy="230" rx="30" ry="16"/>
      <ellipse cx="535" cy="230" rx="30" ry="16"/>
      <ellipse cx="605" cy="230" rx="30" ry="16"/>
      <ellipse cx="650" cy="230" rx="16" ry="14"/>
    </g>
    <path d="M 110 150 L 690 150 L 690 148 L 110 148 Z" fill="#c94235"/>
  </g>

  <!-- Price sign hanging from awning -->
  <line x1="400" y1="235" x2="400" y2="252" stroke="#4a3a28" stroke-width="2"/>
  <rect x="330" y="252" width="140" height="34" rx="5" fill="#fffdf5" stroke="#4a3a28" stroke-width="2"/>
  <text x="400" y="274" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#4a3a28" text-anchor="middle">FRESH FRUIT</text>

  <!-- Crates on the counter -->
  <g>
    <rect x="150" y="320" width="120" height="40" rx="3" fill="#b98a5c" stroke="#8f6a44" stroke-width="2"/>
    <line x1="150" y1="340" x2="270" y2="340" stroke="#8f6a44" stroke-width="2"/>
    <line x1="210" y1="320" x2="210" y2="360" stroke="#8f6a44" stroke-width="2"/>
    <!-- Apples -->
    <circle cx="180" cy="312" r="11" fill="#e84b3a"/>
    <circle cx="205" cy="308" r="11" fill="#d13a2e"/>
    <circle cx="230" cy="313" r="11" fill="#f06a4a"/>
    <circle cx="192" cy="296" r="11" fill="#e65440"/>
    <circle cx="218" cy="295" r="11" fill="#c93a2a"/>
    <circle cx="206" cy="280" r="10" fill="#e84b3a"/>
  </g>

  <g>
    <rect x="300" y="322" width="130" height="38" rx="3" fill="#b98a5c" stroke="#8f6a44" stroke-width="2"/>
    <line x1="300" y1="341" x2="430" y2="341" stroke="#8f6a44" stroke-width="2"/>
    <!-- Oranges -->
    <circle cx="332" cy="314" r="12" fill="#ff9a2e"/>
    <circle cx="358" cy="309" r="12" fill="#f77f1a"/>
    <circle cx="384" cy="314" r="12" fill="#ffa844"/>
    <circle cx="345" cy="294" r="12" fill="#ff9a2e"/>
    <circle cx="372" cy="292" r="11" fill="#f77f1a"/>
    <circle cx="358" cy="276" r="10" fill="#ff9a2e"/>
  </g>

  <!-- Bananas hanging from front of the counter -->
  <g stroke="#e8a33d" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 470 350 Q 480 380 458 396"/>
    <path d="M 482 350 Q 494 382 472 398"/>
    <path d="M 494 350 Q 508 384 486 400"/>
  </g>
  <title>banana cluster</title>

  <!-- Fanned lemons on a small plate -->
  <ellipse cx="560" cy="366" rx="34" ry="8" fill="#e8e2d2"/>
  <ellipse cx="560" cy="364" rx="34" ry="8" fill="#f4efdf" stroke="#cfc6ae" stroke-width="1.5"/>
  <g>
    <ellipse cx="548" cy="357" rx="11" ry="13" fill="#f2d73d"/>
    <ellipse cx="561" cy="355" rx="11" ry="14" fill="#fbee6e"/>
    <ellipse cx="574" cy="357" rx="11" ry="13" fill="#f2d73d"/>
  </g>

  <!-- Grapes hanging on the right side -->
  <line x1="640" y1="290" x2="640" y2="310" stroke="#7a5836" stroke-width="2"/>
  <g fill="#8a4bae">
    <circle cx="630" cy="318" r="7"/>
    <circle cx="644" cy="324" r="7"/>
    <circle cx="636" cy="332" r="7"/>
    <circle cx="626" cy="332" r="7"/>
    <circle cx="648" cy="318" r="7"/>
    <circle cx="652" cy="332" r="7"/>
    <circle cx="640" cy="342" r="7"/>
    <circle cx="650" cy="344" r="7"/>
    <circle cx="632" cy="344" r="7"/>
  </g>

  <!-- Baskets beside the stall -->
  <g>
    <ellipse cx="76" cy="436" rx="40" ry="14" fill="#a87c4e"/>
    <path d="M 36 436 Q 40 470 76 470 Q 112 470 116 436" fill="#b98a5c"/>
    <ellipse cx="76" cy="470" rx="40" ry="9" fill="#8f663f"/>
    <ellipse cx="76" cy="434" rx="40" ry="14" fill="#cfa06a"/>
    <!-- Stone fruits -->
    <circle cx="66" cy="430" r="11" fill="#e8a5b8"/>
    <circle cx="84" cy="428" r="11" fill="#c96d85"/>
    <circle cx="76" cy="418" r="11" fill="#e08a9e"/>
  </g>
  <g>
    <ellipse cx="716" cy="436" rx="40" ry="14" fill="#a87c4e"/>
    <path d="M 676 436 Q 680 470 716 470 Q 752 470 756 436" fill="#b98a5c"/>
    <ellipse cx="716" cy="470" rx="40" ry="9" fill="#8f663f"/>
    <ellipse cx="716" cy="434" rx="40" ry="14" fill="#cfa06a"/>
    <!-- Green apples -->
    <circle cx="706" cy="430" r="11" fill="#8fbf4e"/>
    <circle cx="726" cy="428" r="11" fill="#7aa93c"/>
    <circle cx="716" cy="418" r="11" fill="#9cc95a"/>
  </g>

  <!-- Bunting string -->
  <path d="M 120 150 Q 400 210 690 150" fill="none" stroke="#6b4a2a" stroke-width="1.5"/>
  <g>
    <polygon points="180,170 196,178 180,196 164,178" fill="#f2d73d"/>
    <polygon points="260,184 276,192 260,210 244,192" fill="#ff6b5e"/>
    <polygon points="340,194 356,202 340,220 324,202" fill="#8fbf4e"/>
    <polygon points="420,198 436,206 420,224 404,206" fill="#f2d73d"/>
    <polygon points="500,194 516,202 500,220 484,202" fill="#8fbf4e"/>
    <polygon points="580,184 596,192 580,210 564,192" fill="#ff6b5e"/>
    <polygon points="650,170 666,178 650,196 634,178" fill="#f2d73d"/>
  </g>

  <!-- Stall keeper (simple vendor figure) -->
  <g>
    <rect x="84" y="70" width="0" height="0"/>
    <circle cx="506" cy="470" r="14" fill="#e8c39d"/>
    <!-- hair -->
    <path d="M 492 468 A 14 14 0 0 1 520 468 L 518 458 A 15 15 0 0 0 494 458 Z" fill="#4a3520"/>
    <!-- straw hat -->
    <ellipse cx="506" cy="455" rx="26" ry="6" fill="#d9b26a"/>
    <path d="M 488 455 Q 506 428 524 455 Z" fill="#e8c876"/>
    <!-- body -->
    <rect x="486" y="484" width="40" height="56" rx="8" fill="#3f7bb0"/>
    <!-- apron -->
    <rect x="492" y="512" width="28" height="34" rx="4" fill="#f4efe0"/>
    <!-- arms -->
    <path d="M 486 492 Q 468 500 466 520" fill="none" stroke="#3f7bb0" stroke-width="10" stroke-linecap="round"/>
    <path d="M 526 492 Q 544 500 546 520" fill="none" stroke="#3f7bb0" stroke-width="10" stroke-linecap="round"/>
    <!-- right hand on a hanging lemon -->
    <circle cx="546" cy="521" r="7" fill="#e8c39d"/>
    <circle cx="466" cy="521" r="7" fill="#e8c39d"/>
    <!-- legs -->
    <rect x="494" y="540" width="11" height="46" rx="5" fill="#5a4632"/>
    <rect x="508" y="540" width="11" height="46" rx="5" fill="#5a4632"/>
    <!-- face -->
    <circle cx="501" cy="472" r="1.6" fill="#333"/>
    <circle cx="511" cy="472" r="1.6" fill="#333"/>
    <path d="M 503 478 Q 506 481 509 478" fill="none" stroke="#b3543a" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Small awning strut ropes -->
  <line x1="112" y1="150" x2="150" y2="150" stroke="#c94235" stroke-width="3"/>
  <line x1="688" y1="150" x2="668" y2="150" stroke="#c94235" stroke-width="3"/>
</svg>