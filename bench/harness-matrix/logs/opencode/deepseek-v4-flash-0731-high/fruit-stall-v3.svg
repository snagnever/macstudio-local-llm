<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243a52"/>
      <stop offset="0.55" stop-color="#4a5f78"/>
      <stop offset="1" stop-color="#d97953"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a44a"/>
      <stop offset="1" stop-color="#f7d779"/>
