<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8e3"/>
      <stop offset="1" stop-color="#cdeffd"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="waterWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="dolphinBody" cx="0.35" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="110" cy="90" r="48" fill="url(#sun)"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="200" cy="80" rx="55" ry="20"/>
    <ellipse cx="250" cy="70" rx="40" ry="16"/>
    <ellipse cx="160" cy="75" rx="35" ry="14"/>
    <ellipse cx="560" cy="110" rx="60" ry="22"/>
    <ellipse cx="620" cy="100" rx="45" ry="17"/>
    <ellipse cx="515" cy="103" rx="35" ry="14"/>
  </g>

  <!-- Splash droplets -->
  <g fill="#ffffff">
    <line x1="330" y1="392" x2="318" y2="360" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="352" y1="392" x2="352" y2="350" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="372" y1="392" x2="386" y2="358" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="305" cy="350" r="5"/>
    <circle cx="398" cy="348" r="6"/>
    <circle cx="338" cy="336" r="5"/>
    <circle cx="368" cy="330" r="5"/>
  </g>

  <!-- Trainer figure on the floating platform -->
  <g>
    <rect x="455" y="382" width="90" height="12" rx="6" fill="#92400e"/>
    <rect x="470" y="394" width="18" height="120" rx="9" fill="#92400e"/>
    <rect x="512" y="394" width="18" height="120" rx="9" fill="#92400e"/>
    <rect x="486" y="500" width="250" height="16" rx="8" fill="#a16207"/>

    <!-- Left leg, arm extended with fish -->
    <g>
      <rect x="480" y="360" width="16" height="70" rx="8" fill="#f5b041"/>
      <rect x="470" y="352" width="20" height="14" rx="7" fill="#fdf6e3"/>
      <path d="M 490 352 L 560 352 L 560 366 L 490 366 Z" fill="#f5b041"/>
      <circle cx="486" cy="372" r="12" fill="#f5b041"/>
      <rect x="494" y="392" width="18" height="76" rx="9" fill="#3b82f6"/>
      <rect x="484" y="390" width="40" height="16" rx="8" fill="#fdf6e3"/>
      <circle cx="468" cy="402" r="13" fill="#f5b041"/>
      <rect x="450" y="400" width="20" height="10" rx="5" fill="#f5b041"/>
    </g>

    <!-- Fish held in hand -->
    <g>
      <line x1="430" y1="395" x2="445" y2="408" stroke="#f87171" stroke-width="3"/>
      <ellipse cx="418" cy="402" rx="22" ry="10" fill="#f87171"/>
      <path d="M 396 402 L 386 392 L 386 412 Z" fill="#fca5a5"/>
      <circle cx="404" cy="399" r="2.5" fill="#1f2937"/>
    </g>

    <!-- Darting fish escape -->
    <g fill="#f87171">
      <circle cx="396" cy="446" r="7"/>
      <path d="M 388 446 L 378 437 L 378 455 Z"/>
      <circle cx="384" cy="343" r="7"/>
      <path d="M 376 343 L 366 334 L 366 352 Z"/>
    </g>

    <!-- Left shoulder thong -->
    <rect x="545" y="352" width="20" height="120" rx="10" transform="rotate(10 555 400)" fill="#f5b041"/>
    <polygon points="535,352 565,352 570,395 530,395" fill="#fdf6e3"/>
  </g>

  <!-- Hula hoop -->
  <g transform="translate(360,332)">
    <circle cx="0" cy="0" r="68" fill="none" stroke="#f43f5e" stroke-width="9"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#fb7185" stroke-width="4" opacity="0.6"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#be123c" stroke-width="2.5" stroke-dasharray="14 10"/>
  </g>

  <!-- Dolphin leaping -->
  <g transform="translate(408,300) rotate(-45)">
    <path d="M -130 10 C -120 0 -95 -8 -75 -8 C -30 -12 20 -12 55 -4 C 80 2 105 14 120 24 C 125 28 130 30 132 26 C 130 18 120 10 110 4 C 80 -20 20 -34 -40 -32 C -90 -30 -120 -18 -135 -6 C -145 4 -145 14 -138 18 C -130 22 -122 20 -125 14 Z" fill="url(#dolphinBody)"/>
    <!-- Tail flukes -->
    <path d="M -130 10 L -160 -6 L -142 10 L -158 24 Z" fill="#334155"/>
    <path d="M -143 16 L -152 10 L -138 10 Z" fill="#334155"/>
    <!-- Dorsal fin -->
    <path d="M -20 -8 C -15 -34 0 -40 5 -34 C 8 -24 4 -12 5 -6 Z" fill="#475569"/>
    <!-- Left flipper -->
    <path d="M 40 14 C 34 30 22 34 20 26 C 20 18 30 12 40 14 Z" fill="#475569"/>
    <!-- Belly -->
    <path d="M -75 -8 C -50 -2 -10 2 30 8 C 10 14 -40 18 -75 -8 Z" fill="#e2e8f0" opacity="0.92"/>
    <!-- Eye -->
    <circle cx="95" cy="-6" r="4" fill="#1e293b"/>
    <circle cx="96" cy="-7" r="1.4" fill="#ffffff"/>
    <!-- Rounded rostrum -->
    <ellipse cx="132" cy="24" rx="8" ry="5" fill="#334155"/>
  </g>

  <!-- Ocean -->
  <rect x="0" y="400" width="800" height="200" fill="url(#ocean)"/>
  <path d="M 0 400 Q 60 385 130 400 T 270 400 T 410 400 T 550 400 T 690 400 T 800 400 L 800 415 L 0 415 Z" fill="url(#waterWave)"/>
  <path d="M 0 412 Q 80 398 160 412 T 330 412 T 500 412 T 670 412 T 800 412 L 800 430 L 0 430 Z" fill="#38bdf8" opacity="0.7"/>
  <path d="M 0 425 Q 70 414 150 425 T 320 425 T 490 425 T 660 425 T 800 425 L 800 445 L 0 445 Z" fill="#0ea5e9" opacity="0.8"/>
  <ellipse cx="400" cy="600" rx="460" ry="80" fill="#134e4a" opacity="0.5"/>
</svg>