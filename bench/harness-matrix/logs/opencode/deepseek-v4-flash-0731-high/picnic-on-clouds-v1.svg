    <circle cx="-23" cy="22" r="4" fill="#e8b890"/>
    <path d="M11 6 l12 14" stroke="#c25052" stroke-width="6" stroke-linecap="round"/>
    <circle cx="23" cy="20" r="4" fill="#e8b890"/>
    <!-- head -->
