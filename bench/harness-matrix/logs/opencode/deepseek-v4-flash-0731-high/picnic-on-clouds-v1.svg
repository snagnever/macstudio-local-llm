    <rect x="6" y="-17" width="3" height="14" rx="1.5" fill="#d7b88a"/>
    <path d="M-9 -2 q-8 0 -8 6 q0 8 8 6" fill="#cfe3f7"/>
    <ellipse cx="-9" cy="2" rx="8" ry="3" fill="#ffffff" opacity="0.6"/>
  </g>
  <g transform="translate(520,472)">
    <path d="M-7 0 L-5 -13 L5 -13 L7 0 Z" fill="#ffffff"/>
    <ellipse cx="0" cy="-13" rx="5" ry="2" fill="#ffd54f"/>
  </g>
  <g transform="translate(540,470)">
    <path d="M-7 0 L-5 -13 L5 -13 L7 0 Z" fill="#ffffff"/>
    <ellipse cx="0" cy="-13" rx="5" ry="2" fill="#cfe3b0"/>
  </g>

  <!-- scattered strawberries -->
  <g transform="translate(590,540)">
    <path d="M-5 -1 q-7 -6 1 -9 q10 0 8 7 v1 q0 3 -3 4 q-6 2 -6 -3" fill="#e53935"/>
    <path d="M-2 -9 q-2 -4 0 -5 q2 1 1 5" fill="#6b8e23"/>
    <circle cx="-3" cy="-5" r="0.7" fill="#ffe082"/>
    <circle cx="1" cy="-3" r="0.7" fill="#ffe082"/>
  </g>
  <g transform="translate(610,548)">
    <path d="M-5 -1 q-7 -6 1 -9 q10 0 8 7 v1 q0 3 -3 4 q-6 2 -6 -3" fill="#e53935"/>
    <path d="M-2 -9 q-2 -4 0 -5 q2 1 1 5" fill="#6b8e23"/>
    <circle cx="-3" cy="-5" r="0.7" fill="#ffe082"/>
    <circle cx="1" cy="-3" r="0.7" fill="#ffe082"/>
  </g>

  <!-- napkin roll -->
  <g transform="translate(480,522)">
    <rect x="-7" y="-4" width="14" height="8" rx="4" fill="#f7f1e0"/>
    <line x1="-4" y1="-4" x2="-4" y2="4" stroke="#e8dcc8" stroke-width="1"/>
  </g>

  <!-- PEOPLE -->
  <!-- DAD (left, kneeling, pouring) -->
  <g transform="translate(250,425)">
    <!-- legs (kneeling) -->
    <path d="M-14 38 l-8 6" stroke="#3e5c8a" stroke-width="9" stroke-linecap="round"/>
    <path d="M14 38 l8 6" stroke="#3e5c8a" stroke-width="9" stroke-linecap="round"/>
    <!-- body/shirt -->
