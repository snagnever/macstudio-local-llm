    <path d="M-20 8 L20 8 L18 18 L-18 18 Z" fill="#4a7fd4"/>
    <path d="M-16 34 L16 34" stroke="#d4c39a" stroke-width="4" opacity="0.6"/>
    <!-- arms -->
    <path d="M-14 12 l-14 24" stroke="#4a7fd4" stroke-width="8" stroke-linecap="round"/>
    <path d="M14 12 l14 22" stroke="#4a7fd4" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-28" cy="36" r="5.5" fill="#e8b890"/>
    <circle cx="28" cy="34" r="5.5" fill="#e8b890"/>
    <!-- head -->
    <circle cx="0" cy="-4" r="15" fill="#e8b890"/>
    <path d="M-13 -8 q2 -14 13 -14 q9 0 13 10 q-3 2 -17 1" fill="#4d3a22"/>
    <path d="M-15 -6 q-2 -13 4 -15 q-4 12 1 14" fill="#4d3a22"/>
    <ellipse cx="-5" cy="-6" rx="2.6" ry="1.6" fill="#4b3621"/>
    <ellipse cx="6" cy="-6" rx="2.6" ry="1.6" fill="#4b3621"/>
    <path d="M-3 -2 q3 3 6 0" stroke="#7a4b2e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M-3 2 q-2 -3 4 -4" stroke="#7a4b2e" stroke-width="2" fill="none"/>
    <!-- mustache -->
    <path d="M-6 0 q6 3 12 0 q-2 4 -6 4 q-4 0 -6 -4" fill="#4b3621"/>
  </g>
  <!-- MOM (right, seated, holding plate) -->
  <g transform="translate(610,420)">
    <!-- dress skirt -->
    <path d="M-24 38 Q0 58 24 38 L10 38 L-6 38 Z" fill="#e8546f"/>
    <path d="M-6 38 L10 38 L20 48 L-16 48 Z" fill="#e8546f" opacity="0.9"/>
    <!-- legs under skirt -->
