    <path d="M0 -22 Q-22 -14 -20 6 L20 6 Q22 -14 0 -22 Z" fill="#ff8aa3" opacity="0.25"/>
    <!-- hair -->
    <path d="M0 -34 q-20 -8 -24 8 q8 -10 48 -10 q24 2 24 16" fill="#7a4a21"/>
    <path d="M0 -38 q-16 -6 -20 6 q-2 -16 20 -10" fill="#8a5a2e"/>
    <path d="M24 -24 q4 -10 0 -16 q2 -6 -6 -6 q8 -2 8 6" fill="#8a5a2e" transform="rotate(0 24 -20)"/>
    <!-- arms -->
