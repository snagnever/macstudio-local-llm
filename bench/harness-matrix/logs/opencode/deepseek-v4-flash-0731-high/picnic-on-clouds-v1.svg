    <circle cx="-24" cy="26" r="4.5" fill="#e8b890"/>
    <!-- head -->
    <circle cx="0" cy="-8" r="13" fill="#e8b890"/>
    <path d="M-11 -12 q0 -12 11 -12 q10 0 12 10 q-4 2 -14 1" fill="#6b3f1f"/>
    <ellipse cx="-4" cy="-8" rx="2.4" ry="1.5" fill="#4b3621"/>
    <ellipse cx="5" cy="-8" rx="2.4" ry="1.5" fill="#4b3621"/>
    <path d="M-2 -4 q3 3 5 0" stroke="#7a4b2e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="1" cy="-16" rx="5" ry="2" fill="#ff8a8a"/>
    <circle cx="14" cy="-13" r="3" fill="#ffd166"/>
