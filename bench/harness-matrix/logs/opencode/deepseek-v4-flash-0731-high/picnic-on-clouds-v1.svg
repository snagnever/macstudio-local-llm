  <!-- CHILD girl (right center, sitting) -->
  <g transform="translate(520,448)">
    <!-- legs -->
    <path d="M-9 34 l-6 8" stroke="#c25052" stroke-width="6" stroke-linecap="round"/>
    <path d="M9 34 l6 8" stroke="#c25052" stroke-width="6" stroke-linecap="round"/>
