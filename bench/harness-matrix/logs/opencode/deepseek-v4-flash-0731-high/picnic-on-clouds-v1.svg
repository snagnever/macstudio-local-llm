    <path d="M16 0 l16 18" stroke="#e8546f" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-30" cy="20" r="5" fill="#e8b890"/>
    <circle cx="32" cy="18" r="5" fill="#e8b890"/>
    <!-- head -->
    <circle cx="2" cy="-26" r="14" fill="#e8b890"/>
    <ellipse cx="-3" cy="-26" rx="2.4" ry="1.6" fill="#4b3621"/>
    <ellipse cx="8" cy="-26" rx="2.4" ry="1.6" fill="#4b3621"/>
    <path d="M0 -22 q3 3 6 0" stroke="#7a4b2e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M-4 -18 q0 4 5 4 q4 0 5 -3" stroke="#a0465a" stroke-width="2" fill="none"/>
    <!-- earrings -->
