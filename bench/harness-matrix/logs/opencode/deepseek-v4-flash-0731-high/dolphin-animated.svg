<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8e0"/>
      <stop offset="1" stop-color="#cdeffd"/>
    </linearGradient>
    <linearGradient id="seaA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="dolphinA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="0.55" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="sunA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="400" fill="url(#skyA)"/>

  <!-- Drifting clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="-80" cy="90" rx="60" ry="20"/>
      <ellipse cx="-30" cy="80" rx="45" ry="15"/>
      <ellipse cx="-120" cy="84" rx="35" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="-150 0; 950 0" begin="0s" dur="40s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="0" cy="150" rx="70" ry="22"/>
      <ellipse cx="70" cy="138" rx="50" ry="16"/>
      <animateTransform attributeName="transform" type="translate" values="-250 0; 1050 0" begin="5s" dur="55s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Sun with slowly rotating rays -->
  <g>
    <circle cx="680" cy="85" r="42" fill="url(#sunA)"/>
    <g stroke="#fde047" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <line x1="680" y1="14" x2="680" y2="2"/>
      <line x1="680" y1="168" x2="680" y2="156"/>
      <line x1="609" y1="85" x2="597" y2="85"/>
      <line x1="751" y1="85" x2="763" y2="85"/>
      <line x1="630" y1="35" x2="621" y2="26"/>
      <line x1="730" y1="135" x2="739" y2="144"/>
      <line x1="730" y1="35" x2="739" y2="26"/>
      <line x1="630" y1="135" x2="621" y2="144"/>
      <animateTransform attributeName="transform" type="rotate" values="0 680 85; 360 680 85" dur="40s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Trainer platform at far left -->
  <g>
    <rect x="20" y="368" width="120" height="12" rx="5" fill="#92400e"/>
    <rect x="30" y="380" width="14" height="22" rx="5" fill="#92400e"/>
    <rect x="112" y="380" width="14" height="22" rx="5" fill="#92400e"/>

    <!-- Trainer -->
    <rect x="52" y="300" width="13" height="66" rx="6" fill="#f5b041"/>
    <rect x="70" y="300" width="13" height="66" rx="6" fill="#f5b041"/>
    <rect x="46" y="292" width="42" height="16" rx="8" fill="#4ade80"/>
    <path d="M 48 290 C 44 258 54 240 63 238 C 72 236 80 248 80 276 Z" fill="#ef4444"/>
    <circle cx="64" cy="226" r="14" fill="#f5b041"/>
    <path d="M 47 226 a 17 17 0 0 1 34 0 Z" fill="#3b2f2f"/>
    <circle cx="72" cy="222" r="2" fill="#111827"/>
    <circle cx="72" cy="222" r="3" stroke="#111827" stroke-width="1" fill="none"/>
    <path d="M 49 246 q 5 3 10 0" stroke="#111827" stroke-width="1.5" fill="none"/>
    <!-- extended arm -->
    <path d="M 76 256 L 220 238 L 220 250 L 76 268 Z" fill="#f5b041"/>
    <circle cx="222" cy="244" r="8.5" fill="#fca5a5"/>
  </g>

  <!-- Fish wiggling in the trainer's hand -->
  <g transform="translate(238,244)">
    <animateTransform attributeName="transform" type="rotate" values="-8 238 244; 8 238 244; -8 238 244" dur="0.8s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="20" ry="9" fill="#fbbf24"/>
    <path d="M -16 0 L -28 -9 L -28 9 Z" fill="#f59e0b"/>
    <circle cx="-6" cy="-2.5" r="1.8" fill="#1f2937"/>
    <path d="M -2 -4 q -3 -4 0 -7" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    <line x1="6" y1="-9" x2="2" y2="4" stroke="#fef3c7" stroke-width="1.5" opacity="0.7"/>
    <line x1="-10" y1="-6" x2="5" y2="0" stroke="#fef3c7" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Hula hoop, gently rocking, with twinkling sparkles -->
  <g transform="translate(470,270)">
    <animateTransform attributeName="transform" type="rotate" values="-4 470 270; 5 470 270; -4 470 270" dur="3s" repeatCount="indefinite"/>
    <circle r="86" fill="none" stroke="#e11d48" stroke-width="10"/>
    <circle r="86" fill="none" stroke="#fb7185" stroke-width="4" opacity="0.7"/>
    <path d="M 0 -86 A 86 86 0 0 1 43 -74" fill="none" stroke="#fff1f2" stroke-width="3" stroke-dasharray="12 10"/>
    <g fill="#ffffff">
      <circle cx="60" cy="62" r="3"/>
      <circle cx="-72" cy="-48" r="2.5"/>
      <circle cx="-8" cy="84" r="2"/>
      <circle cx="30" cy="-80" r="2.5"/>
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Splash droplets that cycle with the jump -->
  <g fill="#e0f2fe">
    <circle cx="300" cy="392">
      <animate attributeName="cy" values="392; 350; 392" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0.6; 0" keyTimes="0; 0.08; 0.2; 0.32" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="394">
      <animate attributeName="cy" values="394; 340; 394" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0.6; 0" keyTimes="0; 0.08; 0.2; 0.32" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="282" cy="390">
      <animate attributeName="cy" values="390; 355; 390" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0.6; 0" keyTimes="0; 0.08; 0.2; 0.32" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="345" cy="396">
      <animate attributeName="cy" values="396; 362; 396" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0.6; 0" keyTimes="0; 0.08; 0.2; 0.32" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Dolphin: the leap loop follows the arc water -> hoop -> fish -> water -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="230 560; 330 440; 455 320; 405 260; 330 225; 250 300; 230 560"
      keyTimes="0; 0.2; 0.4; 0.52; 0.64; 0.8; 1"
      dur="5s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-70; -55; -15; -40; -100; -120; -70"
        keyTimes="0; 0.2; 0.4; 0.52; 0.64; 0.8; 1"
        dur="5s" repeatCount="indefinite"/>

      <!-- tail flukes that wag -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -18 0 0; 0 0 0" dur="0.6s" repeatCount="indefinite"/>
        <path d="M -118 6 L -152 -12 L -134 6 L -152 24 Z" fill="#1e293b"/>
      </g>

      <!-- body -->
      <path d="M -115 5 C -100 -12 -60 -26 -25 -30 C 25 -38 80 -26 118 -10 C 138 -2 155 12 166 24 C 172 30 178 28 174 21 C 168 8 152 -3 132 -11 C 95 -28 40 -40 -15 -36 C -65 -32 -102 -16 -115 0 C -124 10 -118 18 -110 18 Z" fill="url(#dolphinA)"/>

      <!-- dorsal fin -->
      <path d="M 8 -30 C 16 -56 32 -60 37 -52 C 41 -40 36 -30 34 -30 Z" fill="#334155"/>

      <!-- belly -->
      <path d="M -60 -12 C -24 -4 30 0 70 8 C 55 22 0 30 -70 4 Z" fill="#e2e8f0" opacity="0.92"/>

      <!-- flipper that paddles -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 85 6; 16 85 6; 0 85 6" dur="0.55s" repeatCount="indefinite"/>
        <path d="M 85 6 C 90 24 78 34 70 30 C 66 22 75 12 85 6 Z" fill="#334155"/>
      </g>

      <!-- eye with a blink -->
      <g>
        <circle cx="122" cy="-16" r="4.5" fill="#0f172a"/>
        <circle cx="123.5" cy="-17.5" r="1.5" fill="#ffffff"/>
        <path d="M 117.5 -16 L 126.5 -16 L 126.5 -12 L 117.5 -12 Z" fill="url(#dolphinA)">
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.38;0.4;0.42;1" dur="5s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- blowhole -->
      <path d="M 34 -31 C 36 -36 41 -36 42 -31" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- open mouth -->
      <path d="M 166 24 C 178 32 190 30 193 24 C 191 16 179 14 172 16 Z" fill="#e2e8f0"/>
      <path d="M 166 24 L 191 26 L 185 18 Z" fill="#fda4af"/>
      <g fill="#ffffff">
        <path d="M 173 21 l 4 3 l 2 -3 Z"/>
        <path d="M 183 22 l 4 3 l 2 -3 Z"/>
      </g>

      <!-- head highlight -->
      <path d="M 70 -34 C 100 -30 130 -22 148 -15" stroke="#cbd5e1" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Ripple rings where the dolphin resurfaces -->
  <g stroke="#7dd3fc" fill="none">
    <ellipse cx="310" cy="404" rx="20" ry="7">
      <animate attributeName="rx" values="8; 44" dur="5s" keyTimes="0" repeatCount="indefinite"/>
      <animate attributeName="ry" values="3; 16" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0.8; 0" dur="5s" keyTimes="0; 0.12; 0.3" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="235" cy="408" rx="14" ry="5">
      <animate attributeName="rx" values="8; 60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="3; 20" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0.8; 0" dur="5s" keyTimes="0.75; 0.88; 1" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Waves: rolling surface -->
  <rect x="0" y="400" width="800" height="200" fill="url(#seaA)"/>
  <g fill="none" stroke="#67e8f9" stroke-width="4" opacity="0.8">
    <path d="M 0 400 Q 55 386 110 400 T 220 400 T 330 400 T 440 400 T 550 400 T 660 400 T 770 400">
      <animate attributeName="d" values="M 0 400 Q 55 386 110 400 T 220 400 T 330 400 T 440 400 T 550 400 T 660 400 T 770 400; M 0 400 Q 55 414 110 400 T 220 400 T 330 400 T 440 400 T 550 400 T 660 400 T 770 400; M 0 400 Q 55 386 110 400 T 220 400 T 330 400 T 440 400 T 550 400 T 660 400 T 770 400" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#155e75" opacity="0.6">
    <ellipse cx="200" cy="460" rx="90" ry="14"/>
    <ellipse cx="480" cy="440" rx="120" ry="16"/>
    <ellipse cx="640" cy="490" rx="80" ry="13"/>
    <ellipse cx="80" cy="500" rx="100" ry="14"/>
    <ellipse cx="360" cy="520" rx="110" ry="15"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 25 0; 0 0" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- Foam line -->
  <path d="M 0 402 L 800 402" stroke="#a5f3fc" stroke-width="3" opacity="0.5"/>
</svg>