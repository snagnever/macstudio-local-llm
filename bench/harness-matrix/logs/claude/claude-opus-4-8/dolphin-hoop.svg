<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A dolphin jumping through a hula hoop to bite a fish from a trainer's hand">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee3f5"/>
      <stop offset="1" stop-color="#e8f7fd"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9dd0"/>
      <stop offset="1" stop-color="#0f5f8a"/>
    </linearGradient>
    <linearGradient id="dolphinBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b95a8"/>
      <stop offset="1" stop-color="#4a6076"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="360" fill="url(#sky)"/>
  <circle cx="120" cy="90" r="70" fill="url(#sun)"/>

  <!-- Water -->
  <rect x="0" y="330" width="800" height="170" fill="url(#water)"/>
  <path d="M0 330 Q100 318 200 330 T400 330 T600 330 T800 330 V360 H0 Z" fill="#3fb0dc" opacity="0.6"/>

  <!-- Splash where the dolphin left the water -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M250 335 q10 -30 20 0 q10 -25 18 5 q8 -18 14 8 z"/>
    <circle cx="238" cy="322" r="5"/>
    <circle cx="292" cy="318" r="4"/>
    <circle cx="270" cy="308" r="3"/>
  </g>

  <!-- Hula hoop (back half, behind the dolphin) -->
  <ellipse cx="430" cy="215" rx="70" ry="95" fill="none" stroke="#e8503a" stroke-width="12"/>
  <ellipse cx="430" cy="215" rx="70" ry="95" fill="none" stroke="#f7d94a" stroke-width="12"
           stroke-dasharray="40 40"/>

  <!-- Dolphin, arcing up through the hoop toward the fish -->
  <g transform="rotate(-32 430 240)">
    <!-- body -->
    <path d="M300 300
             C320 250 380 220 445 222
             C500 224 545 210 570 190
             C548 214 512 232 462 240
             C520 246 556 262 566 300
             C548 276 512 262 470 262
             C430 300 360 322 300 300 Z"
          fill="url(#dolphinBody)" stroke="#3a4c5e" stroke-width="2"/>
    <!-- belly highlight -->
    <path d="M320 296 C360 282 420 276 460 262 C430 296 372 314 322 302 Z"
          fill="#e9f1f6" opacity="0.9"/>
    <!-- dorsal fin -->
    <path d="M400 236 C408 205 428 198 436 214 C424 220 412 230 404 240 Z"
          fill="#4a6076"/>
    <!-- tail flukes -->
    <path d="M300 300 C282 288 270 296 262 312 C280 308 292 306 302 306 Z"
          fill="#4a6076"/>
    <!-- pectoral fin -->
    <path d="M420 268 C410 292 396 300 384 300 C398 288 406 278 414 266 Z"
          fill="#3f546b"/>
    <!-- snout / open mouth reaching the fish -->
    <path d="M560 192 l22 -8 l-6 14 l-18 6 z" fill="#4a6076"/>
    <!-- eye -->
    <circle cx="520" cy="216" r="5" fill="#12242f"/>
    <circle cx="522" cy="214" r="1.6" fill="#fff"/>
  </g>

  <!-- Hula hoop (front half, in front of the dolphin's body) -->
  <path d="M360 215 a70 95 0 0 0 140 0" fill="none" stroke="#e8503a" stroke-width="12"/>
  <path d="M360 215 a70 95 0 0 0 140 0" fill="none" stroke="#f7d94a" stroke-width="12"
        stroke-dasharray="40 40"/>

  <!-- Trainer -->
  <g>
    <!-- head -->
    <circle cx="705" cy="150" r="22" fill="#f0c39b"/>
    <path d="M685 140 q20 -22 40 0 q-6 -10 -20 -10 q-14 0 -20 10 z" fill="#5a3a22"/>
    <!-- body / wetsuit -->
    <path d="M690 172 q15 -10 30 0 l10 90 h-50 z" fill="#1f6f8b"/>
    <!-- legs -->
    <rect x="690" y="258" width="14" height="70" rx="6" fill="#164f63"/>
    <rect x="710" y="258" width="14" height="70" rx="6" fill="#164f63"/>
    <!-- extended arm holding the fish out over the water -->
    <path d="M700 190 q-60 -6 -110 22" fill="none" stroke="#f0c39b" stroke-width="13"
          stroke-linecap="round"/>
    <!-- hand -->
    <circle cx="586" cy="214" r="9" fill="#f0c39b"/>
  </g>

  <!-- Fish in the trainer's hand, at the dolphin's mouth -->
  <g transform="translate(572 210) rotate(12)">
    <ellipse cx="0" cy="0" rx="18" ry="9" fill="#9bb3c4"/>
    <path d="M16 0 l14 -9 l0 18 z" fill="#7d99ab"/>
    <circle cx="-9" cy="-2" r="2.2" fill="#12242f"/>
  </g>
</svg>
