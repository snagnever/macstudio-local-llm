    <path d="M459 372 Q446 420 452 468" fill="none" stroke="#EDBB8C" stroke-width="10" stroke-linecap="round"/>
    <path d="M502 372 Q516 420 510 468" fill="none" stroke="#EDBB8C" stroke-width="10" stroke-linecap="round"/>
    <circle cx="452" cy="470" r="6.5" fill="#EDBB8C"/>
    <circle cx="510" cy="470" r="6.5" fill="#EDBB8C"/>
    <circle cx="480" cy="336" r="17" fill="#EDBB8C"/>
    <path d="M462 340 Q457 312 480 309 Q503 312 498 340 Q503 364 494 372 L491 340 Q480 331 469 340 L466 372 Q457 364 462 340 Z" fill="#6B3B24"/>
    <circle cx="474" cy="337" r="2" fill="#3A2A20"/>
    <circle cx="487" cy="337" r="2" fill="#3A2A20"/>
    <path d="M475 344 q5 5 10 0" fill="none" stroke="#8A5A44" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- CHILD 1 : boy running with an apple -->
  <g id="boy">
    <ellipse cx="690" cy="472" rx="21" ry="6" fill="#B9CADA" opacity="0.5"/>
    <path d="M683 432 L672 464" fill="none" stroke="#40669B" stroke-width="11" stroke-linecap="round"/>
    <path d="M695 432 L710 458" fill="none" stroke="#40669B" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="669" cy="467" rx="9" ry="4.5" fill="#C0392B"/>
    <ellipse cx="713" cy="460" rx="9" ry="4.5" fill="#C0392B"/>
    <path d="M676 400 Q690 394 704 400 L708 436 L672 436 Z" fill="#E2574C"/>
    <path d="M676 408 Q662 392 659 375" fill="none" stroke="#EDBB8C" stroke-width="9" stroke-linecap="round"/>
    <path d="M704 408 Q719 418 717 430" fill="none" stroke="#EDBB8C" stroke-width="9" stroke-linecap="round"/>
    <circle cx="658" cy="373" r="5.5" fill="#EDBB8C"/>
    <circle cx="718" cy="433" r="5.5" fill="#EDBB8C"/>
    <circle cx="721" cy="440" r="7" fill="#D94A3D"/>
    <path d="M721 433 q2 -5 6 -5" fill="none" stroke="#5C8B33" stroke-width="2"/>
    <rect x="685" y="390" width="10" height="10" fill="#EDBB8C"/>
    <circle cx="690" cy="380" r="15" fill="#EDBB8C"/>
    <path d="M675 378 Q676 361 690 360 Q705 361 705 378 Q697 368 690 370 Q682 372 675 378 Z" fill="#3E2C22"/>
    <circle cx="685" cy="381" r="1.8" fill="#3A2A20"/>
    <circle cx="695" cy="381" r="1.8" fill="#3A2A20"/>
    <path d="M685 388 q5 5 10 0" fill="none" stroke="#8A5A44" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- CHILD 2 : girl sitting on the tarp -->
