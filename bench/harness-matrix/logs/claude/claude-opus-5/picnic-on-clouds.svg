    <ellipse cx="822" cy="562" rx="42" ry="12" fill="#20406A" opacity="0.12"/>
    <path d="M808 532 Q826 552 852 552" fill="none" stroke="#EDBB8C" stroke-width="11" stroke-linecap="round"/>
    <path d="M820 532 Q838 556 858 562" fill="none" stroke="#EDBB8C" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="857" cy="551" rx="9" ry="5" fill="#F0C24A"/>
    <ellipse cx="863" cy="562" rx="9" ry="5" fill="#F0C24A"/>
