    <path d="M797 480 Q798 463 812 462 Q827 463 827 480 Q819 470 812 472 Q804 474 797 480 Z" fill="#7A4A2C"/>
    <circle cx="795" cy="486" r="7" fill="#7A4A2C"/>
    <circle cx="829" cy="486" r="7" fill="#7A4A2C"/>
    <circle cx="807" cy="483" r="1.8" fill="#3A2A20"/>
