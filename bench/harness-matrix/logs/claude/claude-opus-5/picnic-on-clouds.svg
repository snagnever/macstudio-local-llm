    <circle cx="330" cy="331" r="2" fill="#3A2A20"/>
    <circle cx="343" cy="331" r="2" fill="#3A2A20"/>
    <path d="M331 339 q5 5 10 0" fill="none" stroke="#8A5A44" stroke-width="1.8" stroke-linecap="round"/>
    <!-- crate he is carrying -->
    <g>
      <rect x="358" y="408" width="38" height="26" rx="3" fill="#C79552" stroke="#9A7133" stroke-width="2"/>
      <circle cx="368" cy="406" r="7" fill="#E2574C"/>
      <circle cx="381" cy="404" r="7" fill="#F2A03D"/>
      <circle cx="392" cy="407" r="6" fill="#7FC24A"/>
    </g>
  </g>

  <!-- PARENT 2 : mother spreading the tarp -->
  <g id="mom">
    <ellipse cx="480" cy="480" rx="28" ry="8" fill="#B9CADA" opacity="0.5"/>
    <ellipse cx="468" cy="474" rx="11" ry="5.5" fill="#7A4B2A"/>
    <ellipse cx="493" cy="474" rx="11" ry="5.5" fill="#7A4B2A"/>
    <rect x="462" y="440" width="12" height="32" rx="5" fill="#EDBB8C"/>
    <rect x="487" y="440" width="12" height="32" rx="5" fill="#EDBB8C"/>
    <path d="M456 398 L505 398 L514 448 L447 448 Z" fill="#E8705E"/>
