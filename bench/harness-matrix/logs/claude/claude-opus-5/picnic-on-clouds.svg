    <ellipse cx="350" cy="464" rx="12" ry="6" fill="#4A3728"/>
    <rect x="316" y="404" width="15" height="58" rx="7" fill="#39568A"/>
    <rect x="341" y="404" width="15" height="58" rx="7" fill="#39568A"/>
    <rect x="329" y="342" width="13" height="14" fill="#EDBB8C"/>
    <path d="M312 354 Q336 344 360 354 L366 412 L306 412 Z" fill="#2E9E8F"/>
    <path d="M328 348 L336 360 L344 348 L340 344 L332 344 Z" fill="#25867A"/>
    <path d="M316 364 Q292 380 266 398" fill="none" stroke="#EDBB8C" stroke-width="11" stroke-linecap="round"/>
    <path d="M356 364 Q376 382 374 404" fill="none" stroke="#EDBB8C" stroke-width="11" stroke-linecap="round"/>
    <circle cx="264" cy="400" r="7" fill="#EDBB8C"/>
    <circle cx="374" cy="406" r="7" fill="#EDBB8C"/>
    <circle cx="336" cy="330" r="18" fill="#EDBB8C"/>
