<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="A yellow rubber ducky floating on the soapy water of a bathtub">
  <title>Rubber ducky floating on a soapy bathtub</title>
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff0f6"/>
      <stop offset="1" stop-color="#bcdde9"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b8a8"/>
      <stop offset="1" stop-color="#a08d7c"/>
    </linearGradient>
    <pattern id="tiles" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#wallGrad)"/>
      <rect x="2" y="2" width="76" height="76" rx="6" fill="#eaf7fb" opacity="0.55"/>
    </pattern>
    <linearGradient id="tubGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd9de"/>
      <stop offset="0.18" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f2f6f8"/>
      <stop offset="1" stop-color="#c4d0d6"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe5ea"/>
    </linearGradient>
    <radialGradient id="waterGrad" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#bfe6f2"/>
      <stop offset="1" stop-color="#6fb8d6"/>
    </radialGradient>
    <radialGradient id="duckBody" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#fff08a"/>
      <stop offset="0.55" stop-color="#ffd52e"/>
      <stop offset="1" stop-color="#e8ab00"/>
    </radialGradient>
    <radialGradient id="duckHead" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.6" stop-color="#ffd930"/>
      <stop offset="1" stop-color="#eeb203"/>
    </radialGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa22b"/>
      <stop offset="1" stop-color="#e8730c"/>
    </linearGradient>
    <radialGradient id="foamGrad" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcecf3"/>
    </radialGradient>
    <radialGradient id="bubbleGrad" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#d9f1fb" stop-opacity="0.35"/>
      <stop offset="0.88" stop-color="#a8dcf0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d9aa2"/>
      <stop offset="0.35" stop-color="#eef3f5"/>
      <stop offset="0.7" stop-color="#b6c2c8"/>
      <stop offset="1" stop-color="#7d8b93"/>
    </linearGradient>
    <clipPath id="waterClip">
      <ellipse cx="400" cy="276" rx="288" ry="26"/>
    </clipPath>
  </defs>

  <!-- wall and floor -->
  <rect x="0" y="0" width="800" height="430" fill="url(#tiles)"/>
  <rect x="0" y="430" width="800" height="170" fill="url(#floorGrad)"/>
  <rect x="0" y="424" width="800" height="12" fill="#e8eff2"/>

  <!-- faucet on the wall -->
  <g>
    <rect x="618" y="150" width="26" height="70" rx="8" fill="url(#chromeGrad)"/>
    <path d="M631 158 q 0 -46 -52 -46 q -34 0 -34 34 l 0 22" fill="none" stroke="url(#chromeGrad)" stroke-width="16" stroke-linecap="round"/>
    <rect x="536" y="164" width="18" height="16" rx="4" fill="#9fb0b8"/>
    <ellipse cx="586" cy="230" rx="30" ry="9" fill="#b9c6cc"/>
    <circle cx="586" cy="228" r="12" fill="url(#chromeGrad)"/>
  </g>

  <!-- bathtub body -->
  <path d="M96 268 L96 420 Q96 502 200 502 L600 502 Q704 502 704 420 L704 268 Z" fill="url(#tubGrad)" stroke="#a9b8c0" stroke-width="3"/>
  <!-- clawfoot legs -->
  <g fill="#cfd9de" stroke="#9fb0b8" stroke-width="2">
    <path d="M176 486 q -14 26 -30 34 q -6 4 0 8 l 54 0 q 8 -2 4 -10 q -12 -12 -12 -32 Z"/>
    <path d="M624 486 q 14 26 30 34 q 6 4 0 8 l -54 0 q -8 -2 -4 -10 q 12 -12 12 -32 Z"/>
  </g>
  <!-- tub rim -->
  <ellipse cx="400" cy="268" rx="308" ry="36" fill="url(#rimGrad)" stroke="#a9b8c0" stroke-width="3"/>
  <ellipse cx="400" cy="272" rx="288" ry="27" fill="#e3edf1" stroke="#b7c6cd" stroke-width="2"/>

  <!-- soapy water -->
  <ellipse cx="400" cy="276" rx="288" ry="26" fill="url(#waterGrad)"/>
  <g clip-path="url(#waterClip)" opacity="0.55">
    <path d="M120 268 q 60 10 120 0 t 120 0 t 120 0 t 120 0" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M120 288 q 60 -10 120 0 t 120 0 t 120 0 t 120 0" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
  <!-- duck reflection -->
  <ellipse cx="390" cy="288" rx="66" ry="12" fill="#f2c400" opacity="0.35"/>

  <!-- rubber ducky -->
  <g>
    <!-- tail -->
    <path d="M318 226 q -34 -30 -44 -46 q 24 6 52 26 Z" fill="#f6c40d" stroke="#d79c00" stroke-width="2"/>
    <!-- body -->
    <ellipse cx="386" cy="240" rx="82" ry="56" fill="url(#duckBody)" stroke="#d79c00" stroke-width="2"/>
    <!-- neck + head -->
    <path d="M424 208 q 6 -34 34 -46 q 30 -12 44 12 q -18 44 -44 56 Z" fill="url(#duckHead)"/>
    <circle cx="466" cy="176" r="41" fill="url(#duckHead)" stroke="#d79c00" stroke-width="2"/>
    <!-- beak -->
    <path d="M500 168 q 44 -6 44 12 q 0 16 -44 12 q -8 -12 0 -24 Z" fill="url(#beakGrad)" stroke="#c9620a" stroke-width="2"/>
    <path d="M502 182 q 22 3 42 0" fill="none" stroke="#c9620a" stroke-width="2" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="478" cy="163" r="6.5" fill="#2c2116"/>
    <circle cx="480.5" cy="160.5" r="2.4" fill="#ffffff"/>
    <!-- cheek -->
    <ellipse cx="462" cy="190" rx="11" ry="7" fill="#ffb0a0" opacity="0.55"/>
    <!-- wing -->
    <path d="M348 232 q 40 -18 74 6 q -22 34 -60 26 q -18 -6 -14 -32 Z" fill="#ffe36a" stroke="#d79c00" stroke-width="2" opacity="0.95"/>
    <!-- highlight -->
    <ellipse cx="356" cy="212" rx="26" ry="12" fill="#fffbe0" opacity="0.5" transform="rotate(-18 356 212)"/>
    <ellipse cx="452" cy="152" rx="14" ry="8" fill="#fffbe0" opacity="0.55" transform="rotate(-24 452 152)"/>
  </g>

  <!-- foam on the water, drawn over the duck waterline -->
  <g fill="url(#foamGrad)">
    <circle cx="150" cy="272" r="24"/>
    <circle cx="186" cy="282" r="18"/>
    <circle cx="216" cy="268" r="26"/>
    <circle cx="252" cy="282" r="20"/>
    <circle cx="286" cy="270" r="24"/>
    <circle cx="320" cy="284" r="19"/>
    <circle cx="352" cy="288" r="16"/>
    <circle cx="392" cy="292" r="15"/>
    <circle cx="430" cy="286" r="20"/>
    <circle cx="466" cy="276" r="26"/>
    <circle cx="504" cy="286" r="20"/>
    <circle cx="540" cy="270" r="25"/>
    <circle cx="576" cy="284" r="18"/>
    <circle cx="608" cy="270" r="24"/>
    <circle cx="642" cy="280" r="17"/>
  </g>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="144" cy="264" r="8"/>
    <circle cx="210" cy="258" r="9"/>
    <circle cx="282" cy="262" r="7"/>
    <circle cx="462" cy="266" r="8"/>
    <circle cx="536" cy="260" r="9"/>
    <circle cx="604" cy="262" r="7"/>
  </g>

  <!-- floating soap bubbles -->
  <g>
    <circle cx="196" cy="176" r="26" fill="url(#bubbleGrad)"/>
    <circle cx="188" cy="167" r="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="268" cy="112" r="17" fill="url(#bubbleGrad)"/>
    <circle cx="263" cy="106" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="330" cy="168" r="12" fill="url(#bubbleGrad)"/>
    <circle cx="560" cy="106" r="22" fill="url(#bubbleGrad)"/>
    <circle cx="553" cy="98" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="628" cy="160" r="14" fill="url(#bubbleGrad)"/>
    <circle cx="676" cy="212" r="19" fill="url(#bubbleGrad)"/>
    <circle cx="670" cy="205" r="4.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="120" cy="120" r="13" fill="url(#bubbleGrad)"/>
    <circle cx="404" cy="86" r="15" fill="url(#bubbleGrad)"/>
  </g>

  <!-- bar of soap on the rim -->
  <g>
    <rect x="120" y="236" width="70" height="26" rx="12" fill="#f2b9d8" stroke="#d68cba" stroke-width="2"/>
    <ellipse cx="150" cy="242" rx="20" ry="6" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
