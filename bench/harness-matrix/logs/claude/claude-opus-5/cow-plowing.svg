    <path d="M 130,490 l 0,-10 M 136,490 l 4,-8 M 124,490 l -4,-8"/>
    <path d="M 214,496 l 0,-11 M 220,496 l 4,-9 M 208,496 l -4,-9"/>
    <path d="M 520,492 l 0,-10 M 526,492 l 4,-8 M 514,492 l -4,-8"/>
    <path d="M 566,486 l 0,-9 M 572,486 l 4,-7 M 560,486 l -4,-7"/>
    <path d="M 92,470 l 0,-8 M 97,470 l 3,-7 M 87,470 l -3,-7"/>
    <path d="M 640,466 l 0,-8 M 645,466 l 3,-7 M 635,466 l -3,-7"/>
