<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <title>A cow plowing a field</title>
  <desc>Side view of a black-and-white cow harnessed to a walking plow, turning a furrow across a stubble field while a farmer steers the handles.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec4e8"/>
      <stop offset="0.55" stop-color="#bee2f2"/>
      <stop offset="1" stop-color="#eef7f7"/>
    </linearGradient>
    <linearGradient id="stubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ded0a0"/>
      <stop offset="0.35" stop-color="#d3bd79"/>
      <stop offset="1" stop-color="#c2a75f"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4230"/>
      <stop offset="1" stop-color="#3b2a1c"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c1c9"/>
      <stop offset="1" stop-color="#697180"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M 266,352 C 296,328 404,322 448,340 C 476,352 480,392 470,420 C 462,443 436,447 404,445 C 352,451 302,449 278,437 C 260,428 250,382 266,352 Z"/>
    </clipPath>
  </defs>

  <!-- ============ SKY ============ -->
