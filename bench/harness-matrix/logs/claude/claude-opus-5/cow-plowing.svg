    <rect x="752" y="492" width="28" height="13" rx="4" fill="#4a3a2c"/>
    <!-- arms to the handles -->
    <path d="M 772,388 L 750,392" fill="none" stroke="#c0503c" stroke-width="11" stroke-linecap="round"/>
    <path d="M 776,398 L 762,404" fill="none" stroke="#a94533" stroke-width="11" stroke-linecap="round"/>
    <circle cx="748" cy="392" r="6.5" fill="#dfa274"/>
    <circle cx="761" cy="404" r="6.5" fill="#c98f66"/>
    <!-- head -->
    <circle cx="772" cy="356" r="15" fill="#e6ac7c" stroke="#c08a5c" stroke-width="2"/>
    <path d="M 762,362 C 766,368 776,368 782,364" fill="none" stroke="#a8724a" stroke-width="2" stroke-linecap="round"/>
