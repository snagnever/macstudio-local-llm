    <ellipse cx="556" cy="590" rx="24" ry="12" transform="rotate(4 556 590)"/>
    <ellipse cx="700" cy="560" rx="18" ry="10" transform="rotate(-6 700 560)"/>
    <ellipse cx="850" cy="592" rx="22" ry="11" transform="rotate(8 850 592)"/>
