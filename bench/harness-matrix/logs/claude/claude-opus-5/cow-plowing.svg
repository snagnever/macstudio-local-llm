    <g fill="#3a332e">
      <rect x="256" y="490" width="20" height="14" rx="4"/>
      <rect x="448" y="490" width="20" height="14" rx="4"/>
    </g>

    <!-- tail -->
    <path d="M 468,350 C 494,368 500,412 488,446" fill="none" stroke="#f1eee7" stroke-width="8" stroke-linecap="round"/>
    <path d="M 488,442 C 496,452 494,466 486,472 C 478,466 478,452 488,442 Z" fill="#2f2b28"/>

    <!-- body -->
    <path d="M 266,352 C 296,328 404,322 448,340 C 476,352 480,392 470,420 C 462,443 436,447 404,445 C 352,451 302,449 278,437 C 260,428 250,382 266,352 Z" fill="#f7f5ef" stroke="#2f2b28" stroke-width="2.5" stroke-linejoin="round"/>

