    <!-- far leg -->
    <path d="M 798,432 L 806,470 L 812,500" fill="none" stroke="#35507d" stroke-width="14" stroke-linecap="round"/>
    <rect x="800" y="494" width="26" height="12" rx="4" fill="#3b2f22"/>
