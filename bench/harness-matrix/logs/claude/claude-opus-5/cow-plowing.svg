      <path d="M 299,420 L 309,462 L 303,494"/>
      <path d="M 441,420 L 433,461 L 443,494"/>
      <path d="M 423,422 L 415,460 L 425,494"/>
    </g>
    <g fill="#2f2b28" stroke="#211d1a" stroke-width="1.5">
      <rect x="284" y="489" width="22" height="16" rx="4"/>
      <rect x="424" y="489" width="22" height="16" rx="4"/>
