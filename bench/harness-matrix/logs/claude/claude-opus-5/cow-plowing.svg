    <ellipse cx="780" cy="497" rx="18" ry="10" transform="rotate(-6 780 497)"/>
    <ellipse cx="828" cy="500" rx="14" ry="8" transform="rotate(10 828 500)"/>
    <ellipse cx="870" cy="494" rx="16" ry="9" transform="rotate(-5 870 494)"/>
  </g>

