    <!-- neck -->
    <path d="M 268,342 C 246,344 218,350 206,358 C 200,378 202,400 210,414 C 236,424 258,426 274,422 Z" fill="#f7f5ef" stroke="#2f2b28" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- head -->
    <path d="M 210,350 C 236,350 242,376 232,400 C 224,420 198,428 176,420 C 156,412 144,398 149,382 C 155,362 182,348 210,350 Z" fill="#f7f5ef" stroke="#2f2b28" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 210,350 C 232,350 240,368 236,386 C 224,382 208,376 200,362 C 198,356 202,350 210,350 Z" fill="#2f2b28"/>
    <!-- muzzle -->
    <ellipse cx="163" cy="402" rx="21" ry="16" transform="rotate(-16 163 402)" fill="#eeb0a8" stroke="#c98f88" stroke-width="2"/>
    <ellipse cx="156" cy="396" rx="3.6" ry="5" transform="rotate(-16 156 396)" fill="#5d3f3b"/>
    <ellipse cx="170" cy="408" rx="3.2" ry="4.4" transform="rotate(-16 170 408)" fill="#5d3f3b"/>
    <path d="M 148,410 C 158,418 172,418 180,412" fill="none" stroke="#c98f88" stroke-width="2" stroke-linecap="round"/>
    <!-- eye -->
    <ellipse cx="196" cy="372" rx="7" ry="8" fill="#2b2320"/>
    <circle cx="198.5" cy="369" r="2.4" fill="#ffffff"/>
    <path d="M 186,362 C 192,357 202,357 207,361" fill="none" stroke="#2f2b28" stroke-width="2" stroke-linecap="round"/>
    <!-- ears -->
