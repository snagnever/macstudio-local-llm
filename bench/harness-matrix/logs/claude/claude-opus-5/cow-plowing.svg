  <circle cx="762" cy="74" r="86" fill="url(#sunglow)"/>
  <circle cx="762" cy="74" r="34" fill="#ffe27a"/>
  <circle cx="762" cy="74" r="28" fill="#fff3b8"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
