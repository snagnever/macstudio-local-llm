    <path d="M 0,352 C 250,346 630,356 900,348" stroke-width="2.3" stroke-dasharray="7 15"/>
    <path d="M 0,382 C 250,375 640,388 900,378" stroke-width="2.6" stroke-dasharray="9 18"/>
    <path d="M 0,418 C 250,410 640,424 900,412" stroke-width="3" stroke-dasharray="11 21"/>
    <path d="M 0,462 C 250,452 640,468 900,456" stroke-width="3.4" stroke-dasharray="13 25"/>
