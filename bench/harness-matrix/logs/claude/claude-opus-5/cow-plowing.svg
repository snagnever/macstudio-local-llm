    <path d="M 352,96 q 8,-7 16,0 q 8,-7 16,0"/>
    <path d="M 262,110 q 7,-6 14,0 q 7,-6 14,0"/>
    <path d="M 630,110 q 9,-8 18,0 q 9,-8 18,0"/>
