      <circle cx="-13" cy="-7" r="6" fill="#f4f4f0"/>
      <path d="M -18,-7 L -27,-5 L -18,-3 Z" fill="#e8a020"/>
      <circle cx="-14" cy="-8" r="1.4" fill="#222"/>
      <path d="M 4,-3 L 16,-9 L 12,0 Z" fill="#c9cbc4"/>
