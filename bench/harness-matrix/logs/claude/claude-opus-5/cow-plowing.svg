  <g fill="none" stroke="#2f2116" stroke-width="3.5" stroke-linecap="round" opacity="0.7">
    <path d="M 0,524 C 200,516 420,530 620,520 C 760,513 840,524 900,518"/>
    <path d="M 0,552 C 200,542 430,558 640,546 C 770,539 850,550 900,544"/>
