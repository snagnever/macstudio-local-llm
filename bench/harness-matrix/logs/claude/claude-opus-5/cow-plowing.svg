      <circle cx="-13" cy="-7" r="6" fill="#f4f4f0"/>
      <path d="M -18,-7 L -27,-5 L -18,-3 Z" fill="#e8a020"/>
      <circle cx="-14" cy="-8" r="1.4" fill="#222"/>
      <path d="M 4,-3 L 16,-9 L 12,0 Z" fill="#c9cbc4"/>
      <path d="M -4,7 L -5,15 M 4,7 L 5,15" stroke="#e8a020" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============ SHADOWS ============ -->
  <ellipse cx="368" cy="503" rx="140" ry="13" fill="#3a2a1c" opacity="0.22"/>
  <ellipse cx="672" cy="505" rx="60" ry="10" fill="#3a2a1c" opacity="0.2"/>
  <ellipse cx="788" cy="504" rx="40" ry="9" fill="#3a2a1c" opacity="0.2"/>

  <!-- ============ COW ============ -->
  <g id="cow">
    <!-- far legs -->
