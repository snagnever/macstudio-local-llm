<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600">
  <title>Half-buried barrel of treasure</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5f88"/>
      <stop offset="0.5" stop-color="#7fc0dc"/>
      <stop offset="1" stop-color="#ffe0b0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#175f80"/>
      <stop offset="1" stop-color="#54abc9"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d9a6"/>
      <stop offset="0.35" stop-color="#e3c286"/>
      <stop offset="1" stop-color="#cfa262"/>
    </linearGradient>
    <linearGradient id="dune" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f9e7bd"/>
      <stop offset="0.4" stop-color="#e8c88c"/>
      <stop offset="1" stop-color="#bd8c4b"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.45" stop-color="#f2c519"/>
      <stop offset="1" stop-color="#a97906"/>
    </radialGradient>
    <radialGradient id="goldpile" cx="0.45" cy="0.15" r="0.95">
      <stop offset="0" stop-color="#f4cf3f"/>
      <stop offset="0.6" stop-color="#c9970f"/>
      <stop offset="1" stop-color="#7d5c05"/>
    </radialGradient>
    <radialGradient id="inside" cx="0.5" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#2b1809"/>
      <stop offset="1" stop-color="#110903"/>
    </radialGradient>
    <linearGradient id="hoop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9aa6"/>
      <stop offset="0.4" stop-color="#5b5b66"/>
      <stop offset="1" stop-color="#2f2f37"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b3617"/>
      <stop offset="0.35" stop-color="#9a6634"/>
      <stop offset="0.7" stop-color="#7d4d24"/>
      <stop offset="1" stop-color="#4e2e13"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff8d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sandveil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c88c" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#e8c88c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d9b271" stop-opacity="1"/>
    </linearGradient>

    <g id="coin">
      <ellipse cx="0" cy="0" rx="15" ry="12.5" fill="url(#gold)" stroke="#6d4d05" stroke-width="1.8"/>
      <ellipse cx="0" cy="-0.5" rx="9" ry="7" fill="none" stroke="#8a6508" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="2.2" fill="#8a6508"/>
      <ellipse cx="-4.5" cy="-4.5" rx="4" ry="2.6" fill="#fff8d0" opacity="0.85"/>
    </g>
    <!-- a coin standing on its edge, tilted -->
    <g id="coinup">
      <ellipse cx="0" cy="0" rx="5" ry="14" fill="url(#gold)" stroke="#6d4d05" stroke-width="1.6"/>
      <ellipse cx="-1.4" cy="0" rx="2" ry="10" fill="#fff2ad" opacity="0.6"/>
    </g>
    <g id="sparkle" fill="#fffbe6">
      <path d="M0 -12 L2.6 -2.6 L12 0 L2.6 2.6 L0 12 L-2.6 2.6 L-12 0 L-2.6 -2.6 Z"/>
    </g>
    <g id="gemR">
      <path d="M-14 -5 L0 -16 L14 -5 L0 18 Z" fill="#e0245e" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>
      <path d="M0 -16 L-6 -5 L0 18 L6 -5 Z" fill="#ff7aa2" fill-opacity="0.55"/>
      <path d="M-14 -5 L14 -5" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
    </g>
    <g id="gemB">
      <path d="M-14 -5 L0 -16 L14 -5 L0 18 Z" fill="#2472d8" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>
      <path d="M0 -16 L-6 -5 L0 18 L6 -5 Z" fill="#7fb4ff" fill-opacity="0.55"/>
      <path d="M-14 -5 L14 -5" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
    </g>
    <g id="gemG">
      <path d="M-14 -5 L0 -16 L14 -5 L0 18 Z" fill="#1fa85c" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>
      <path d="M0 -16 L-6 -5 L0 18 L6 -5 Z" fill="#7ff0b0" fill-opacity="0.55"/>
      <path d="M-14 -5 L14 -5" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
    </g>
  </defs>

  <!-- ================= SKY ================= -->
  <rect x="0" y="0" width="800" height="212" fill="url(#sky)"/>
  <circle cx="152" cy="76" r="96" fill="url(#sunglow)"/>
  <circle cx="152" cy="76" r="32" fill="#fff8d0"/>
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="430" cy="52" rx="66" ry="17"/>
    <ellipse cx="476" cy="42" rx="44" ry="20"/>
    <ellipse cx="392" cy="46" rx="34" ry="14"/>
    <ellipse cx="690" cy="88" rx="56" ry="14"/>
    <ellipse cx="722" cy="80" rx="34" ry="15"/>
  </g>
  <g fill="none" stroke="#3b4a52" stroke-width="2.4" stroke-linecap="round">
    <path d="M604 44 q11 -10 22 0 q11 -10 22 0"/>
    <path d="M556 74 q8 -7 16 0 q8 -7 16 0"/>
  </g>

  <!-- ================= SEA ================= -->
  <rect x="0" y="212" width="800" height="54" fill="url(#sea)"/>
  <g stroke="#e2f6ff" stroke-width="2.6" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M44 228 q14 -6 28 0"/><path d="M190 238 q14 -6 28 0"/>
    <path d="M340 224 q14 -6 28 0"/><path d="M520 242 q14 -6 28 0"/>
    <path d="M676 230 q14 -6 28 0"/><path d="M600 252 q16 -6 32 0"/>
    <path d="M118 254 q16 -6 32 0"/>
  </g>
  <path d="M0 262 q60 12 122 3 q72 -10 142 5 q82 13 162 0 q82 -13 162 3 q72 12 142 -3 q36 -7 70 1 v16 H0 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M0 272 q80 10 162 1 q80 -9 160 6 q80 12 162 -3 q80 -11 160 4 q78 10 156 -5 v18 H0 Z" fill="#f2e3c4" opacity="0.85"/>

  <!-- ================= BEACH ================= -->
  <rect x="0" y="284" width="800" height="316" fill="url(#sand)"/>
  <g fill="none" stroke="#cba36a" stroke-width="2" opacity="0.3">
    <path d="M-10 316 q140 -12 280 -2 q150 10 300 -6 q120 -12 240 2"/>
    <path d="M-10 344 q160 12 320 0 q160 -12 320 6 q100 10 180 -4"/>
  </g>
  <!-- low mound behind the barrel -->
  <path d="M120 400 q120 -50 280 -46 q170 4 280 46 q-140 26 -280 26 q-140 0 -280 -26 Z" fill="#e9cd97" opacity="0.85"/>

  <!-- barrel's cast shadow (sun upper-left, shadow to the right) -->
  <ellipse cx="560" cy="430" rx="230" ry="44" fill="#b1813f" opacity="0.3"/>

  <!-- ================= BARREL LID, half sunk to the right (behind the dune) ================= -->
  <g transform="translate(688 404) rotate(18)">
    <ellipse cx="0" cy="9" rx="66" ry="21" fill="#4a2c13" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="66" ry="21" fill="#7d4d24" stroke="#3f2410" stroke-width="2"/>
    <g stroke="#5b3517" stroke-width="1.6" fill="none">
      <path d="M-64 -6 L64 -6"/><path d="M-66 2 L66 2"/><path d="M-58 10 L58 10"/>
    </g>
    <ellipse cx="0" cy="-1" rx="34" ry="10" fill="none" stroke="#5b3517" stroke-width="2"/>
    <circle cx="0" cy="-1" r="4" fill="#5b3517"/>
  </g>

  <!-- ================= BARREL (tilted; lower half sunk in the sand) ================= -->
  <g transform="rotate(-12 390 400)">
    <path d="M254 260 L288 289 L322 298 L356 303 L390 304 L424 303 L458 298 L492 289 L526 260
             Q555 420 520 570 L260 570 Q225 420 254 260 Z" fill="url(#wood)"/>
    <g stroke="#3f2410" stroke-width="1.6">
      <path d="M254 260 Q225 420 260 570 L292 570 Q266 420 288 289 Z" fill="#5d3818"/>
      <path d="M288 289 Q266 420 292 570 L325 570 Q307 420 322 298 Z" fill="#774922"/>
      <path d="M322 298 Q307 420 325 570 L357 570 Q348 420 356 303 Z" fill="#8d5a2b"/>
      <path d="M356 303 Q348 420 357 570 L390 570 Q390 420 390 304 Z" fill="#9c6733"/>
      <path d="M390 304 Q390 420 390 570 L422 570 Q431 420 424 303 Z" fill="#93602f"/>
      <path d="M424 303 Q431 420 422 570 L455 570 Q472 420 458 298 Z" fill="#83532a"/>
      <path d="M458 298 Q472 420 455 570 L487 570 Q513 420 492 289 Z" fill="#6e4420"/>
      <path d="M492 289 Q513 420 487 570 L520 570 Q555 420 526 260 Z" fill="#563317"/>
    </g>
    <g stroke="#3f2410" stroke-width="1.1" opacity="0.35" fill="none">
      <path d="M300 320 Q282 430 296 520"/>
      <path d="M340 316 Q330 430 338 520"/>
      <path d="M404 316 Q404 430 404 520"/>
      <path d="M444 318 Q452 430 442 520"/>
      <path d="M500 322 Q520 430 500 520"/>
    </g>
    <!-- sunlit side (light from upper left) -->
    <path d="M300 300 Q286 420 302 540 L344 540 Q334 420 340 306 Z" fill="#ffe0a8" opacity="0.16"/>
    <!-- iron hoops -->
    <g>
      <path d="M248 320 Q390 352 532 320" fill="none" stroke="url(#hoop)" stroke-width="19"/>
      <path d="M248 320 Q390 352 532 320" fill="none" stroke="#c3c3ce" stroke-width="3.2" opacity="0.6"/>
      <path d="M239 400 Q390 436 541 400" fill="none" stroke="url(#hoop)" stroke-width="21"/>
      <path d="M239 400 Q390 436 541 400" fill="none" stroke="#c3c3ce" stroke-width="3.2" opacity="0.6"/>
      <path d="M248 490 Q390 524 532 490" fill="none" stroke="url(#hoop)" stroke-width="19"/>
    </g>
    <g fill="#8f8f9c">
      <circle cx="270" cy="410" r="3"/><circle cx="330" cy="424" r="3"/>
      <circle cx="390" cy="428" r="3"/><circle cx="450" cy="424" r="3"/>
      <circle cx="512" cy="410" r="3"/>
    </g>

    <!-- open mouth -->
    <ellipse cx="390" cy="260" rx="136" ry="44" fill="#8a5729" stroke="#3f2410" stroke-width="2.4"/>
    <ellipse cx="390" cy="258" rx="127" ry="39" fill="#6d4220"/>
    <ellipse cx="390" cy="260" rx="119" ry="34" fill="url(#inside)"/>
    <path d="M254 260 a136 44 0 0 0 272 0" fill="none" stroke="url(#hoop)" stroke-width="10"/>
    <path d="M254 260 a136 44 0 0 1 272 0" fill="none" stroke="#4c4c56" stroke-width="7" opacity="0.85"/>

    <!-- heaped treasure filling the front of the mouth; back interior stays dark -->
    <path d="M272 258
             C 292 236 318 246 342 240
             C 366 234 388 246 412 238
             C 438 230 466 250 488 244
             C 500 241 505 250 508 258
             Q 390 326 272 258 Z" fill="url(#goldpile)"/>
    <g>
      <use xlink:href="#coin" href="#coin" transform="translate(306 264) rotate(-14) scale(1.05)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(346 270) rotate(8)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(388 274) rotate(-6) scale(1.1)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(430 272) rotate(16)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(470 264) rotate(-10) scale(1.05)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(328 248) rotate(20) scale(0.9)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(366 252) rotate(-18) scale(0.95)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(406 250) rotate(10) scale(0.92)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(450 248) rotate(-22) scale(0.88)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(388 236) rotate(4) scale(0.78)"/>
      <use xlink:href="#coinup" href="#coinup" transform="translate(350 240) rotate(-16)"/>
      <use xlink:href="#coinup" href="#coinup" transform="translate(430 238) rotate(14)"/>
    </g>
    <!-- gems nested in the heap, kept below the back rim -->
    <g>
      <use xlink:href="#gemR" href="#gemR" transform="translate(314 248) rotate(-10) scale(0.82)"/>
      <use xlink:href="#gemB" href="#gemB" transform="translate(470 246) rotate(12) scale(0.8)"/>
      <use xlink:href="#gemG" href="#gemG" transform="translate(408 242) rotate(-4) scale(0.72)"/>
    </g>
    <!-- pearl necklace draped over the front lip -->
    <path d="M300 262 q-16 26 -12 48 q3 18 20 26" fill="none" stroke="#cbbda2" stroke-width="2" opacity="0.8"/>
    <g fill="#fffaf0" stroke="#cdbfa6" stroke-width="0.9">
      <circle cx="302" cy="260" r="5.2"/><circle cx="294" cy="272" r="5.2"/>
      <circle cx="289" cy="285" r="5.2"/><circle cx="288" cy="298" r="5.2"/>
      <circle cx="291" cy="311" r="5.2"/><circle cx="298" cy="322" r="5.2"/>
      <circle cx="309" cy="330" r="5.2"/>
    </g>
    <!-- coins tumbling over the lip and down the barrel face -->
    <g>
      <use xlink:href="#coin" href="#coin" transform="translate(340 296) rotate(-24) scale(0.98)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(322 334) rotate(30) scale(0.94)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(352 362) rotate(-12) scale(0.9)"/>
      <use xlink:href="#coinup" href="#coinup" transform="translate(306 372) rotate(46)"/>
      <use xlink:href="#coin" href="#coin" transform="translate(330 400) rotate(18) scale(0.92)"/>
    </g>
  </g>

  <!-- ================= SAND THAT BURIES THE BARREL ================= -->
  <!-- contact shadow hugging the wood, drawn just under the sand line -->
  <path d="M233 446 Q400 506 556 378" fill="none" stroke="#8c6230" stroke-width="16" opacity="0.3"/>
  <path d="M-10 470 C 60 462, 150 456, 233 452
           Q 400 512 556 384
           C 640 400, 720 420, 810 428 V600 H-10 Z" fill="url(#dune)"/>
  <path d="M-10 470 C 60 462, 150 456, 233 452 Q 400 512 556 384 C 640 400, 720 420, 810 428"
        fill="none" stroke="#fbf0d2" stroke-width="3.5" opacity="0.9"/>
  <!-- sand tongues heaped against the wood -->
  <path d="M214 454 q30 -22 66 -26 q-10 16 -26 30 q-20 4 -40 -4 Z" fill="#eed3a0" opacity="0.85"/>
  <path d="M544 390 q32 -10 68 8 q-34 8 -68 6 Z" fill="#eed3a0" opacity="0.85"/>
  <!-- sand ripples on the dune -->
  <g fill="none" stroke="#c69a5c" stroke-width="2.2" opacity="0.35">
    <path d="M20 512 q110 -22 210 -6"/>
    <path d="M60 552 q140 -24 270 -4"/>
    <path d="M470 452 q120 -18 230 4"/>
    <path d="M420 518 q160 -20 300 6"/>
    <path d="M140 588 q170 -22 320 2"/>
  </g>

  <!-- ================= SPILLED TREASURE ON THE SAND ================= -->
  <g>
    <use xlink:href="#coin" href="#coin" transform="translate(206 476) rotate(14)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(252 500) rotate(-22)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(172 518) rotate(30)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(300 522) rotate(-8) scale(1.06)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(226 544) rotate(18)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(114 492) rotate(-16) scale(0.94)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(352 552) rotate(24) scale(1.08)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(146 568) rotate(-30)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(272 576) rotate(10) scale(1.1)"/>
    <use xlink:href="#coinup" href="#coinup" transform="translate(330 490) rotate(-14)"/>
    <use xlink:href="#coinup" href="#coinup" transform="translate(192 552) rotate(10)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(596 470) rotate(-12) scale(0.96)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(648 500) rotate(20)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(578 534) rotate(-26) scale(1.05)"/>
    <use xlink:href="#coinup" href="#coinup" transform="translate(632 556) rotate(16)"/>
    <use xlink:href="#coin" href="#coin" transform="translate(700 566) rotate(8)"/>
  </g>
  <!-- a few coins half sunk: sand lipping over their lower edge -->
  <g fill="#e6c68a">
    <path d="M158 520 a15 12.5 0 0 0 30 2 q-14 10 -30 -2 Z"/>
    <path d="M258 578 a16 13 0 0 0 32 2 q-15 10 -32 -2 Z"/>
    <path d="M100 494 a15 12 0 0 0 29 2 q-13 10 -29 -2 Z"/>
    <path d="M564 536 a16 13 0 0 0 31 2 q-14 10 -31 -2 Z"/>
  </g>

  <!-- gold goblet toppled in the sand -->
  <g transform="translate(706 494) rotate(-28) scale(1.45)">
    <path d="M-16 -8 q16 30 32 0 Z" fill="url(#gold)" stroke="#6d4d05" stroke-width="1.4"/>
    <ellipse cx="0" cy="-8" rx="16" ry="5" fill="#ffeea0" stroke="#6d4d05" stroke-width="1.4"/>
    <rect x="-2.6" y="12" width="5.2" height="12" fill="#dfae21" stroke="#6d4d05" stroke-width="1.1"/>
    <ellipse cx="0" cy="25" rx="12" ry="4" fill="url(#gold)" stroke="#6d4d05" stroke-width="1.4"/>
  </g>

  <!-- gold crown in the sand at the left -->
  <g transform="translate(96 546) rotate(-8) scale(1.25)">
    <path d="M-34 8 L-34 -12 L-20 2 L-10 -18 L0 2 L10 -18 L20 2 L34 -12 L34 8 Z"
          fill="url(#gold)" stroke="#6d4d05" stroke-width="1.8"/>
    <rect x="-34" y="6" width="68" height="9" rx="3" fill="#e5b71f" stroke="#6d4d05" stroke-width="1.6"/>
    <circle cx="-20" cy="10" r="2.6" fill="#e0245e"/>
    <circle cx="0" cy="10" r="2.6" fill="#2472d8"/>
    <circle cx="20" cy="10" r="2.6" fill="#1fa85c"/>
  </g>
  <path d="M54 558 q44 18 90 2 q-10 16 -46 16 q-40 0 -44 -18 Z" fill="#dcb474" opacity="0.75"/>

  <!-- loose gems in the sand -->
  <use xlink:href="#gemR" href="#gemR" transform="translate(410 540) rotate(6) scale(1.05)"/>
  <use xlink:href="#gemB" href="#gemB" transform="translate(486 578) rotate(-10)"/>
  <use xlink:href="#gemG" href="#gemG" transform="translate(548 462) rotate(14) scale(0.9)"/>

  <!-- shells and starfish at the sand edges -->
  <g transform="translate(58 456) scale(1.2)">
    <path d="M0 0 q-18 -24 0 -28 q18 4 0 28 Z" fill="#fdece0" stroke="#d8b49a" stroke-width="1.1"/>
    <path d="M0 0 L-7 -24 M0 0 L0 -27 M0 0 L7 -24" stroke="#d8b49a" stroke-width="1.1" fill="none"/>
  </g>
  <g transform="translate(722 566) rotate(16) scale(0.95)" fill="#f0857b" stroke="#c96257" stroke-width="1.4">
    <path d="M0 -20 L6 -6 L20 -6 L9 4 L13 19 L0 10 L-13 19 L-9 4 L-20 -6 L-6 -6 Z"/>
  </g>

  <!-- sparkles -->
  <g opacity="0.9">
    <use xlink:href="#sparkle" href="#sparkle" transform="translate(350 216) scale(0.8)"/>
    <use xlink:href="#sparkle" href="#sparkle" transform="translate(452 236) scale(0.55)"/>
    <use xlink:href="#sparkle" href="#sparkle" transform="translate(252 500) scale(0.5)"/>
    <use xlink:href="#sparkle" href="#sparkle" transform="translate(648 500) scale(0.45)"/>
    <use xlink:href="#sparkle" href="#sparkle" transform="translate(300 330) scale(0.4)"/>
  </g>

  <!-- sand speckles -->
  <g fill="#b98f52" opacity="0.28">
    <circle cx="60" cy="420" r="2"/><circle cx="140" cy="440" r="1.6"/><circle cx="240" cy="412" r="2.2"/>
    <circle cx="470" cy="592" r="2"/><circle cx="540" cy="500" r="1.8"/><circle cx="740" cy="540" r="2.4"/>
    <circle cx="700" cy="596" r="2"/><circle cx="770" cy="486" r="1.7"/><circle cx="36" cy="586" r="2.1"/>
    <circle cx="360" cy="404" r="1.7"/><circle cx="620" cy="592" r="2"/><circle cx="100" cy="596" r="2"/>
  </g>
</svg>
