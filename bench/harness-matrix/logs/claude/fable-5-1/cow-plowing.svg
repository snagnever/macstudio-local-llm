<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec9ef"/>
      <stop offset="1" stop-color="#d9eefb"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a33"/>
      <stop offset="1" stop-color="#6b4423"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="960" height="330" fill="url(#sky)"/>
  <circle cx="850" cy="80" r="46" fill="#ffd94d"/>
  <circle cx="850" cy="80" r="60" fill="#ffd94d" opacity="0.25"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="180" cy="80" rx="60" ry="22"/>
    <ellipse cx="230" cy="70" rx="45" ry="18"/>
    <ellipse cx="140" cy="70" rx="35" ry="15"/>
    <ellipse cx="520" cy="120" rx="55" ry="18"/>
    <ellipse cx="565" cy="110" rx="38" ry="14"/>
  </g>

  <!-- distant hills -->
  <path d="M0,330 Q160,240 340,320 Q480,260 640,315 Q800,250 960,320 L960,340 L0,340 Z" fill="#7fb069"/>

  <!-- barn on the hill -->
  <g>
    <rect x="70" y="270" width="90" height="55" fill="#b5432e"/>
    <polygon points="60,270 115,235 170,270" fill="#7c2d1c"/>
    <rect x="103" y="295" width="24" height="30" fill="#5a1f12"/>
    <rect x="82" y="282" width="16" height="14" fill="#e8d8b0"/>
    <rect x="132" y="282" width="16" height="14" fill="#e8d8b0"/>
  </g>

  <!-- tree -->
  <g>
    <rect x="640" y="270" width="14" height="55" fill="#6b4a2b"/>
    <circle cx="647" cy="250" r="38" fill="#4e8c3f"/>
    <circle cx="620" cy="265" r="26" fill="#5da24c"/>
    <circle cx="675" cy="265" r="26" fill="#5da24c"/>
  </g>

  <!-- grass strip (unplowed, ahead of the cow) -->
  <rect x="0" y="330" width="960" height="270" fill="#7cae5a"/>

  <!-- plowed soil: behind and under the plow -->
  <path d="M300,600 L420,340 L960,340 L960,600 Z" fill="url(#soil)"/>

  <!-- furrow lines fanning toward viewer, behind the plow -->
  <g stroke="#4a2e14" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M640,370 L960,375"/>
    <path d="M615,410 L960,425"/>
    <path d="M585,460 L960,485"/>
    <path d="M550,520 L960,555"/>
  </g>
  <g stroke="#a4744a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M630,390 L960,398"/>
    <path d="M600,435 L960,452"/>
    <path d="M568,490 L960,518"/>
  </g>

  <!-- grass tufts on unplowed side -->
  <g stroke="#4e7a34" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M60,420 l-6,-18 M60,420 l0,-20 M60,420 l6,-18"/>
    <path d="M150,500 l-6,-20 M150,500 l0,-24 M150,500 l6,-20"/>
    <path d="M90,560 l-7,-22 M90,560 l0,-26 M90,560 l7,-22"/>
    <path d="M230,440 l-6,-18 M230,440 l0,-22 M230,440 l6,-18"/>
    <path d="M40,470 l-6,-18 M40,470 l0,-20 M40,470 l6,-18"/>
  </g>

  <!-- ==================== COW (facing left) ==================== -->
  <g>
    <!-- tail -->
    <path d="M508,352 Q548,380 536,450" stroke="#c8935f" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="537" cy="458" rx="9" ry="14" fill="#6b4423"/>

    <!-- far legs (darker) -->
    <rect x="330" y="430" width="20" height="72" rx="8" fill="#b07d4a"/>
    <rect x="455" y="430" width="20" height="72" rx="8" fill="#b07d4a"/>
    <rect x="330" y="492" width="20" height="14" rx="4" fill="#4a3320"/>
    <rect x="455" y="492" width="20" height="14" rx="4" fill="#4a3320"/>

    <!-- body -->
    <ellipse cx="400" cy="388" rx="118" ry="64" fill="#d9a066"/>
    <!-- patches -->
    <ellipse cx="440" cy="370" rx="44" ry="30" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="350" cy="405" rx="36" ry="26" fill="#ffffff" opacity="0.85"/>

    <!-- udder -->
    <ellipse cx="452" cy="446" rx="24" ry="16" fill="#f2b8c0"/>

    <!-- near legs -->
    <rect x="300" y="432" width="22" height="76" rx="8" fill="#d9a066"/>
    <rect x="485" y="432" width="22" height="76" rx="8" fill="#d9a066"/>
    <rect x="300" y="496" width="22" height="14" rx="4" fill="#3a2814"/>
    <rect x="485" y="496" width="22" height="14" rx="4" fill="#3a2814"/>

    <!-- neck + head -->
    <path d="M300,350 Q270,320 258,330 L285,395 Q310,400 318,380 Z" fill="#d9a066"/>
    <ellipse cx="255" cy="342" rx="40" ry="32" fill="#d9a066"/>
    <!-- muzzle -->
    <ellipse cx="228" cy="360" rx="27" ry="20" fill="#e8b98e"/>
    <ellipse cx="220" cy="358" rx="4" ry="5" fill="#7a4a2a"/>
    <ellipse cx="234" cy="362" rx="4" ry="5" fill="#7a4a2a"/>
    <!-- eye -->
    <circle cx="262" cy="332" r="6" fill="#2b1b10"/>
    <circle cx="264" cy="330" r="2" fill="#ffffff"/>
    <!-- ear -->
    <ellipse cx="288" cy="318" rx="16" ry="9" fill="#c8935f" transform="rotate(-25 288 318)"/>
    <!-- horns -->
    <path d="M252,314 Q246,294 258,286" stroke="#e8dcc0" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M274,312 Q282,294 272,284" stroke="#e8dcc0" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- harness: collar + trace ropes back to the plow -->
  <path d="M296,330 Q316,326 322,352 Q326,376 306,382" stroke="#5a3a1e" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M316,352 L586,442" stroke="#5a3a1e" stroke-width="5" fill="none"/>
  <path d="M310,376 L586,452" stroke="#5a3a1e" stroke-width="5" fill="none"/>

  <!-- ==================== PLOW ==================== -->
  <g>
    <!-- beam from traces to plow body -->
    <path d="M586,446 L648,470" stroke="#8a5a2e" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- plow body / moldboard -->
    <path d="M636,462 L668,462 L688,500 Q670,514 646,506 Z" fill="#9b9b9b"/>
    <path d="M646,506 L688,500 L700,512 L660,518 Z" fill="#6f6f6f"/>
    <!-- handles -->
    <path d="M660,470 L730,404" stroke="#8a5a2e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M672,482 L742,418" stroke="#8a5a2e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- turned earth at the blade -->
    <path d="M640,512 Q666,494 700,514 Q676,528 640,522 Z" fill="#5a3a1c"/>
    <circle cx="652" cy="520" r="5" fill="#4a2e14"/>
    <circle cx="684" cy="522" r="6" fill="#4a2e14"/>
  </g>

  <!-- ==================== FARMER ==================== -->
  <g>
    <!-- legs -->
    <path d="M786,470 L768,540" stroke="#3f5d8a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M786,470 L804,540" stroke="#3f5d8a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <rect x="756" y="536" width="24" height="12" rx="4" fill="#3a2814"/>
    <rect x="796" y="536" width="24" height="12" rx="4" fill="#3a2814"/>
    <!-- torso -->
    <path d="M786,474 L790,414" stroke="#b5432e" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- arms reaching the handles -->
    <path d="M790,424 L734,406" stroke="#b5432e" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M788,440 L746,420" stroke="#b5432e" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="732" cy="405" r="6" fill="#e8b98e"/>
    <circle cx="744" cy="420" r="6" fill="#e8b98e"/>
    <!-- head + hat -->
    <circle cx="792" cy="392" r="16" fill="#e8b98e"/>
    <path d="M770,384 L814,384 L810,376 Q792,364 776,376 Z" fill="#d8a832"/>
    <ellipse cx="792" cy="384" rx="24" ry="5" fill="#c09428"/>
  </g>

  <!-- birds -->
  <g stroke="#3c4c5a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M380,90 q10,-10 20,0 q10,-10 20,0"/>
    <path d="M450,60 q8,-8 16,0 q8,-8 16,0"/>
  </g>
</svg>
